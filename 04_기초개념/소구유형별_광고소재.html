<title>소구 유형별 광고 소재</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 브랜드별 한 블록 — 실제 소재 이미지 줄 + 짧은 볼 점. PDF 전 1차 수집용 */
:root{
  --bg:#ecebe6; --paper:#f8f7f3; --ink:#1b1b19; --muted:#6a6862; --line:#d3d1c8; --accent:#c4361c; --chip:#e2e0d8;
  --display:"Nanum Myeongjo","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--paper:#201f1c;--ink:#ecebe5;--muted:#a3a097;--line:#3a3933;--accent:#ec6a4c;--chip:#2c2b27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--paper:#201f1c;--ink:#ecebe5;--muted:#a3a097;--line:#3a3933;--accent:#ec6a4c;--chip:#2c2b27;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:48px}
h1{font-family:var(--display);font-size:clamp(28px,4.4vw,44px);line-height:1.2;margin:0 0 10px;text-wrap:balance}
header p{margin:0;max-width:64ch;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.key span{font-family:var(--mono);font-size:12px;background:var(--chip);padding:3px 8px;border-radius:3px}
section{display:grid;gap:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-top:2px solid var(--ink);padding-top:12px}
.head .no{font-family:var(--mono);color:var(--accent);font-size:14px}
.head h2{font-family:var(--display);font-size:clamp(22px,3vw,30px);margin:0;line-height:1.25}
.head .meta{color:var(--muted);font-size:13px}
.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.shots figure{margin:0;flex:0 0 auto;scroll-snap-align:start}
.shots img{height:min(360px,62vw);width:auto;max-width:none;display:block;border:1px solid var(--line);background:#fff}
.shots figcaption{font-size:12px;color:var(--muted);margin-top:4px;max-width:36ch}
.body{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;background:var(--paper);border:1px solid var(--line);padding:18px}
@media (max-width:760px){.body{grid-template-columns:1fr}}
.body h3{font-size:13px;margin:0 0 6px;letter-spacing:.04em}
.body ul{margin:0;padding-left:18px;display:grid;gap:5px}
.body b{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:12px;margin-right:4px}
.body a{color:var(--ink);text-underline-offset:3px}
.side{display:grid;gap:12px;align-content:start;font-size:13px}
.card{display:grid;gap:8px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.card .brand{font-weight:700;font-size:14px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .tip{color:var(--ink)}
.card .tip b{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500;margin-right:4px}
.def{background:var(--paper);border:1px solid var(--line);padding:14px 16px;font-size:14px}
.ind{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:3px;margin-right:6px}
footer{color:var(--muted);font-size:13px;max-width:70ch}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
<header>
  <h1>소구 유형별 광고 소재</h1>
  <p>국내에서 집행된 피드·SNS·옥외 광고만 모았습니다. 브랜드 이미지형, 문제제기형, 실제후기형, 제품증명형으로 나누고 혜택형을 참고로 덧붙였습니다. 카드마다 만들 때 가져올 점을 적었습니다.</p>
</header>
<main id="list" style="display:grid;gap:48px"></main>
<footer>이미지는 공부용으로 Pinterest에 수집된 실제 광고 캡처에서 가져왔습니다. 브랜드명이 이미지에서 확인되지 않은 소재는 제품군으로 적었습니다.</footer>
</div>

<script>
const T=[{"no": "01", "name": "브랜드 이미지형", "def": "제품의 분위기·세계관·모델로 “이 브랜드 갖고 싶다”를 만드는 소재. 정보는 최소, 카피는 짧게.", "items": [["kb_8fe80d3dc1.jpg", "메디큐브 · PDRN 핑크 세럼", "제품을 화면 앞쪽에 가장 크게, 모델은 뒤에서 손을 뻗어 원근으로 시선을 모아."], ["kb_b25f4af7.jpg", "메디큐브 · How I Glow (장원영)", "브랜드 컬러(핑크) 하나로 배경·의상·카피를 통일. 카피는 영문 한 줄."], ["kb_1a5e8877.jpg", "아누아 · 복숭아 라인", "원료(복숭아)를 크게 반복해 라인 이미지를 만들고 로고만 얹어."], ["kb_14c82ae5.jpg", "정관장 에브리타임 · 힘내고 싶은 모든 순간", "모델 + 감성 한 줄 카피. 제품은 손에 들려 자연스럽게 노출."], ["kb_cadf76c4.jpg", "맥심 · 진한 집중 한잔", "노란 단색 배경 + 원형 프레임 속 모델. 브랜드 컬러가 곧 배경."], ["kb_9354cb98.jpg", "토리든 · 밸런스풀 컨트롤 세럼 (CORTIS)", "아이돌 모델이 제품을 앞으로 내밀고, 카피 “컨트롤 못할 트러블은 없어”로 브랜드 태도를 말해."], ["kb_c6f1cf78.jpg", "아누아 × 케이팝 데몬 헌터스 콜라보 예고", "흰 배경에 제품 하나 + 콜라보 예고 카피. 정보는 최소, 기대감만."], ["kb_183248c27.jpg", "프립 · 대단한 시작은 없어", "세로 타이포가 화면 대부분, 인물은 하단에 작게. 문장 자체가 브랜드 메시지."], ["kb_027f0420.jpg", "일소 · 일등모공청소", "“일등모공청소” 세로 대형 카피 + 모델. 브랜드명(일소)을 말장난으로 각인."], ["kb_668d757c.jpg", "덴프스 · 공유가 선택한 유산균", "유명 모델 + “공유가 선택한” 한 줄. 회색 톤으로 차분하게."]]}, {"no": "02", "name": "문제제기형", "def": "타겟이 가진 고민을 질문·상황 문장으로 먼저 꺼내 “내 얘기네” 하고 멈추게 한 뒤 제품을 해결책으로 보여주는 소재.", "items": [["kp_e84677d2.jpg", "노도르 · 입냄새 걱정", "고민 문장을 자막처럼 하단에 크게. 상단엔 혜택(5박스 공짜)으로 클릭 이유를 더해."], ["kp_59c60669.jpg", "메디큐브 · 잡티 흔적 케어", "핑크 단색 위 제품 + 하단 고민 카피. 문제제기를 차분한 톤으로."], ["kp_4e0ad28b.jpg", "듀오락 · 유산균 찾고 계시죠?", "“유산균 찾고 계시죠?” 질문형 헤드라인 + 아기 사진으로 타겟(부모)을 바로 지목."], ["kp_008f9342.jpg", "셀인샷 · 화장이 자꾸만 뜨는 이유?", "“공들인 화장이 자꾸만 뜨는 이유?” 질문 + 원인(요철) 확대 사진."], ["kp_a9a785fd.jpg", "인솔 브랜드 · 코끼리 다리라면?", "“아무리 운동해도 코끼리 다리라면?” 고민을 하단에 크게, 원인 제품(인솔)을 위에."], ["kp_89e35a03.jpg", "문제집은 많이 풀었는데 왜 막힐까요?", "학습지 사진 위에 질문형 헤드라인. 체크리스트로 고민을 구체화."], ["kp_9772570d.jpg", "닥터지 · 내 피부가 원하는 것", "왼쪽 “원하는 것”, 오른쪽 “필요한 것” 체크리스트 + 제품을 든 손."], ["kp_6c8725aa.jpg", "코드글로컬러 · 속건조에 딱!", "“속건조에 딱!” 상황 키워드 + 할인율. 고민과 혜택을 한 화면에."], ["kp_396a84db.jpg", "도대체 뭐라고 써야 운동하러 오실건가요?", "“도대체 뭐라고 써야 운동하러 오실건가요?” 광고주가 직접 묻는 솔직한 톤(옥외)."], ["kp_cdc0e323.jpg", "넘버즈인 · 각질 싹 모공 짝", "“각질 싹- 모공 짝-” 고민 해결을 리듬감 있는 카피로, 가격(1만원대)을 크게."]]}, {"no": "03", "name": "실제후기형", "def": "실제 사용자의 말(별점, 마스킹 이름, 말투)이나 인플루언서·체험단 후기로 신뢰를 주는 소재.", "items": [["kr_2aa245a8.jpg", "퓨리카 · 실제 후기 인용", "후기 문장을 큰따옴표로 인용, 별점·마스킹 이름(최**님)으로 실제 후기 표시."], ["kr_215d0a9b.jpg", "큐라에스 · 더마3 콜라겐", "인물이 제품을 들고 친구에게 말하듯한 후기 톤 카피. 본문도 후기 말투."], ["kr_68248cf5.jpg", "토너패드 · 인플루언서 60인의 PICK", "상단 숫자(60인)로 규모, 아래 인플루언서 후기 말풍선을 반복."], ["kr_ad5a6770.jpg", "루아페 · 살구 비누향 향수 후기", "“제가 평생 찾던 살구 비누향 향수예요” 후기 한 문장을 헤드라인으로."], ["kr_272946d1.jpg", "닥터그루트 · 이게 되네..?", "“이게 되네..?” 놀람 리액션 + 사용 전 고민을 말풍선으로. 사용 장면 사진."], ["kr_b4f9dea4.jpg", "넘버즈인 · 사전체험단 100인 모집", "체험단 모집으로 후기를 모으는 소재. 물음표로 신제품 궁금증 유발."], ["kr_ed633705.jpg", "메노킨 · 화.잘.먹 버블팩", "“화.잘.먹” 줄임말 키워드 + 해시태그로 커뮤니티 후기 느낌."]]}, {"no": "04", "name": "제품증명형", "def": "임상 수치, 비포·애프터, 판매량, 수상, 성분·함량처럼 객관적 근거로 효과를 증명하는 소재.", "items": [["ke_1645460e.jpg", "아누아 · 히알루론 세럼 임상 수치", "수치 카드 나열. 수치마다 조건(히터 환경, 사용 직후)을 작게 붙여 신뢰도 ↑."], ["ke_c49b2fb0.jpg", "아누아 · 매끈함 만족도 100%", "“사용 후 매끈함 만족도 100%” 숫자 하나를 크게, 제품은 사선으로."], ["ke_98c043b7.jpg", "메디큐브 · 500만장 판매 돌파", "판매량(500만장)을 상단에, 효과 요약 카드 3개, 제품은 하단. 어두운 배경으로 프리미엄 톤."], ["ke_240a9019.jpg", "메디큐브 · 모공의 1/500 크기 세정", "세정력 수치(55%, 41%)를 사용 장면 옆에 카드로."], ["ke_e16d1d00.jpg", "메디큐브 · 2025 뷰티 대상", "수상(뷰티 대상) 타이틀 + 무대 조명 연출로 권위를 보여줘."], ["ke_b2503bc3.jpg", "페릴라 · 입냄새 고민 99.3%", "“입냄새 고민인 분 찾습니다” 문제제기 + 99.3% 수치로 증명까지."], ["ke_89afcf95.jpg", "잡티 착색 개선 503.8% UP", "503.8% UP 수치 + 모델 피부 클로즈업. 구성 상품은 하단 카드."], ["ke_06ad3f4e.jpg", "화잘먹 피부 비결 VS 비교", "VS 구도로 두 제품 효과를 비교. 수분/진정 키워드를 크게."], ["ke_d83a21f7.jpg", "메이크프렘 · Before/After", "Before/After 분할 사진 + 질문형 카피."], ["ke_e9981483.jpg", "FIXX · 처음 메이크업 그대로", "메이크업 지속력을 “그대로/지속/밀착” 키워드로 강조."], ["ke_08f458df.jpg", "라로슈포제 · 시카플라스트 B5+ 업그레이드", "기존 → 신제품 화살표(UPGRADE)로 개선점을 한눈에."], ["ke_2d0b94a8.jpg", "초유 속 풍부한 영양성분", "성분명을 원형 아이콘으로 제품 주위에 배치."], ["ke_ee733f42.jpg", "프로틴 딜라이트 · 단백질 20.5g", "단백질 20.5g / 당 9g 숫자를 하단에 크게. 제품은 중앙."], ["ke_890c24fa.jpg", "서울우유 맛있는우유GT · 산소 제거", "“산소 제거” 기술 키워드를 대형 타이포로, 우유팩은 가운데."]]}, {"no": "+", "name": "혜택·프로모션형 (참고)", "def": "할인율, 1+1, 마감 임박처럼 지금 사야 할 이유를 주는 소재. 국내 피드 광고에서 가장 흔한 유형이라 함께 넣었어요.", "items": [["ks_13034744.jpg", "메디큐브 · 설맞이 대할인", "시즌(설) 테마 오브제(복주머니)로 할인 이벤트를 연출."], ["ks_f63dcbeb.jpg", "핫소스 브랜드 · 마진포기", "“마진포기” 강한 한 단어 + 제품 반복 + 할인 조건."], ["ks_82408815.jpg", "세럽왕 × 네고왕 D-1 종료임박", "D-1 시계 오브제로 마감 임박 긴장감."], ["ks_6e9cf70c.jpg", "휴롬 · 이건 놓칠 수 없어", "귀여운 강아지로 멈추게 하고 “이건 놓칠 수 없어!!!” + 최대 46%."], ["ks_6088abb9.jpg", "한끼통살 · 나는 왜 할인 안해줌?", "“나는 왜 할인 안해줌?” 댓글 밈 형식으로 할인 이유를 재치 있게."], ["ks_54c2badf.jpg", "토리든 · 올영세일 1+1", "사용 장면(팩 바르기) + 올영세일 1+1, 7일만 10% 기간 강조."], ["ks_b615cd7c.jpg", "메디큐브 × 올리브영 · 오늘의 특가", "캐릭터 콜라보(쿠로미) + 해시태그 + SALE 20%."], ["ks_58afb138.jpg", "생활용품 창고 대개방 86%", "검정 배경 + 형광 초록 86% 숫자 하나로 승부."], ["ks_ba172c90.jpg", "포장 첫 주문 2,000원 할인", "파란 그리드 배경 위 음식을 든 손 3개, “포장 첫 주문 2,000원 할인”."]]}];
document.getElementById('list').innerHTML=T.map(t=>`
<section>
  <div class="head"><span class="no">${t.no}</span><h2>${t.name}</h2></div>
  <div class="def">${t.def}</div>
  <div class="cards">${t.items.map(([f,b,tip])=>`<figure class="card" style="margin:0"><img src="img_type/${f}" alt="${b}" loading="lazy"><div class="brand">${b}</div><p class="tip"><b>제작</b>${tip}</p></figure>`).join('')}</div>
</section>`).join('');
</script>

<title>퍼포먼스 마케팅 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 스프레드시트형 보드 — 카테고리 요약 → 고정 필터 바 → 펼쳐지는 행이 있는 표 */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #5f6878;
  --line: #dde1e8;
  --accent: #2d4fd6;
  --accent-soft: #e6ebfc;
  --warn: #a35b00;
  --warn-soft: #fff1dc;
  --row-hover: #f0f3fa;
  --c1: #c2410c; --c2: #b45309; --c3: #4d7c0f; --c4: #0f766e; --c5: #1d4ed8;
  --c6: #15803d; --c7: #b91c1c; --c8: #7e22ce; --c9: #be185d;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
    --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
    --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
    --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
  --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
  --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
  --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.chip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.empty { opacity: .45; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); flex: none; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 8px;
}
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.btn:focus-visible, .chip:focus-visible, th button:focus-visible, tr.row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-soft); color: var(--fg); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.pill button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
.count { color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.grid th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em;
  border-bottom: 1px solid var(--line); padding: 0; background: var(--surface);
}
.grid th button { all: unset; display: block; width: 100%; padding: 10px 12px; cursor: pointer; box-sizing: border-box; }
.grid th button:hover { color: var(--fg); }
.grid th .arrow { font-family: var(--font-mono); margin-left: 4px; }
.col-cat { width: 112px; } .col-note { width: 22%; } .col-sec { width: 20%; } .col-date { width: 104px; }
.grid td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; overflow-wrap: anywhere; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--row-hover); }
tr.row.open td { background: var(--row-hover); border-bottom-color: transparent; }
.catcell { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.note-title { font-weight: 600; }
.sec { display: flex; gap: 6px; align-items: flex-start; }
.flag { flex: none; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.preview { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

tr.detail td { padding: 4px 16px 18px; background: var(--row-hover); }
.detail-inner { max-width: 820px; display: grid; gap: 10px; }
.detail-inner .sum { color: var(--muted); font-size: 13px; border-left: 3px solid var(--cat); padding-left: 10px; }
.content > :first-child { margin-top: 0; }
.content p, .content ul, .content ol { margin: 6px 0; }
.content ul, .content ol { padding-left: 20px; }
.content li { margin: 2px 0; }
.content h4 { margin: 12px 0 4px; font-size: 13.5px; }
.content code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.content blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); background: var(--surface); border-radius: 0 6px 6px 0; }
.content blockquote.warn { border-left-color: var(--warn); background: var(--warn-soft); color: var(--fg); }
.content .tbl { overflow-x: auto; }
.content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; background: var(--surface); }
.content th, .content td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.content th { background: var(--bg); font-weight: 600; }
a { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a, .actions button { font-size: 12.5px; }
.empty-state { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  table.grid { table-layout: auto; }
  .grid colgroup { display: none; }
  .grid .c-prev, .grid .c-date { display: none; }
  .grid .c-cat { width: 76px; } .grid .c-note { width: 42%; }
  .catcell .lbl { font-size: 12px; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { tr.row td { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>퍼포먼스 마케팅 노트</h1>
    <span class="meta" id="meta"></span>
  </header>

  <div class="cats" id="cats" role="group" aria-label="카테고리 필터"></div>

  <div class="bar">
    <label class="search"><span hidden>검색</span>
      <input id="q" type="search" placeholder="검색 — 예: CPA, 이관, 세금계산서" autocomplete="off">
    </label>
    <button class="btn" id="flagBtn" aria-pressed="false">⚠️ 확인 필요만</button>
    <button class="btn" id="expandBtn">모두 펼치기</button>
    <button class="btn" id="resetBtn">필터 초기화</button>
    <span class="pill" id="notePill" hidden><span id="notePillText"></span><button id="notePillX" aria-label="노트 필터 해제">✕</button></span>
    <span class="count" id="count"></span>
  </div>

  <div class="sheet">
    <table class="grid">
      <colgroup><col class="col-cat"><col class="col-note"><col class="col-sec"><col class="col-prev"><col class="col-date"></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty-state" id="empty" hidden>조건에 맞는 항목이 없습니다. 검색어나 카테고리 필터를 바꿔 보세요.</div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const notes = Object.fromEntries(DATA.notes.map(n => [n.path, n]));
const catIndex = Object.fromEntries(DATA.cats.map((c, i) => [c, i]));
const catColor = c => `var(--c${(catIndex[c] ?? 0) % 9 + 1})`;
const rows = DATA.rows.map((r, i) => ({ ...r, id: i, n: notes[r.note],
  hay: (notes[r.note].title + " " + notes[r.note].summary + " " + r.section + " " + r.text + " " + notes[r.note].cat).toLowerCase() }));

const COLS = [
  { key: "cat", label: "카테고리", cls: "c-cat", val: r => catIndex[r.n.cat] * 1000 },
  { key: "note", label: "주제", cls: "c-note", val: r => r.n.title },
  { key: "sec", label: "항목", cls: "c-sec", val: r => r.section },
  { key: "prev", label: "내용", cls: "c-prev", val: r => r.text },
  { key: "date", label: "작성일", cls: "c-date", val: r => r.n.updated },
];

const store = {
  get() { try { return JSON.parse(localStorage.getItem("board-state") || "{}"); } catch { return {}; } },
  set(s) { try { localStorage.setItem("board-state", JSON.stringify(s)); } catch {} },
};
const saved = store.get();
const state = {
  cats: new Set((saved.cats || []).filter(c => c in catIndex)),
  q: saved.q || "", flag: !!saved.flag, note: notes[saved.note] ? saved.note : null,
  sort: saved.sort || { key: "cat", dir: 1 }, open: new Set(),
};
const persist = () => store.set({ cats: [...state.cats], q: state.q, flag: state.flag, note: state.note, sort: state.sort });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function filtered() {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter(r =>
    (!state.cats.size || state.cats.has(r.n.cat)) &&
    (!state.note || r.note === state.note) &&
    (!state.flag || r.flag) &&
    terms.every(t => r.hay.includes(t)));
}

function sorted(list) {
  const col = COLS.find(c => c.key === state.sort.key) || COLS[0];
  const base = (a, b) => catIndex[a.n.cat] - catIndex[b.n.cat] || a.n.title.localeCompare(b.n.title, "ko") || a.order - b.order;
  return list.slice().sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    const d = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "ko");
    return d * state.sort.dir || base(a, b);
  });
}

function renderCats() {
  const scope = rows.filter(r => (!state.note || r.note === state.note) && (!state.flag || r.flag));
  const counts = {};
  scope.forEach(r => counts[r.n.cat] = (counts[r.n.cat] || 0) + 1);
  const all = `<button class="chip" aria-pressed="${!state.cats.size}" data-cat="">전체 <span class="n">${scope.length}</span></button>`;
  $("cats").innerHTML = all + DATA.cats.map(c =>
    `<button class="chip${counts[c] ? "" : " empty"}" style="--cat:${catColor(c)}" aria-pressed="${state.cats.has(c)}" data-cat="${esc(c)}">
      <span class="dot"></span>${esc(c)} <span class="n">${counts[c] || 0}</span></button>`).join("");
}

function renderHead() {
  $("head").innerHTML = COLS.map(c => {
    const on = state.sort.key === c.key;
    return `<th class="${c.cls}" aria-sort="${on ? (state.sort.dir > 0 ? "ascending" : "descending") : "none"}">
      <button data-sort="${c.key}">${c.label}<span class="arrow">${on ? (state.sort.dir > 0 ? "↑" : "↓") : ""}</span></button></th>`;
  }).join("");
}

function renderBody() {
  const list = sorted(filtered());
  $("empty").hidden = list.length > 0;
  $("count").textContent = `${list.length}개 항목 · 노트 ${new Set(list.map(r => r.note)).size}개`;
  $("body").innerHTML = list.map(r => {
    const open = state.open.has(r.id);
    const main = `<tr class="row${open ? " open" : ""}" data-id="${r.id}" tabindex="0" aria-expanded="${open}" style="--cat:${catColor(r.n.cat)}">
      <td class="c-cat"><span class="catcell"><span class="dot"></span><span class="lbl">${esc(r.n.cat)}</span></span></td>
      <td class="c-note"><span class="note-title">${esc(r.n.title)}</span></td>
      <td class="c-sec"><span class="sec">${esc(r.section)}${r.flag ? '<span class="flag">확인 필요</span>' : ""}</span></td>
      <td class="c-prev"><span class="preview">${esc(r.text)}</span></td>
      <td class="c-date"><span class="date">${esc(r.n.updated)}</span></td></tr>`;
    if (!open) return main;
    return main + `<tr class="detail" style="--cat:${catColor(r.n.cat)}"><td colspan="5"><div class="detail-inner">
      ${r.n.summary && r.order === 0 ? `<div class="sum">${esc(r.n.summary)}</div>` : ""}
      <div class="content">${r.html}</div>
      <div class="actions">
        ${state.note === r.note ? "" : `<button class="btn" data-only="${esc(r.note)}">이 노트 전체 보기</button>`}
        <a class="btn" href="${esc(r.n.url)}" target="_blank" rel="noopener">GitHub에서 열기 ↗</a>
      </div></div></td></tr>`;
  }).join("");
  $("expandBtn").textContent = list.length && list.every(r => state.open.has(r.id)) ? "모두 접기" : "모두 펼치기";
}

function renderBar() {
  $("q").value = state.q;
  $("flagBtn").setAttribute("aria-pressed", state.flag);
  $("notePill").hidden = !state.note;
  if (state.note) $("notePillText").textContent = "노트: " + notes[state.note].title;
}

function render() { renderCats(); renderHead(); renderBar(); renderBody(); persist(); }

function showNote(path) {
  if (!notes[path]) return;
  state.note = path; state.cats.clear(); state.q = ""; state.flag = false;
  state.open = new Set(rows.filter(r => r.note === path).map(r => r.id));
  render(); window.scrollTo({ top: 0 });
}

$("cats").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const c = b.dataset.cat;
  if (!c) state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
  render();
});
$("head").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if (!b) return;
  const k = b.dataset.sort;
  state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === "date" ? -1 : 1) };
  render();
});
$("body").addEventListener("click", e => {
  const link = e.target.closest(".note-link");
  if (link) { e.preventDefault(); showNote(link.dataset.note); return; }
  const only = e.target.closest("[data-only]");
  if (only) { showNote(only.dataset.only); return; }
  if (e.target.closest("a, button, .detail")) return;
  const tr = e.target.closest("tr.row"); if (!tr) return;
  const id = +tr.dataset.id;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  renderBody();
});
$("body").addEventListener("keydown", e => {
  const tr = e.target.closest("tr.row");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); }
});
let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; renderCats(); renderBody(); persist(); }, 120); });
$("flagBtn").addEventListener("click", () => { state.flag = !state.flag; render(); });
$("notePillX").addEventListener("click", () => { state.note = null; state.open.clear(); render(); });
$("resetBtn").addEventListener("click", () => { state.cats.clear(); state.q = ""; state.flag = false; state.note = null; state.open.clear(); state.sort = { key: "cat", dir: 1 }; render(); });
$("expandBtn").addEventListener("click", () => {
  const list = filtered();
  const allOpen = list.length && list.every(r => state.open.has(r.id));
  list.forEach(r => allOpen ? state.open.delete(r.id) : state.open.add(r.id));
  renderBody();
});

const last = DATA.notes.map(n => n.updated).sort().pop() || "";
$("meta").textContent = `노트 ${DATA.notes.length} · 항목 ${rows.length} · 최근 업데이트 ${last}`;
render();
</script>

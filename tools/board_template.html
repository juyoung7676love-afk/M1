<title>퍼포먼스 마케팅 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 스프레드시트형 보드 — 카테고리 요약 → 고정 필터 바 → 펼쳐지는 행이 있는 표 */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #5f6878;
  --line: #dde1e8;
  --accent: #2d4fd6;
  --accent-soft: #e6ebfc;
  --warn: #a35b00;
  --warn-soft: #fff1dc;
  --row-hover: #f0f3fa;
  --c1: #c2410c; --c2: #b45309; --c3: #4d7c0f; --c4: #0f766e; --c5: #1d4ed8;
  --c6: #15803d; --c7: #b91c1c; --c8: #7e22ce; --c9: #be185d; --c10: #6d5a2e;
  --star: #c98a00; --pin-bg: #fff8e6; --mark: #ffe58a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
    --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
    --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
    --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6; --c10: #d6b46a; --star: #f5c04a; --pin-bg: #2a2416; --mark: #6b5310;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
  --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
  --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
  --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6; --c10: #d6b46a; --star: #f5c04a; --pin-bg: #2a2416; --mark: #6b5310;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.chip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.empty { opacity: .45; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); flex: none; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 8px;
}
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.btn:focus-visible, .chip:focus-visible, th button:focus-visible, tr.row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-soft); color: var(--fg); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.pill button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
.count { color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.grid th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em;
  border-bottom: 1px solid var(--line); padding: 0; background: var(--surface);
}
.grid th button { all: unset; display: block; width: 100%; padding: 10px 12px; cursor: pointer; box-sizing: border-box; }
.grid th button:hover { color: var(--fg); }
.grid th .arrow { font-family: var(--font-mono); margin-left: 4px; }
.col-cat { width: 112px; } .col-note { width: 22%; } .col-sec { width: 20%; } .col-date { width: 104px; }
.grid td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; overflow-wrap: anywhere; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--row-hover); }
tr.row.open td { background: var(--row-hover); border-bottom-color: transparent; }
.catcell { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.note-title { font-weight: 600; }
.star { color: var(--star); margin-right: 4px; }
tr.row.pinned td { background: var(--pin-bg); }
tr.row.pinned:hover td, tr.row.pinned.open td { background: var(--row-hover); }
.sec { display: flex; gap: 6px; align-items: flex-start; }
.flag { flex: none; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.preview { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

tr.detail td { padding: 4px 16px 18px; background: var(--row-hover); }
.detail-inner { max-width: 820px; display: grid; gap: 10px; }
.detail-inner .sum { color: var(--muted); font-size: 13px; border-left: 3px solid var(--cat); padding-left: 10px; }
.content > :first-child { margin-top: 0; }
.content p, .content ul, .content ol { margin: 6px 0; }
.content ul, .content ol { padding-left: 20px; }
.content li { margin: 2px 0; }
.content h4 { margin: 12px 0 4px; font-size: 13.5px; }
.content code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.content blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); background: var(--surface); border-radius: 0 6px 6px 0; }
.content blockquote.warn { border-left-color: var(--warn); background: var(--warn-soft); color: var(--fg); }
.content .tbl { overflow-x: auto; }
.content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; background: var(--surface); }
.content th, .content td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.content th { background: var(--bg); font-weight: 600; }
a { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a, .actions button { font-size: 12.5px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; }
.search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
/* 상단 탭: 노트 보드 / 문장 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { all: unset; cursor: pointer; padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tab .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-weight: 400; }

/* 문장 탭 */
.sent { display: grid; gap: 14px; max-width: 760px; }
.compose { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.compose textarea { width: 100%; min-height: 92px; resize: vertical; font: inherit; font-size: 15px; line-height: 1.65; color: var(--fg); background: transparent; border: 0; padding: 4px 2px; }
.compose textarea:focus { outline: none; }
.compose:focus-within { border-color: var(--accent); }
.compose-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.compose-row input { flex: 1 1 160px; min-width: 0; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:disabled { opacity: .5; cursor: default; }
.hint { color: var(--muted); font-size: 12px; }
.sent-status { color: var(--muted); font-size: 13px; }
.sent-status.err { color: var(--warn); }
.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.card .txt { white-space: pre-wrap; font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.card .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.card .foot .date { font-size: 11.5px; }
.tagchip { background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 1px 8px; font-size: 12px; border: 0; font: inherit; font-size: 12px; cursor: pointer; }
.card .ops { margin-left: auto; display: flex; gap: 4px; }
.card .ops button { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.card .ops button:hover { color: var(--fg); background: var(--row-hover); }
.card textarea { width: 100%; min-height: 80px; font: inherit; font-size: 15px; line-height: 1.65; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
/* 에세이 탭 */
.essay { display: grid; gap: 14px; max-width: 820px; }
.ecard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.ecard > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; padding: 14px 16px; display: grid; gap: 6px; }
.ecard > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }
.ecard h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
.ecard .esum { color: var(--muted); font-size: 13.5px; }
.ecard .emeta { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.ecard .ebody { padding: 0 16px 16px; border-top: 1px solid var(--line); }
.ecard .ebody h3 { font-size: 14.5px; margin: 16px 0 6px; }
.ecard .ebody .content { font-size: 14.5px; line-height: 1.75; }
.empty-state { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  table.grid { table-layout: auto; }
  .grid colgroup { display: none; }
  .grid .c-prev, .grid .c-date { display: none; }
  .grid .c-cat { width: 76px; } .grid .c-note { width: 42%; }
  .catcell .lbl { font-size: 12px; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { tr.row td { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>퍼포먼스 마케팅 노트</h1>
    <span class="meta" id="meta"></span>
  </header>

  <nav class="tabs" role="tablist" aria-label="보기">
    <button class="tab" role="tab" id="tabEssay" data-view="essay" aria-selected="false">에세이 <span class="n" id="essayCount"></span></button>
    <button class="tab" role="tab" id="tabNotes" data-view="notes" aria-selected="true">실무인사이트</button>
    <button class="tab" role="tab" id="tabSent" data-view="sent" aria-selected="false">문장 <span class="n" id="sentCount"></span></button>
  </nav>

  <section class="essay" id="viewEssay" hidden>
    <div class="search"><input id="eq" type="search" placeholder="에세이 검색 — 제목·본문 전체" autocomplete="off"></div>
    <div class="sent-status" id="eStatus"></div>
    <div class="cards" id="ecards"></div>
  </section>

  <section class="sent" id="viewSent" hidden>
    <div class="compose" id="compose">
      <label for="sText" hidden>문장</label>
      <textarea id="sText" placeholder="일상에서 떠오른 생각·문장을 적어 두세요"></textarea>
      <div class="compose-row">
        <input id="sTag" placeholder="태그 (선택) — 예: 카피, 관찰, 소비심리" autocomplete="off">
        <button class="btn primary" id="sSave" disabled>저장</button>
      </div>
      <span class="hint">Ctrl/⌘ + Enter로 저장</span>
    </div>
    <div class="search"><input id="sq" type="search" placeholder="문장 검색" autocomplete="off"></div>
    <div class="sent-status" id="sStatus">불러오는 중…</div>
    <div class="cards" id="cards"></div>
  </section>

  <div id="viewNotes" style="display:contents">
  <div class="cats" id="cats" role="group" aria-label="카테고리 필터"></div>

  <div class="bar">
    <label class="search"><span hidden>검색</span>
      <input id="q" type="search" placeholder="검색 — 예: CPA, 이관, 세금계산서" autocomplete="off"><kbd>/</kbd>
    </label>
    <button class="btn" id="flagBtn" aria-pressed="false">⚠️ 확인 필요만</button>
    <button class="btn" id="expandBtn">모두 펼치기</button>
    <button class="btn" id="resetBtn">필터 초기화</button>
    <span class="pill" id="notePill" hidden><span id="notePillText"></span><button id="notePillX" aria-label="노트 필터 해제">✕</button></span>
    <span class="count" id="count"></span>
  </div>

  <div class="sheet">
    <table class="grid">
      <colgroup><col class="col-cat"><col class="col-note"><col class="col-sec"><col class="col-prev"><col class="col-date"></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty-state" id="empty" hidden>조건에 맞는 항목이 없습니다. 검색어나 카테고리 필터를 바꿔 보세요.</div>
  </div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const notes = Object.fromEntries(DATA.notes.map(n => [n.path, n]));
const catIndex = Object.fromEntries(DATA.cats.map((c, i) => [c, i]));
const catColor = c => `var(--c${(catIndex[c] ?? 0) % 10 + 1})`;
const rows = DATA.rows.map((r, i) => ({ ...r, id: i, n: notes[r.note],
  hay: (notes[r.note].title + " " + notes[r.note].summary + " " + r.section + " " + r.text + " " + notes[r.note].cat).toLowerCase() }));
rows.forEach(r => r.hay2 = r.hay.replace(/\s+/g, ""));
const getTerms = () => state.q.toLowerCase().split(/\s+/).filter(Boolean);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// 검색어 강조: 띄어쓰기 무시(예: "세금계산서" ↔ "세금 계산서")
function termRe() {
  const ts = getTerms(); if (!ts.length) return null;
  return new RegExp("(" + ts.map(t => [...t].map(reEsc).join("\\s*")).sort((a, b) => b.length - a.length).join("|") + ")", "gi");
}
const hl = (text, re) => re ? esc(text).replace(re, "<mark>$1</mark>") : esc(text);
function hlDom(root, re) {
  if (!re) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    re.lastIndex = 0; if (!re.test(n.nodeValue)) return;
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
    n.replaceWith(...span.childNodes);
  });
}

const COLS = [
  { key: "cat", label: "카테고리", cls: "c-cat", val: r => catIndex[r.n.cat] * 1000 },
  { key: "note", label: "주제", cls: "c-note", val: r => r.n.title },
  { key: "sec", label: "항목", cls: "c-sec", val: r => r.section },
  { key: "prev", label: "내용", cls: "c-prev", val: r => r.text },
  { key: "date", label: "작성일", cls: "c-date", val: r => r.n.updated },
];

const store = {
  get() { try { return JSON.parse(localStorage.getItem("board-state") || "{}"); } catch { return {}; } },
  set(s) { try { localStorage.setItem("board-state", JSON.stringify(s)); } catch {} },
};
const saved = store.get();
const state = {
  cats: new Set((saved.cats || []).filter(c => c in catIndex)),
  q: saved.q || "", flag: !!saved.flag, note: notes[saved.note] ? saved.note : null,
  sort: saved.sort || { key: "cat", dir: 1 }, open: new Set(),
};
const persist = () => store.set({ cats: [...state.cats], q: state.q, flag: state.flag, note: state.note, sort: state.sort });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function filtered() {
  const terms = getTerms();
  return rows.filter(r =>
    (!state.cats.size || state.cats.has(r.n.cat)) &&
    (!state.note || r.note === state.note) &&
    (state.cats.size || state.note || !r.n.mirror) &&
    (!state.flag || r.flag) &&
    terms.every(t => r.hay.includes(t) || r.hay2.includes(t)));
}

function sorted(list) {
  const col = COLS.find(c => c.key === state.sort.key) || COLS[0];
  const base = (a, b) => catIndex[a.n.cat] - catIndex[b.n.cat] || a.n.title.localeCompare(b.n.title, "ko") || a.order - b.order;
  return list.slice().sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    const d = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "ko");
    return (b.n.pin - a.n.pin) || d * state.sort.dir || base(a, b);
  });
}

function renderCats() {
  const scope = rows.filter(r => (!state.note || r.note === state.note) && (!state.flag || r.flag));
  const counts = {};
  scope.forEach(r => counts[r.n.cat] = (counts[r.n.cat] || 0) + 1);
  const all = `<button class="chip" aria-pressed="${!state.cats.size}" data-cat="">전체 <span class="n">${scope.filter(r => state.note || !r.n.mirror).length}</span></button>`;
  $("cats").innerHTML = all + DATA.cats.map(c =>
    `<button class="chip${counts[c] ? "" : " empty"}" style="--cat:${catColor(c)}" aria-pressed="${state.cats.has(c)}" data-cat="${esc(c)}">
      <span class="dot"></span>${esc(c)} <span class="n">${counts[c] || 0}</span></button>`).join("");
}

function renderHead() {
  $("head").innerHTML = COLS.map(c => {
    const on = state.sort.key === c.key;
    return `<th class="${c.cls}" aria-sort="${on ? (state.sort.dir > 0 ? "ascending" : "descending") : "none"}">
      <button data-sort="${c.key}">${c.label}<span class="arrow">${on ? (state.sort.dir > 0 ? "↑" : "↓") : ""}</span></button></th>`;
  }).join("");
}

function renderBody() {
  const list = sorted(filtered());
  const re = termRe();
  $("empty").hidden = list.length > 0;
  $("count").textContent = `${list.length}개 항목 · 노트 ${new Set(list.map(r => r.note)).size}개`;
  $("body").innerHTML = list.map(r => {
    const open = state.open.has(r.id);
    const main = `<tr class="row${open ? " open" : ""}${r.n.pin ? " pinned" : ""}" data-id="${r.id}" tabindex="0" aria-expanded="${open}" style="--cat:${catColor(r.n.cat)}">
      <td class="c-cat"><span class="catcell"><span class="dot"></span><span class="lbl">${esc(r.n.cat)}</span></span></td>
      <td class="c-note"><span class="note-title">${r.n.pin ? '<span class="star" aria-label="상단 고정">★</span>' : ""}${hl(r.n.title, re)}</span></td>
      <td class="c-sec"><span class="sec"><span>${hl(r.section, re)}</span>${r.flag ? '<span class="flag">확인 필요</span>' : ""}</span></td>
      <td class="c-prev"><span class="preview">${hl(snippet(r.text, re), re)}</span></td>
      <td class="c-date"><span class="date">${esc(r.n.updated)}</span></td></tr>`;
    if (!open) return main;
    return main + `<tr class="detail" style="--cat:${catColor(r.n.cat)}"><td colspan="5"><div class="detail-inner">
      ${r.n.summary && r.order === 0 ? `<div class="sum">${esc(r.n.summary)}</div>` : ""}
      <div class="content">${r.html}</div>
      <div class="actions">
        ${state.note === r.note ? "" : `<button class="btn" data-only="${esc(r.note)}">이 노트 전체 보기</button>`}
        <a class="btn" href="${esc(r.n.url)}" target="_blank" rel="noopener">GitHub에서 열기 ↗</a>
      </div></div></td></tr>`;
  }).join("");
  document.querySelectorAll("#body .content, #body .sum").forEach(el => hlDom(el, re));
  $("expandBtn").textContent = list.length && list.every(r => state.open.has(r.id)) ? "모두 접기" : "모두 펼치기";
}

// 미리보기: 검색어가 뒤쪽에 있으면 그 주변을 보여 준다
function snippet(text, re) {
  if (!re) return text;
  re.lastIndex = 0; const m = re.exec(text); re.lastIndex = 0;
  if (!m || m.index < 40) return text;
  return "…" + text.slice(m.index - 30);
}

function renderBar() {
  $("q").value = state.q;
  $("flagBtn").setAttribute("aria-pressed", state.flag);
  $("notePill").hidden = !state.note;
  if (state.note) $("notePillText").textContent = "노트: " + notes[state.note].title;
}

function render() { renderCats(); renderHead(); renderBar(); renderBody(); persist(); }

function showNote(path) {
  if (!notes[path]) return;
  state.note = path; state.cats.clear(); state.q = ""; state.flag = false;
  state.open = new Set(rows.filter(r => r.note === path).map(r => r.id));
  render(); window.scrollTo({ top: 0 });
}

$("cats").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const c = b.dataset.cat;
  if (!c) state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
  render();
});
$("head").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if (!b) return;
  const k = b.dataset.sort;
  state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === "date" ? -1 : 1) };
  render();
});
$("body").addEventListener("click", e => {
  const link = e.target.closest(".note-link");
  if (link) { e.preventDefault(); showNote(link.dataset.note); return; }
  const only = e.target.closest("[data-only]");
  if (only) { showNote(only.dataset.only); return; }
  if (e.target.closest("a, button, .detail")) return;
  const tr = e.target.closest("tr.row"); if (!tr) return;
  const id = +tr.dataset.id;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  renderBody();
});
$("body").addEventListener("keydown", e => {
  const tr = e.target.closest("tr.row");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); }
});
let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; renderCats(); renderBody(); persist(); }, 120); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $({ essay: "eq", notes: "q", sent: "sq" }[curView]).focus(); }
  else if (e.key === "Escape" && document.activeElement === $("q")) { state.q = ""; $("q").value = ""; renderCats(); renderBody(); persist(); }
});
$("flagBtn").addEventListener("click", () => { state.flag = !state.flag; render(); });
$("notePillX").addEventListener("click", () => { state.note = null; state.open.clear(); render(); });
$("resetBtn").addEventListener("click", () => { state.cats.clear(); state.q = ""; state.flag = false; state.note = null; state.open.clear(); state.sort = { key: "cat", dir: 1 }; render(); });
$("expandBtn").addEventListener("click", () => {
  const list = filtered();
  const allOpen = list.length && list.every(r => state.open.has(r.id));
  list.forEach(r => allOpen ? state.open.delete(r.id) : state.open.add(r.id));
  renderBody();
});

// ── 탭 ──
const VIEWS = { essay: "viewEssay", notes: "viewNotes", sent: "viewSent" };
const TABS = { essay: "tabEssay", notes: "tabNotes", sent: "tabSent" };
let curView = "notes";
function setView(v) {
  if (!VIEWS[v]) v = "notes";
  curView = v;
  $("viewEssay").hidden = v !== "essay";
  $("viewSent").hidden = v !== "sent";
  $("viewNotes").style.display = v === "notes" ? "contents" : "none";
  Object.entries(TABS).forEach(([k, id]) => $(id).setAttribute("aria-selected", k === v));
  try { localStorage.setItem("board-view", v); } catch {}
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setView(b.dataset.view); });
let initView = "notes"; try { initView = localStorage.getItem("board-view") || "notes"; } catch {}
const hashView = { "#문장": "sent", "#sent": "sent", "#에세이": "essay", "#essay": "essay" }[decodeURIComponent(location.hash)];
setView(hashView || initView);

// ── 에세이 탭 ──
const essays = (DATA.essays || []).map((e, i) => ({ ...e, id: i, hay: (e.title + " " + e.summary + " " + e.text).toLowerCase() }));
const E = { q: "", open: new Set() };
function renderEssays() {
  $("essayCount").textContent = essays.length || "";
  const terms = E.q.toLowerCase().split(/\s+/).filter(Boolean);
  const re = terms.length ? new RegExp("(" + terms.map(t => [...t].map(reEsc).join("\\s*")).join("|") + ")", "gi") : null;
  const list = essays.filter(e => terms.every(t => e.hay.includes(t) || e.hay.replace(/\s+/g, "").includes(t)));
  $("eStatus").textContent = !essays.length ? "아직 에세이가 없어요. 채팅으로 에세이를 보내 주시면 여기에 정리됩니다."
    : terms.length ? `${list.length}개 에세이` + (list.length ? "" : " — 검색어를 바꿔 보세요.") : "";
  $("ecards").innerHTML = list.map(e => {
    const open = E.open.has(e.id) || (terms.length && list.length === 1);
    return `<article class="ecard" data-id="${e.id}">
      <button aria-expanded="${!!open}"><h2>${hl(e.title, re)}</h2>
        ${e.summary ? `<div class="esum">${hl(e.summary, re)}</div>` : ""}
        <div class="emeta">${esc(e.created)}${open ? " · 접기 ▲" : " · 펼쳐 읽기 ▼"}</div></button>
      ${open ? `<div class="ebody"><div class="content">${e.html}</div>
        <div class="actions" style="margin-top:12px"><a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">GitHub에서 열기 ↗</a></div></div>` : ""}
    </article>`;
  }).join("");
  document.querySelectorAll("#ecards .ebody .content").forEach(el => hlDom(el, re));
}
$("ecards").addEventListener("click", e => {
  const link = e.target.closest(".note-link");
  if (link) { e.preventDefault(); setView("notes"); showNote(link.dataset.note); return; }
  const b = e.target.closest(".ecard > button"); if (!b) return;
  const id = +b.parentElement.dataset.id;
  E.open.has(id) ? E.open.delete(id) : E.open.add(id);
  renderEssays();
});
let et; $("eq").addEventListener("input", ev => { clearTimeout(et); et = setTimeout(() => { E.q = ev.target.value; renderEssays(); }, 120); });
renderEssays();

// ── 문장 탭: 아티팩트 db의 sentences 컬렉션 ──
const S = { db: null, items: [], canWrite: false, editing: null, q: "", tag: "" };
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); };
function status(msg, err) { $("sStatus").textContent = msg; $("sStatus").classList.toggle("err", !!err); $("sStatus").hidden = !msg; }
function renderSent() {
  $("sentCount").textContent = S.items.length || "";
  $("compose").hidden = !S.canWrite;
  const terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = S.items.filter(it => {
    const hay = ((it.text || "") + " " + (it.tag || "")).toLowerCase();
    return (!S.tag || it.tag === S.tag) && terms.every(t => hay.includes(t) || hay.replace(/\s+/g, "").includes(t));
  });
  const re = terms.length ? new RegExp("(" + terms.map(t => [...t].map(reEsc).join("\\s*")).join("|") + ")", "gi") : null;
  if (S.db && !S.items.length) status(S.canWrite ? "아직 적은 문장이 없어요. 위에 첫 문장을 적어 보세요." : "아직 문장이 없어요.");
  else if (S.db) status(S.q || S.tag ? `${list.length}개 문장${S.tag ? ` · 태그: ${S.tag} (태그를 다시 누르면 해제)` : ""}` : "");
  $("cards").innerHTML = list.map(it => {
    const editing = S.editing === it.id;
    return `<article class="card" data-id="${esc(it.id)}">
      ${editing ? `<textarea class="edit-text">${esc(it.text)}</textarea>` : `<div class="txt">${hl(it.text || "", re)}</div>`}
      <div class="foot">
        ${it.tag ? `<button class="tagchip" data-tag="${esc(it.tag)}">#${esc(it.tag)}</button>` : ""}
        <span class="date">${esc(fmtDate(it.createdAt))}</span>
        ${S.canWrite ? `<span class="ops">${editing
          ? `<button data-op="save">저장</button><button data-op="cancel">취소</button>`
          : `<button data-op="edit">수정</button><button data-op="del">삭제</button>`}</span>` : ""}
      </div></article>`;
  }).join("");
}
async function initSent() {
  const timer = setTimeout(() => { if (!S.db) status("문장 저장소에 연결하지 못했어요. claude.ai에서 페이지를 열어 주세요.", true); }, 10000);
  const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { clearTimeout(timer); status("문장 탭은 claude.ai에서 열었을 때(로그인 상태) 저장·조회할 수 있어요.", true); $("compose").hidden = true; return; }
  const user = await window.claude.use("user").catch(() => null);
  S.canWrite = user ? (await user.canEdit().catch(() => false)) : false;
  S.db = db;
  db.collection("sentences").orderBy("createdAt", "desc").onSnapshot(snap => {
    clearTimeout(timer);
    S.items = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
    renderSent();
  }, e => { clearTimeout(timer); status(e.code === "revoked" ? "" : "문장을 불러오지 못했어요.", true); });
}
$("sText").value = (() => { try { return localStorage.getItem("sent-draft") || ""; } catch { return ""; } })();
const syncSave = () => { $("sSave").disabled = !$("sText").value.trim(); try { localStorage.setItem("sent-draft", $("sText").value); } catch {} };
$("sText").addEventListener("input", syncSave); syncSave();
async function saveSentence() {
  const text = $("sText").value.trim(); if (!text || !S.db) return;
  $("sSave").disabled = true;
  try {
    await S.db.collection("sentences").add({ text, tag: $("sTag").value.trim(), createdAt: new Date().toISOString() });
    $("sText").value = ""; syncSave(); $("sText").focus();
  } catch (e) {
    status(e.code === "invalid_argument" ? "이 계정에는 쓰기 권한이 없어요." : e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요." : "저장하지 못했어요. 다시 시도해 주세요.", true);
    if (e.code === "invalid_argument") { S.canWrite = false; renderSent(); }
    syncSave();
  }
}
$("sSave").addEventListener("click", saveSentence);
$("sText").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveSentence(); } });
let st; $("sq").addEventListener("input", e => { clearTimeout(st); st = setTimeout(() => { S.q = e.target.value; renderSent(); }, 120); });
$("cards").addEventListener("click", async e => {
  const tag = e.target.closest("[data-tag]");
  if (tag) { S.tag = S.tag === tag.dataset.tag ? "" : tag.dataset.tag; renderSent(); return; }
  const b = e.target.closest("[data-op]"); if (!b) return;
  const id = b.closest(".card").dataset.id, ref = S.db.collection("sentences").doc(id);
  try {
    if (b.dataset.op === "edit") { S.editing = id; renderSent(); b.closest(".cards").querySelector(".edit-text")?.focus(); }
    else if (b.dataset.op === "cancel") { S.editing = null; renderSent(); }
    else if (b.dataset.op === "save") { const t = b.closest(".card").querySelector(".edit-text").value.trim(); if (t) await ref.update({ text: t }); S.editing = null; renderSent(); }
    else if (b.dataset.op === "del" && confirm("이 문장을 삭제할까요?")) await ref.delete();
  } catch { status("변경하지 못했어요. 다시 시도해 주세요.", true); }
});
initSent();

const last = DATA.notes.map(n => n.updated).sort().pop() || "";
$("meta").textContent = `노트 ${DATA.notes.length} · 항목 ${rows.length} · 최근 업데이트 ${last}`;
render();
</script>

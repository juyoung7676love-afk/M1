<title>퍼포먼스 마케팅 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 스프레드시트형 보드 — 카테고리 요약 → 고정 필터 바 → 펼쳐지는 행이 있는 표 */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #5f6878;
  --line: #dde1e8;
  --accent: #2d4fd6;
  --accent-soft: #e6ebfc;
  --warn: #a35b00;
  --warn-soft: #fff1dc;
  --row-hover: #f0f3fa;
  --c1: #c2410c; --c2: #b45309; --c3: #4d7c0f; --c4: #0f766e; --c5: #1d4ed8;
  --c6: #15803d; --c7: #b91c1c; --c8: #7e22ce; --c9: #be185d;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
    --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
    --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
    --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
  --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
  --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
  --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.chip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.empty { opacity: .45; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); flex: none; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 8px;
}
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.btn:focus-visible, .chip:focus-visible, th button:focus-visible, tr.row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-soft); color: var(--fg); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.pill button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
.count { color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.grid th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em;
  border-bottom: 1px solid var(--line); padding: 0; background: var(--surface);
}
.grid th button { all: unset; display: block; width: 100%; padding: 10px 12px; cursor: pointer; box-sizing: border-box; }
.grid th button:hover { color: var(--fg); }
.grid th .arrow { font-family: var(--font-mono); margin-left: 4px; }
.col-cat { width: 112px; } .col-note { width: 22%; } .col-sec { width: 20%; } .col-date { width: 104px; }
.grid td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; overflow-wrap: anywhere; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--row-hover); }
tr.row.open td { background: var(--row-hover); border-bottom-color: transparent; }
.catcell { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.note-title { font-weight: 600; }
.sec { display: flex; gap: 6px; align-items: flex-start; }
.flag { flex: none; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.preview { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

tr.detail td { padding: 4px 16px 18px; background: var(--row-hover); }
.detail-inner { max-width: 820px; display: grid; gap: 10px; }
.detail-inner .sum { color: var(--muted); font-size: 13px; border-left: 3px solid var(--cat); padding-left: 10px; }
.content > :first-child { margin-top: 0; }
.content p, .content ul, .content ol { margin: 6px 0; }
.content ul, .content ol { padding-left: 20px; }
.content li { margin: 2px 0; }
.content h4 { margin: 12px 0 4px; font-size: 13.5px; }
.content code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.content blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); background: var(--surface); border-radius: 0 6px 6px 0; }
.content blockquote.warn { border-left-color: var(--warn); background: var(--warn-soft); color: var(--fg); }
.content .tbl { overflow-x: auto; }
.content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; background: var(--surface); }
.content th, .content td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.content th { background: var(--bg); font-weight: 600; }
a { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a, .actions button { font-size: 12.5px; }
.empty-state { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  table.grid { table-layout: auto; }
  .grid colgroup { display: none; }
  .grid .c-prev, .grid .c-date { display: none; }
  .grid .c-cat { width: 76px; } .grid .c-note { width: 42%; }
  .catcell .lbl { font-size: 12px; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { tr.row td { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>퍼포먼스 마케팅 노트</h1>
    <span class="meta" id="meta"></span>
  </header>

  <div class="cats" id="cats" role="group" aria-label="카테고리 필터"></div>

  <div class="bar">
    <label class="search"><span hidden>검색</span>
      <input id="q" type="search" placeholder="검색 — 예: CPA, 이관, 세금계산서" autocomplete="off">
    </label>
    <button class="btn" id="flagBtn" aria-pressed="false">⚠️ 확인 필요만</button>
    <button class="btn" id="expandBtn">모두 펼치기</button>
    <button class="btn" id="resetBtn">필터 초기화</button>
    <span class="pill" id="notePill" hidden><span id="notePillText"></span><button id="notePillX" aria-label="노트 필터 해제">✕</button></span>
    <span class="count" id="count"></span>
  </div>

  <div class="sheet">
    <table class="grid">
      <colgroup><col class="col-cat"><col class="col-note"><col class="col-sec"><col class="col-prev"><col class="col-date"></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty-state" id="empty" hidden>조건에 맞는 항목이 없습니다. 검색어나 카테고리 필터를 바꿔 보세요.</div>
  </div>
</div>

const DATA = {"cats": ["콜드콜", "콜드메일", "회사내규", "기초개념", "메타", "네이버", "구글", "기타매체", "실무"], "notes": [{"path": "01_콜드콜/문의응대_상담질문.md", "title": "문의 응대 · 상담 질문 리스트", "summary": "인바운드 문의/상담 시 업종·매체·이력·성과·타겟·예산·시점·경쟁사를 순서대로 파악하고, 검토 후 안내하겠다고 마무리한다.", "cat": "콜드콜", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/01_콜드콜/문의응대_상담질문.md"}, {"path": "01_콜드콜/영업DB_수집.md", "title": "영업 DB 수집 방법", "summary": "네이버 뉴스(스타트업 기사)와 사람인(마케터 채용 공고)으로 잠재 광고주 DB를 모은다. 대행사는 걸러낼 것.", "cat": "콜드콜", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/01_콜드콜/영업DB_수집.md"}, {"path": "01_콜드콜/콜드콜_노하우.md", "title": "콜드콜 노하우", "summary": "콜은 \"내 의견(개선점)\"을 구체적으로 전달하는 게 핵심. 사전에 메타 광고 라이브러리·네이버 검색으로 태클 포인트를 준비하고 전화한다.", "cat": "콜드콜", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/01_콜드콜/콜드콜_노하우.md"}, {"path": "02_콜드메일/콜드메일_구성.md", "title": "콜드메일 구성", "summary": "짧은 본문 + 후킹성 있는 공통 제안서(PPT) + 업종별 레퍼런스 파일. 레퍼런스는 EC/DB 큰 분류로만 미리 만들어 둔다.", "cat": "콜드메일", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/02_콜드메일/콜드메일_구성.md"}, {"path": "03_회사내규/견적_정산_세금계산서.md", "title": "견적 · 제안서 · 정산 · 세금계산서", "summary": "네이버는 광고주가 직접 충전하므로 VAT·송금이 없고 견적엔 우리에게 입금되는 비용만 적는다. 수수료는 네이버·카카오는 매체가 주고(조정 불가), 메타 등은 우리가 받으므로 조정 가능.", "cat": "회사내규", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/03_회사내규/견적_정산_세금계산서.md"}, {"path": "04_기초개념/광고지표_퍼널.md", "title": "광고 지표와 퍼널", "summary": "**CPM → CTR → CPC → CVR → CPA** 순서로 노출 > 클릭 > 전환 퍼널을 따라가며, 어느 단계가 막혔는지 진단한다.", "cat": "기초개념", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/광고지표_퍼널.md"}, {"path": "04_기초개념/앱광고.md", "title": "앱 광고 기초", "summary": "앱 광고는 **CPI(설치) → CPA(가입 등 행동)** 순서로 단가를 잡는다. 메타보다 구글을 많이 쓰고, MMP로 트래킹한다.", "cat": "기초개념", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/앱광고.md"}, {"path": "05_메타/ABO_ASC_운영_소재기획.md", "title": "ABO · ASC 병행 운영 & 소재 기획 (제안서 문구)", "summary": "ABO는 테스트(예산 20~30%), ASC는 확장(70~80%). 소재는 한 번에 한 변수씩 검증하고, USP 외에 페르소나×TPO×인지 단계로 신규 소재를 기획한다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/ABO_ASC_운영_소재기획.md"}, {"path": "05_메타/계정_권한_지표.md", "title": "메타 계정 · 권한 · 지표 메모", "summary": "", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/계정_권한_지표.md"}, {"path": "05_메타/광고라이브러리_소재분석.md", "title": "메타 광고 라이브러리 · 소재 분석", "summary": "광고 라이브러리로 경쟁사·잠재 광고주의 소재를 보고, USP·타겟 포인트가 잘 드러나는지로 개선점(태클)을 찾는다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/광고라이브러리_소재분석.md"}, {"path": "06_네이버/검색광고_운영.md", "title": "네이버 검색광고 운영", "summary": "", "cat": "네이버", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/06_네이버/검색광고_운영.md"}, {"path": "06_네이버/계정_권한_이관.md", "title": "네이버 광고 계정 · 권한 · 이관", "summary": "", "cat": "네이버", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/06_네이버/계정_권한_이관.md"}, {"path": "07_구글/앱광고.md", "title": "구글 앱 광고", "summary": "", "cat": "구글", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/07_구글/앱광고.md"}, {"path": "09_실무/2026-10-15_다운도케어_앱광고_제안.md", "title": "다운도케어 앱 광고 제안", "summary": "", "cat": "실무", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/09_실무/2026-10-15_다운도케어_앱광고_제안.md"}], "rows": [{"note": "01_콜드콜/문의응대_상담질문.md", "order": 0, "section": "기본 질문 순서", "html": "<ol><li>어떤 부분에 도움이 필요해서 문의 주셨나요?<\/li><li>업종 / 업체명 (보면서 얘기하고 싶어서 업체명을 여쭙는 것)<\/li><li>현재 광고를 진행 중인 매체가 있으실까요?<\/li><li>이전에 광고를 진행해 보셨나요? (기존 집행 이력)<\/li><li>기존 광고의 ROAS, CPA 등을 알고 계신가요?<\/li><li>주로 어떤 고객층을 대상으로 판매하고 계신가요?<\/li><li>특별히 고려하고 계신 광고 매체가 있으실까요?<\/li><li>광고 목표<\/li><li>월 광고비로 어느 정도 생각하고 계신가요?<\/li><li>광고는 언제부터 진행하고 싶으신가요?<\/li><li>참고하거나 경쟁하고 있는 업체가 있나요?<\/li><\/ol><p><strong>마무리 멘트:<\/strong> \"말씀해 주신 내용 바탕으로 적합한 광고 방향을 검토해서 안내드리겠습니다.\"<\/p>", "text": "1. 어떤 부분에 도움이 필요해서 문의 주셨나요? 2. 업종 / 업체명 (보면서 얘기하고 싶어서 업체명을 여쭙는 것) 3. 현재 광고를 진행 중인 매체가 있으실까요? 4. 이전에 광고를 진행해 보셨나요? (기존 집행 이력) 5. 기존 광고의 ROAS, CPA 등을 알고 계신가요? 6. 주로 어떤 고객층을 대상으로 판매하고 계신가요? 7. 특별히 고려하고 계신 광고 매체가 있으실까요? 8. 광고 목표 9. 월 광고비로 어느 정도 생각하고 계신가요? 10. 광고는 언제부터 진행하고 싶으신가요? 11. 참고하거나 경쟁하고 있는 업체가 있나요? 마무리 멘트: \"말씀해 주신 내용 바탕으로 적합한 광고 방향을 검토해서 안내드리겠습니다.\"", "flag": false}, {"note": "01_콜드콜/문의응대_상담질문.md", "order": 1, "section": "기존 광고 운영 중인 광고주 체크 포인트 (네이버 기준)", "html": "<ul><li>광고를 <strong>직접 진행<\/strong>하시는지, 진행하신 지 얼마나 됐는지<\/li><li>실제로 광고가 나가는 걸 확인 안 하면 놓칠 수 있는 부분이 있다고 안내<\/li><li><strong>스마트스토어 전환추적<\/strong> 문제없는지 → 따로 설정 안 해 두면 전환이 표시되지 않음 (<a href=\"#\" class=\"note-link\" data-note=\"06_네이버/검색광고_운영.md\">설정법<\/a>)<\/li><li>\"제품이 어느 정도 팔렸는지가 중요한 정보라 전환 표시를 해 두시면 좋을 것 같습니다.\"<\/li><li>내부에서 소재를 만드실 수 있으면 소재 별도 비용 없음<\/li><\/ul>", "text": "광고를 직접 진행 하시는지, 진행하신 지 얼마나 됐는지 실제로 광고가 나가는 걸 확인 안 하면 놓칠 수 있는 부분이 있다고 안내 스마트스토어 전환추적 문제없는지 → 따로 설정 안 해 두면 전환이 표시되지 않음 (설정법) \"제품이 어느 정도 팔렸는지가 중요한 정보라 전환 표시를 해 두시면 좋을 것 같습니다.\" 내부에서 소재를 만드실 수 있으면 소재 별도 비용 없음", "flag": false}, {"note": "01_콜드콜/영업DB_수집.md", "order": 0, "section": "1. 네이버 뉴스", "html": "<ul><li>네이버 뉴스 <strong>경제 탭<\/strong> → 스타트업 관련 기사(투자 유치·기부 등) 확인 → 스타트업 DB 수집<\/li><\/ul>", "text": "네이버 뉴스 경제 탭 → 스타트업 관련 기사(투자 유치·기부 등) 확인 → 스타트업 DB 수집", "flag": false}, {"note": "01_콜드콜/영업DB_수집.md", "order": 1, "section": "2. 사람인", "html": "<ul><li>\"디지털마케터 / 퍼포먼스마케터\"로 검색 → 마케터를 구하는 기업 DB 수집<\/li><li>⚠️ <strong>대행사 주의!<\/strong> 대행사도 마케터를 구인하므로 제외할 것<\/li><\/ul>", "text": "\"디지털마케터 / 퍼포먼스마케터\"로 검색 → 마케터를 구하는 기업 DB 수집 ⚠️ 대행사 주의! 대행사도 마케터를 구인하므로 제외할 것", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 0, "section": "통화 태도 · 화법", "html": "<ul><li>콜에서 중요한 건 <strong>내 의견을 전달하는 것<\/strong>.<\/li><li>상현 팀장님 예시 흐름<ol><li>\"OO(회사)인데, 광고주님을 위해서 전화드렸습니다.\"<\/li><li>\"저랑 안 하셔도 되니까…\" (부담 낮추기)<\/li><li>\"이런 이런 점은 진짜 개선하셨으면 좋겠습니다.\" (구체적 개선점)<\/li><li>\"썸네일도 요즘 AI로 잘 만드는데, 혹시 저랑 하시게 되면 그 부분은 제가 도와드릴 수 있을 것 같습니다.\" (내가 줄 수 있는 가치)<\/li><\/ol><\/li><li>고객센터로 연결돼도 <strong>마케팅 담당자로 바꿔 달라고 하면<\/strong> 바꿔줄 때가 있다.<\/li><\/ul>", "text": "콜에서 중요한 건 내 의견을 전달하는 것 . 상현 팀장님 예시 흐름 1. \"OO(회사)인데, 광고주님을 위해서 전화드렸습니다.\" 2. \"저랑 안 하셔도 되니까…\" (부담 낮추기) 3. \"이런 이런 점은 진짜 개선하셨으면 좋겠습니다.\" (구체적 개선점) 4. \"썸네일도 요즘 AI로 잘 만드는데, 혹시 저랑 하시게 되면 그 부분은 제가 도와드릴 수 있을 것 같습니다.\" (내가 줄 수 있는 가치) 고객센터로 연결돼도 마케팅 담당자로 바꿔 달라고 하면 바꿔줄 때가 있다.", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 1, "section": "사전 조사 → 태클 포인트 만들기", "html": "<h4>메타 광고 라이브러리<\/h4><ul><li>업체가 집행 중인 소재를 보고 태클 → 예: \"USP·타겟 포인트가 잘 노출되지 않는 소재 같다\"<\/li><li>자세한 분석법: <a href=\"#\" class=\"note-link\" data-note=\"05_메타/광고라이브러리_소재분석.md\">메타 광고 라이브러리 · 소재 분석<\/a><\/li><\/ul><h4>네이버 검색<\/h4><ul><li>기본 키워드로 검색해 보고, <strong>좋은(전환 가능성 높은) 키워드로 검색했을 때 안 나오면<\/strong> 그걸로 태클.<\/li><\/ul>", "text": "메타 광고 라이브러리 업체가 집행 중인 소재를 보고 태클 → 예: \"USP·타겟 포인트가 잘 노출되지 않는 소재 같다\" 자세한 분석법: 메타 광고 라이브러리 · 소재 분석  네이버 검색 기본 키워드로 검색해 보고, 좋은(전환 가능성 높은) 키워드로 검색했을 때 안 나오면 그걸로 태클.", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 2, "section": "예산 확인 질문", "html": "<ul><li>\"월 500만 원\"이라고 하면 → <strong>광고비만 500만 원인지, 수수료 등 다 포함해서 500만 원인지<\/strong> 반드시 확인.<\/li><\/ul>", "text": "\"월 500만 원\"이라고 하면 → 광고비만 500만 원인지, 수수료 등 다 포함해서 500만 원인지 반드시 확인.", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 3, "section": "콜에서 바로 쓰는 멘트", "html": "<ul><li>(네이버 계정 문의 시) \"알아봐 드릴 수 있는데, 그러려면 계정 이관이 필요할 수 있습니다.\"<\/li><li>\"광고주센터 숫자 아이디 주시면 이관받아서, 담당자 오기 전에 제가 먼저 확인해 보겠습니다.\" → <a href=\"#\" class=\"note-link\" data-note=\"06_네이버/계정_권한_이관.md\">네이버 이관 방법<\/a><\/li><\/ul>", "text": "(네이버 계정 문의 시) \"알아봐 드릴 수 있는데, 그러려면 계정 이관이 필요할 수 있습니다.\" \"광고주센터 숫자 아이디 주시면 이관받아서, 담당자 오기 전에 제가 먼저 확인해 보겠습니다.\" → 네이버 이관 방법", "flag": false}, {"note": "02_콜드메일/콜드메일_구성.md", "order": 0, "section": "구성", "html": "<ol><li><strong>메일 본문은 짧게<\/strong><\/li><li><strong>공통 제안서 첨부<\/strong>: \"메타의 정석\" 같은 후킹성 있는 PPT<\/li><li><strong>마지막에 레퍼런스 파일<\/strong><\/li><li>제안서·레퍼런스 내용도 직접 만든 <strong>인사이트로 작성<\/strong>하면 됨<\/li><\/ol>", "text": "1. 메일 본문은 짧게 2. 공통 제안서 첨부 : \"메타의 정석\" 같은 후킹성 있는 PPT 3. 마지막에 레퍼런스 파일 제안서·레퍼런스 내용도 직접 만든 인사이트로 작성 하면 됨", "flag": false}, {"note": "02_콜드메일/콜드메일_구성.md", "order": 1, "section": "레퍼런스 파일 준비", "html": "<ul><li>업종 큰 분류로 몇 개 미리 만들어 두고 업체에 맞게 첨부<\/li><li><strong>EC(커머스) / DB(잠재고객 수집)<\/strong> 정도로만 나눠도 충분<\/li><\/ul>", "text": "업종 큰 분류로 몇 개 미리 만들어 두고 업체에 맞게 첨부 EC(커머스) / DB(잠재고객 수집) 정도로만 나눠도 충분", "flag": false}, {"note": "02_콜드메일/콜드메일_구성.md", "order": 2, "section": "제목 예시", "html": "<ul><li><code>검색광고 내용 제안_업체명<\/code><\/li><\/ul>", "text": "검색광고 내용 제안 업체명", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 0, "section": "견적 · 제안서 작성", "html": "<ul><li><strong>네이버<\/strong>는 광고주 직접 충전 방식 → 광고비에 VAT가 붙지 않음(우리에게 송금할 필요 없음)<ul><li>제안서에 <strong>\"광고주 직접 충전 방식\"을 명시<\/strong><\/li><li>하단 공급가액 등에는 <strong>우리에게 입금되는 비용만<\/strong> 기재<\/li><\/ul><\/li><li><strong>소재 제작 건수<\/strong>(숏폼 영상/이미지 월 몇 건)도 리소스 → 소요 시간을 고려해서 견적 산정<\/li><li>광고주가 내부에서 소재를 만들 수 있으면 소재 비용 별도 없음<\/li><li>예산 문의 시 광고비만인지, 전부 포함인지 확인 (<a href=\"#\" class=\"note-link\" data-note=\"01_콜드콜/콜드콜_노하우.md\">콜드콜 노하우<\/a>)<\/li><\/ul>", "text": "네이버 는 광고주 직접 충전 방식 → 광고비에 VAT가 붙지 않음(우리에게 송금할 필요 없음) 제안서에 \"광고주 직접 충전 방식\"을 명시 하단 공급가액 등에는 우리에게 입금되는 비용만 기재 소재 제작 건수 (숏폼 영상/이미지 월 몇 건)도 리소스 → 소요 시간을 고려해서 견적 산정 광고주가 내부에서 소재를 만들 수 있으면 소재 비용 별도 없음 예산 문의 시 광고비만인지, 전부 포함인지 확인 (콜드콜 노하우)", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 1, "section": "수수료 구조 (10/08)", "html": "<div class='tbl'><table><thead><tr><th>매체<\/th><th>수수료 받는 방식<\/th><th>조정<\/th><\/tr><\/thead><tbody><tr><td>네이버, 카카오<\/td><td>매체에서 지급<\/td><td>우리가 조정 불가<\/td><\/tr><tr><td>메타 등<\/td><td>광고주에게 입금받음<\/td><td>조정 가능<\/td><\/tr><\/tbody><\/table><\/div>", "text": "매체  수수료 받는 방식  조정   네이버, 카카오  매체에서 지급  우리가 조정 불가   메타 등  광고주에게 입금받음  조정 가능", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 2, "section": "세금계산서", "html": "<ul><li>광고주가 우리에게 입금하면 → <strong>우리가 발행<\/strong><\/li><li>네이버는 광고주 계정에 충전해서 쓰므로 광고비 입금이 필요 없음<\/li><li>세금계산서는 영수증 같은 개념 → \"저희 측에서 오히려 세금계산서를 발행해 드려야 합니다!\"<\/li><li><strong>영수 발행<\/strong>: 돈을 입금받은 뒤, 입금받았다는 의미로 발행<\/li><li><strong>청구 발행<\/strong>: \"며칠까지 입금하겠다\" → 받을 금액을 청구하는 의미로 발행<\/li><\/ul>", "text": "광고주가 우리에게 입금하면 → 우리가 발행 네이버는 광고주 계정에 충전해서 쓰므로 광고비 입금이 필요 없음 세금계산서는 영수증 같은 개념 → \"저희 측에서 오히려 세금계산서를 발행해 드려야 합니다!\" 영수 발행 : 돈을 입금받은 뒤, 입금받았다는 의미로 발행 청구 발행 : \"며칠까지 입금하겠다\" → 받을 금액을 청구하는 의미로 발행", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 3, "section": "광고비 결제 · 계정 (메타 등)", "html": "<ul><li>광고주 비즈니스 포트폴리오(계정) → <strong>광고주 카드<\/strong>로 결제<\/li><li>광고주 카드 충전이 안 되거나 우리 회사 포트폴리오로 운영 → 광고주가 <strong>우리에게 송금, 우리가 충전<\/strong><\/li><li>계정: 광고주 계정 / 새로 생성한 계정 모두 가능 (광고주 계정 = 광고주 카드, 우리 회사 계정 = 우리 회사 카드)<\/li><li>⚠️ 신규 계정은 신뢰도가 낮아서, 담배 같은 민감 업종은 신규 계정으로 하면 막힘<\/li><\/ul>", "text": "광고주 비즈니스 포트폴리오(계정) → 광고주 카드 로 결제 광고주 카드 충전이 안 되거나 우리 회사 포트폴리오로 운영 → 광고주가 우리에게 송금, 우리가 충전 계정: 광고주 계정 / 새로 생성한 계정 모두 가능 (광고주 계정 = 광고주 카드, 우리 회사 계정 = 우리 회사 카드) ⚠️ 신규 계정은 신뢰도가 낮아서, 담배 같은 민감 업종은 신규 계정으로 하면 막힘", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 4, "section": "지원금(바우처) 광고 집행 방식", "html": "<ol><li><strong>광고주 돈으로 먼저 집행<\/strong> → 이후 광고주가 지원금을 입금받음<\/li><li><strong>대행사 돈으로 먼저 광고 진행<\/strong> → 진행 내역 전달 → 광고주가 그걸로 지원금 수령 → 받은 지원금을 우리에게 송금<ul><li>이 경우 <strong>보증보험<\/strong> 함께 진행<\/li><\/ul><\/li><\/ol>", "text": "1. 광고주 돈으로 먼저 집행 → 이후 광고주가 지원금을 입금받음 2. 대행사 돈으로 먼저 광고 진행 → 진행 내역 전달 → 광고주가 그걸로 지원금 수령 → 받은 지원금을 우리에게 송금 이 경우 보증보험 함께 진행", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 0, "section": "지표 공식", "html": "<div class='tbl'><table><thead><tr><th>지표<\/th><th>공식<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>CPM<\/td><td>광고비 / 노출수 × 1,000<\/td><td>노출 1,000회당 비용 (Cost Per Mille)<\/td><\/tr><tr><td>CTR<\/td><td>클릭수 / 노출수 × 100<\/td><td>광고를 본 사람 중 클릭 비율 → <strong>소재 매력도<\/strong><\/td><\/tr><tr><td>CPC<\/td><td>광고비 / 클릭수<\/td><td>클릭당 비용<\/td><\/tr><tr><td>CVR<\/td><td>전환수 / 클릭수 × 100<\/td><td>클릭 후 전환 비율 → 랜딩·가격·신뢰도·구매 편의성<\/td><\/tr><tr><td>CPA<\/td><td>광고비 / 전환수<\/td><td>전환당 비용<\/td><\/tr><\/tbody><\/table><\/div>", "text": "지표  공식  의미   CPM  광고비 / 노출수 × 1,000  노출 1,000회당 비용 (Cost Per Mille)   CTR  클릭수 / 노출수 × 100  광고를 본 사람 중 클릭 비율 → 소재 매력도   CPC  광고비 / 클릭수  클릭당 비용   CVR  전환수 / 클릭수 × 100  클릭 후 전환 비율 → 랜딩·가격·신뢰도·구매 편의성   CPA  광고비 / 전환수  전환당 비용", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 1, "section": "CPM 해석", "html": "<ul><li><strong>CPM이 높다<\/strong> = 노출 단가가 비싸다 (노출을 얻기 어렵다). 원인:<ol><li>성수기라 광고 경쟁이 치열<\/li><li>타겟이 너무 좁음<\/li><\/ol><\/li><li>CPM이 높아도 <strong>CTR이 높으면 CPC는 낮아질 수 있음<\/strong> (CPC = CPM ÷ (1,000 × CTR))<\/li><li><strong>CPM이 낮을 때<\/strong> → 전환율을 봐야 함. 노출이 많아도 클릭·전환이 없으면 소용없음<\/li><\/ul>", "text": "CPM이 높다 = 노출 단가가 비싸다 (노출을 얻기 어렵다). 원인: 1. 성수기라 광고 경쟁이 치열 2. 타겟이 너무 좁음 CPM이 높아도 CTR이 높으면 CPC는 낮아질 수 있음 (CPC = CPM ÷ (1,000 × CTR)) CPM이 낮을 때 → 전환율을 봐야 함. 노출이 많아도 클릭·전환이 없으면 소용없음", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 2, "section": "CTR · CVR 조합 진단", "html": "<ul><li>CTR 높음 = 소재가 타겟에게 잘 먹힘(소재 경쟁력) → 이후 전환이 잘 나오는지 확인<\/li><li>전환이 낮다면: 랜딩페이지, 상품, 가격, 자극적 문구로 어그로만 끈 건 아닌지 점검<\/li><\/ul><div class='tbl'><table><thead><tr><th>CTR<\/th><th>CVR<\/th><th>해석<\/th><th>액션<\/th><\/tr><\/thead><tbody><tr><td>높음<\/td><td>낮음<\/td><td>과장 광고 or 랜딩페이지 약함<\/td><td>랜딩·상품·가격 점검<\/td><\/tr><tr><td>낮음<\/td><td>높음<\/td><td>구매 의지 강한 고객층<\/td><td>광고 소재 개선<\/td><\/tr><\/tbody><\/table><\/div>", "text": "CTR 높음 = 소재가 타겟에게 잘 먹힘(소재 경쟁력) → 이후 전환이 잘 나오는지 확인 전환이 낮다면: 랜딩페이지, 상품, 가격, 자극적 문구로 어그로만 끈 건 아닌지 점검  CTR  CVR  해석  액션   높음  낮음  과장 광고 or 랜딩페이지 약함  랜딩·상품·가격 점검   낮음  높음  구매 의지 강한 고객층  광고 소재 개선", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 3, "section": "CPC와 CPA의 관계", "html": "<ul><li>노출 단가가 같다면 CTR이 높을수록 CPC가 내려감<\/li><li>클릭이 싸도 전환율이 낮으면 CPA가 비싸짐 / 클릭이 비싸도 전환율이 높으면 CPA는 괜찮음<\/li><\/ul>", "text": "노출 단가가 같다면 CTR이 높을수록 CPC가 내려감 클릭이 싸도 전환율이 낮으면 CPA가 비싸짐 / 클릭이 비싸도 전환율이 높으면 CPA는 괜찮음", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 4, "section": "유입 측정 — 광고로 얼마나 들어왔나", "html": "<ul><li><strong>트래픽<\/strong>: 광고를 보고 클릭해서 유입된 사람<\/li><li><strong>브랜드 검색량<\/strong>: 광고로 브랜드를 인지한 사람이 나중에 검색해서 유입 → 인지도 지표<\/li><li>메타의 클릭 vs 링크 클릭 구분: <a href=\"#\" class=\"note-link\" data-note=\"05_메타/계정_권한_지표.md\">메타 지표 메모<\/a><\/li><\/ul>", "text": "트래픽 : 광고를 보고 클릭해서 유입된 사람 브랜드 검색량 : 광고로 브랜드를 인지한 사람이 나중에 검색해서 유입 → 인지도 지표 메타의 클릭 vs 링크 클릭 구분: 메타 지표 메모", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 5, "section": "기타 개념", "html": "<ul><li><strong>리타겟팅<\/strong>: 구매 의지가 높아 CTR·CVR이 높고 CPA가 낮게 나올 가능성 큼. 단, 타겟 규모가 작음<\/li><li><strong>간접전환<\/strong>: 광고 클릭 후 일정 기간 뒤 구매한 경우. 고관여 제품일수록 많음<\/li><li><strong>기여도(어트리뷰션)<\/strong>: 고객이 여러 곳에서 여러 광고를 봤을 때 성과를 어디에 나눌지 정하는 방식<ul><li>라스트 클릭 / 퍼스트 클릭 / 선형 / 데이터 기반<\/li><li>내 메모: 고객 마음을 모르는데 뭘 보고 샀는지 어떻게 알지? → 그래서 모델별로 해석이 달라지고, 데이터 기반 모델은 실제 전환 경로 데이터로 비중을 추정함<\/li><\/ul><\/li><\/ul>", "text": "리타겟팅 : 구매 의지가 높아 CTR·CVR이 높고 CPA가 낮게 나올 가능성 큼. 단, 타겟 규모가 작음 간접전환 : 광고 클릭 후 일정 기간 뒤 구매한 경우. 고관여 제품일수록 많음 기여도(어트리뷰션) : 고객이 여러 곳에서 여러 광고를 봤을 때 성과를 어디에 나눌지 정하는 방식 라스트 클릭 / 퍼스트 클릭 / 선형 / 데이터 기반 내 메모: 고객 마음을 모르는데 뭘 보고 샀는지 어떻게 알지? → 그래서 모델별로 해석이 달라지고, 데이터 기반 모델은 실제 전환 경로 데이터로 비중을 추정함", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 6, "section": "미정리 질문", "html": "<ul><li>Q. 여러 매체를 동시에 광고 집행할 경우? <em>(답 정리 필요 — 기여도·중복 전환 이슈와 연결)<\/em><\/li><\/ul>", "text": "Q. 여러 매체를 동시에 광고 집행할 경우? (답 정리 필요 — 기여도·중복 전환 이슈와 연결)", "flag": true}, {"note": "04_기초개념/앱광고.md", "order": 0, "section": "용어", "html": "<ul><li><strong>MMP<\/strong>: 앱 트래킹 툴 (Mobile Measurement Partner — 앱스플라이어, 에어브릿지 등)<\/li><li><strong>CPI<\/strong>: 앱 설치당 비용 (보통 500원대)<\/li><li><strong>CPA<\/strong>: 회원가입 등 특정 행동당 비용<\/li><\/ul>", "text": "MMP : 앱 트래킹 툴 (Mobile Measurement Partner — 앱스플라이어, 에어브릿지 등) CPI : 앱 설치당 비용 (보통 500원대) CPA : 회원가입 등 특정 행동당 비용", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 1, "section": "핵심 포인트", "html": "<ul><li>앱 광고는 <strong>메타 &lt; 구글<\/strong>을 더 많이 씀<\/li><li><strong>CPA 단가를 잡으려면 CPI 단가부터 잡아야 함<\/strong><\/li><li>회원가입 전환을 만들려면 <strong>매체별 앱 설치 비중을 파악하고 이탈률<\/strong>을 봐야 함<\/li><li>메타에서 잡을 수 있는 타겟과 구글에서 잡을 수 있는 타겟이 다름. 상대적으로 <strong>전환당 비용은 구글이 잘 잡힘<\/strong><\/li><\/ul>", "text": "앱 광고는 메타 < 구글 을 더 많이 씀 CPA 단가를 잡으려면 CPI 단가부터 잡아야 함 회원가입 전환을 만들려면 매체별 앱 설치 비중을 파악하고 이탈률 을 봐야 함 메타에서 잡을 수 있는 타겟과 구글에서 잡을 수 있는 타겟이 다름. 상대적으로 전환당 비용은 구글이 잘 잡힘", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 2, "section": "입찰 전략 (메타·구글 모두 가능)", "html": "<ul><li><strong>전환 수 극대화<\/strong> vs <strong>전환 가치 극대화<\/strong><\/li><li>객단가에 따라 운영 방식을 다르게 가져갈 수 있음 (객단가 높으면 가치 극대화 고려)<\/li><\/ul>", "text": "전환 수 극대화 vs 전환 가치 극대화 객단가에 따라 운영 방식을 다르게 가져갈 수 있음 (객단가 높으면 가치 극대화 고려)", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 3, "section": "매체별 메모", "html": "<ul><li>구글은 CPI가 없고 거의 CPA → <a href=\"#\" class=\"note-link\" data-note=\"07_구글/앱광고.md\">구글 앱 광고<\/a><\/li><\/ul>", "text": "구글은 CPI가 없고 거의 CPA → 구글 앱 광고", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 4, "section": "사례", "html": "<ul><li><a href=\"#\" class=\"note-link\" data-note=\"09_실무/2026-10-15_다운도케어_앱광고_제안.md\">다운도케어 앱 광고 제안<\/a> (D사·J사 유사 사례 포함)<\/li><\/ul>", "text": "다운도케어 앱 광고 제안 (D사·J사 유사 사례 포함)", "flag": false}, {"note": "05_메타/ABO_ASC_운영_소재기획.md", "order": 0, "section": "캠페인 역할 분리", "html": "<p>현재의 ABO·ASC 병행 구조는 유지하되, 두 캠페인의 역할을 명확히 나눠 운영합니다.<\/p><ul><li><strong>ABO (테스트, 예산의 20~30%)<\/strong>: 컨셉별로 광고세트를 나누고 동일 예산으로 신규 소재를 검증<\/li><li><strong>ASC (확장, 예산의 70~80%)<\/strong>: 테스트를 통과한 소재만 편입해 매출 확대<\/li><\/ul>", "text": "현재의 ABO·ASC 병행 구조는 유지하되, 두 캠페인의 역할을 명확히 나눠 운영합니다. ABO (테스트, 예산의 20~30%) : 컨셉별로 광고세트를 나누고 동일 예산으로 신규 소재를 검증 ASC (확장, 예산의 70~80%) : 테스트를 통과한 소재만 편입해 매출 확대", "flag": false}, {"note": "05_메타/ABO_ASC_운영_소재기획.md", "order": 1, "section": "테스트 방법", "html": "<ul><li><strong>순서<\/strong>: 컨셉·소구점 → 포맷 → 후킹(첫 3초·첫 문장) → 디테일. 한 번에 한 변수씩 검증<\/li><li><strong>판단 기준<\/strong>: 소재당 목표 CPA의 1~2배 소진 시점에 후킹률, CTR, CVR, CPA, ROAS로 <strong>승격 / 재테스트 / 종료<\/strong> 판정<\/li><\/ul>", "text": "순서 : 컨셉·소구점 → 포맷 → 후킹(첫 3초·첫 문장) → 디테일. 한 번에 한 변수씩 검증 판단 기준 : 소재당 목표 CPA의 1~2배 소진 시점에 후킹률, CTR, CVR, CPA, ROAS로 승격 / 재테스트 / 종료 판정", "flag": false}, {"note": "05_메타/ABO_ASC_운영_소재기획.md", "order": 2, "section": "USP 외 신규 소재 제안", "html": "<ul><li>USP 소재는 비교·검토 단계 고객에게 강하지만, 신규 고객을 넓히는 데는 한계가 있음<\/li><li>그래서 <strong>타겟(페르소나) × 소비 상황(TPO) × 인지 단계<\/strong> 조합으로 기획<\/li><li>소재 방향<ul><li>문제 제기·공감형<\/li><li>상황형<\/li><li>페르소나형<\/li><li>리뷰·사회적 증거형<\/li><li>UGC·파트너십형<\/li><li>비교·반박형<\/li><li>오퍼·시즌형<\/li><\/ul><\/li><li><strong>기획 근거<\/strong>: 구매 리뷰, 고객 문의, 광고 댓글, 검색 키워드, 경쟁사 광고 분석<\/li><\/ul>", "text": "USP 소재는 비교·검토 단계 고객에게 강하지만, 신규 고객을 넓히는 데는 한계가 있음 그래서 타겟(페르소나) × 소비 상황(TPO) × 인지 단계 조합으로 기획 소재 방향 문제 제기·공감형 상황형 페르소나형 리뷰·사회적 증거형 UGC·파트너십형 비교·반박형 오퍼·시즌형 기획 근거 : 구매 리뷰, 고객 문의, 광고 댓글, 검색 키워드, 경쟁사 광고 분석", "flag": false}, {"note": "05_메타/계정_권한_지표.md", "order": 0, "section": "조회 권한 받기", "html": "<ul><li>메타 광고주센터(비즈니스 설정) &gt; <strong>광고 계정<\/strong> &gt; <strong>사람 할당<\/strong><\/li><li><strong>전체 권한이 아닌 \"성과 보기\"<\/strong> 체크<\/li><li>마케터 이메일 아이디 입력 <strong>또는<\/strong> 우리 회사 비즈니스 ID <code>1536552186589906<\/code> 입력<\/li><\/ul>", "text": "메타 광고주센터(비즈니스 설정)  광고 계정   사람 할당  전체 권한이 아닌 \"성과 보기\" 체크 마케터 이메일 아이디 입력 또는 우리 회사 비즈니스 ID 1536552186589906 입력", "flag": false}, {"note": "05_메타/계정_권한_지표.md", "order": 1, "section": "계정 · 결제", "html": "<ul><li>광고주 포트폴리오 → 광고주 카드로 결제<\/li><li>충전이 안 되거나 우리 회사 포트폴리오 → 광고주가 송금, 우리가 충전<\/li><li>⚠️ 신규 계정은 신뢰도가 떨어져 담배 같은 업종은 막힘<\/li><li>자세히: <a href=\"#\" class=\"note-link\" data-note=\"03_회사내규/견적_정산_세금계산서.md\">견적·정산·세금계산서<\/a><\/li><\/ul>", "text": "광고주 포트폴리오 → 광고주 카드로 결제 충전이 안 되거나 우리 회사 포트폴리오 → 광고주가 송금, 우리가 i>회원가입 전환을 위해 <strong>매체별 앱 설치 비중과 이탈률<\/strong> 파악 필요 (MMP 활용)<\/li><li>메타와 구글은 잡을 수 있는 타겟이 다르고, 전환당 비용은 구글이 상대적으로 잘 잡힘<\/li><\/ul>", "text": "CPI ≈ 500원대 기준 CPA = (목표 단가 미정 — 채울 것) CPA를 잡으려면 CPI 단가부터 잡아야 함 회원가입 전환을 위해 매체별 앱 설치 비중과 이탈률 파악 필요 (MMP 활용) 메타와 구글은 잡을 수 있는 타겟이 다르고, 전환당 비용은 구글이 상대적으로 잘 잡힘", "flag": true}, {"note": "09_실무/2026-10-15_다운도케어_앱광고_제안.md", "order": 2, "section": "유사 사례", "html": "<div class='tbl'><table><thead><tr><th>사례<\/th><th>매체<\/th><th>KPI<\/th><th>성과<\/th><\/tr><\/thead><tbody><tr><td>기타업종 'D사' 모바일 앱<\/td><td>—<\/td><td>AOS CPI 1,200원 / iOS CPI 5,000원<\/td><td>AOS CPI 1,165원 ✅ / iOS CPI 21,397원 ❌<\/td><\/tr><tr><td>기타업종 'J사' 모바일 앱<\/td><td>구글<\/td><td>CPC 300원 / CPI 600원 이하<\/td><td>CPC 254원 ✅ / CPI 597원 ✅<\/td><\/tr><\/tbody><\/table><\/div>", "text": "사례  매체  KPI  성과   기타업종 'D사' 모바일 앱  —  AOS CPI 1,200원 / iOS CPI 5,000원  AOS CPI 1,165원 ✅ / iOS CPI 21,397원 ❌   기타업종 'J사' 모바일 앱  구글  CPC 300원 / CPI 600원 이하  CPC 254원 ✅ / CPI 597원 ✅", "flag": false}]};
const notes = Object.fromEntries(DATA.notes.map(n => [n.path, n]));
const catIndex = Object.fromEntries(DATA.cats.map((c, i) => [c, i]));
const catColor = c => `var(--c${(catIndex[c] ?? 0) % 9 + 1})`;
const rows = DATA.rows.map((r, i) => ({ ...r, id: i, n: notes[r.note],
  hay: (notes[r.note].title + " " + notes[r.note].summary + " " + r.section + " " + r.text + " " + notes[r.note].cat).toLowerCase() }));

const COLS = [
  { key: "cat", label: "카테고리", cls: "c-cat", val: r => catIndex[r.n.cat] * 1000 },
  { key: "note", label: "주제", cls: "c-note", val: r => r.n.title },
  { key: "sec", label: "항목", cls: "c-sec", val: r => r.section },
  { key: "prev", label: "내용", cls: "c-prev", val: r => r.text },
  { key: "date", label: "작성일", cls: "c-date", val: r => r.n.updated },
];

const store = {
  get() { try { return JSON.parse(localStorage.getItem("board-state") || "{}"); } catch { return {}; } },
  set(s) { try { localStorage.setItem("board-state", JSON.stringify(s)); } catch {} },
};
const saved = store.get();
const state = {
  cats: new Set((saved.cats || []).filter(c => c in catIndex)),
  q: saved.q || "", flag: !!saved.flag, note: notes[saved.note] ? saved.note : null,
  sort: saved.sort || { key: "cat", dir: 1 }, open: new Set(),
};
const persist = () => store.set({ cats: [...state.cats], q: state.q, flag: state.flag, note: state.note, sort: state.sort });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function filtered() {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter(r =>
    (!state.cats.size || state.cats.has(r.n.cat)) &&
    (!state.note || r.note === state.note) &&
    (!state.flag || r.flag) &&
    terms.every(t => r.hay.includes(t)));
}

function sorted(list) {
  const col = COLS.find(c => c.key === state.sort.key) || COLS[0];
  const base = (a, b) => catIndex[a.n.cat] - catIndex[b.n.cat] || a.n.title.localeCompare(b.n.title, "ko") || a.order - b.order;
  return list.slice().sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    const d = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "ko");
    return d * state.sort.dir || base(a, b);
  });
}

function renderCats() {
  const scope = rows.filter(r => (!state.note || r.note === state.note) && (!state.flag || r.flag));
  const counts = {};
  scope.forEach(r => counts[r.n.cat] = (counts[r.n.cat] || 0) + 1);
  const all = `<button class="chip" aria-pressed="${!state.cats.size}" data-cat="">전체 <span class="n">${scope.length}</span></button>`;
  $("cats").innerHTML = all + DATA.cats.map(c =>
    `<button class="chip${counts[c] ? "" : " empty"}" style="--cat:${catColor(c)}" aria-pressed="${state.cats.has(c)}" data-cat="${esc(c)}">
      <span class="dot"></span>${esc(c)} <span class="n">${counts[c] || 0}</span></button>`).join("");
}

function renderHead() {
  $("head").innerHTML = COLS.map(c => {
    const on = state.sort.key === c.key;
    return `<th class="${c.cls}" aria-sort="${on ? (state.sort.dir > 0 ? "ascending" : "descending") : "none"}">
      <button data-sort="${c.key}">${c.label}<span class="arrow">${on ? (state.sort.dir > 0 ? "↑" : "↓") : ""}</span></button></th>`;
  }).join("");
}

function renderBody() {
  const list = sorted(filtered());
  $("empty").hidden = list.length > 0;
  $("count").textContent = `${list.length}개 항목 · 노트 ${new Set(list.map(r => r.note)).size}개`;
  $("body").innerHTML = list.map(r => {
    const open = state.open.has(r.id);
    const main = `<tr class="row${open ? " open" : ""}" data-id="${r.id}" tabindex="0" aria-expanded="${open}" style="--cat:${catColor(r.n.cat)}">
      <td class="c-cat"><span class="catcell"><span class="dot"></span><span class="lbl">${esc(r.n.cat)}</span></span></td>
      <td class="c-note"><span class="note-title">${esc(r.n.title)}</span></td>
      <td class="c-sec"><span class="sec">${esc(r.section)}${r.flag ? '<span class="flag">확인 필요</span>' : ""}</span></td>
      <td class="c-prev"><span class="preview">${esc(r.text)}</span></td>
      <td class="c-date"><span class="date">${esc(r.n.updated)}</span></td></tr>`;
    if (!open) return main;
    return main + `<tr class="detail" style="--cat:${catColor(r.n.cat)}"><td colspan="5"><div class="detail-inner">
      ${r.n.summary && r.order === 0 ? `<div class="sum">${esc(r.n.summary)}</div>` : ""}
      <div class="content">${r.html}</div>
      <div class="actions">
        ${state.note === r.note ? "" : `<button class="btn" data-only="${esc(r.note)}">이 노트 전체 보기</button>`}
        <a class="btn" href="${esc(r.n.url)}" target="_blank" rel="noopener">GitHub에서 열기 ↗</a>
      </div></div></td></tr>`;
  }).join("");
  $("expandBtn").textContent = list.length && list.every(r => state.open.has(r.id)) ? "모두 접기" : "모두 펼치기";
}

function renderBar() {
  $("q").value = state.q;
  $("flagBtn").setAttribute("aria-pressed", state.flag);
  $("notePill").hidden = !state.note;
  if (state.note) $("notePillText").textContent = "노트: " + notes[state.note].title;
}

function render() { renderCats(); renderHead(); renderBar(); renderBody(); persist(); }

function showNote(path) {
  if (!notes[path]) return;
  state.note = path; state.cats.clear(); state.q = ""; state.flag = false;
  state.open = new Set(rows.filter(r => r.note === path).map(r => r.id));
  render(); window.scrollTo({ top: 0 });
}

$("cats").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const c = b.dataset.cat;
  if (!c) state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
  render();
});
$("head").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if (!b) return;
  const k = b.dataset.sort;
  state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === "date" ? -1 : 1) };
  render();
});
$("body").addEventListener("click", e => {
  const link = e.target.closest(".note-link");
  if (link) { e.preventDefault(); showNote(link.dataset.note); return; }
  const only = e.target.closest("[data-only]");
  if (only) { showNote(only.dataset.only); return; }
  if (e.target.closest("a, button, .detail")) return;
  const tr = e.target.closest("tr.row"); if (!tr) return;
  const id = +tr.dataset.id;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  renderBody();
});
$("body").addEventListener("keydown", e => {
  const tr = e.target.closest("tr.row");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); }
});
let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; renderCats(); renderBody(); persist(); }, 120); });
$("flagBtn").addEventListener("click", () => { state.flag = !state.flag; render(); });
$("notePillX").addEventListener("click", () => { state.note = null; state.open.clear(); render(); });
$("resetBtn").addEventListener("click", () => { state.cats.clear(); state.q = ""; state.flag = false; state.note = null; state.open.clear(); state.sort = { key: "cat", dir: 1 }; render(); });
$("expandBtn").addEventListener("click", () => {
  const list = filtered();
  const allOpen = list.length && list.every(r => state.open.has(r.id));
  list.forEach(r => allOpen ? state.open.delete(r.id) : state.open.add(r.id));
  renderBody();
});

const last = DATA.notes.map(n => n.updated).sort().pop() || "";
$("meta").textContent = `노트 ${DATA.notes.length} · 항목 ${rows.length} · 최근 업데이트 ${last}`;
render();
</script>

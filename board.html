<title>퍼포먼스 마케팅 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 스프레드시트형 보드 — 카테고리 요약 → 고정 필터 바 → 펼쳐지는 행이 있는 표 */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #5f6878;
  --line: #dde1e8;
  --accent: #2d4fd6;
  --accent-soft: #e6ebfc;
  --warn: #a35b00;
  --warn-soft: #fff1dc;
  --row-hover: #f0f3fa;
  --c1: #c2410c; --c2: #b45309; --c3: #4d7c0f; --c4: #0f766e; --c5: #1d4ed8;
  --c6: #15803d; --c7: #b91c1c; --c8: #7e22ce; --c9: #be185d; --c10: #6d5a2e;
  --star: #c98a00; --pin-bg: #fff8e6;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
    --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
    --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
    --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6; --c10: #d6b46a; --star: #f5c04a; --pin-bg: #2a2416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e27; --fg: #e5e8ef; --muted: #98a0b0; --line: #2c3240;
  --accent: #8ea5ff; --accent-soft: #232b48; --warn: #f2b25c; --warn-soft: #3a2a12; --row-hover: #20263a;
  --c1: #fb923c; --c2: #fbbf24; --c3: #a3e635; --c4: #2dd4bf; --c5: #7aa2ff;
  --c6: #4ade80; --c7: #f87171; --c8: #c084fc; --c9: #f472b6; --c10: #d6b46a; --star: #f5c04a; --pin-bg: #2a2416;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }
.chip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.empty { opacity: .45; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); flex: none; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 8px;
}
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.btn:focus-visible, .chip:focus-visible, th button:focus-visible, tr.row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-soft); color: var(--fg); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.pill button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
.count { color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.grid th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em;
  border-bottom: 1px solid var(--line); padding: 0; background: var(--surface);
}
.grid th button { all: unset; display: block; width: 100%; padding: 10px 12px; cursor: pointer; box-sizing: border-box; }
.grid th button:hover { color: var(--fg); }
.grid th .arrow { font-family: var(--font-mono); margin-left: 4px; }
.col-cat { width: 112px; } .col-note { width: 22%; } .col-sec { width: 20%; } .col-date { width: 104px; }
.grid td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; overflow-wrap: anywhere; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--row-hover); }
tr.row.open td { background: var(--row-hover); border-bottom-color: transparent; }
.catcell { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.note-title { font-weight: 600; }
.star { color: var(--star); margin-right: 4px; }
tr.row.pinned td { background: var(--pin-bg); }
tr.row.pinned:hover td, tr.row.pinned.open td { background: var(--row-hover); }
.sec { display: flex; gap: 6px; align-items: flex-start; }
.flag { flex: none; font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.preview { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

tr.detail td { padding: 4px 16px 18px; background: var(--row-hover); }
.detail-inner { max-width: 820px; display: grid; gap: 10px; }
.detail-inner .sum { color: var(--muted); font-size: 13px; border-left: 3px solid var(--cat); padding-left: 10px; }
.content > :first-child { margin-top: 0; }
.content p, .content ul, .content ol { margin: 6px 0; }
.content ul, .content ol { padding-left: 20px; }
.content li { margin: 2px 0; }
.content h4 { margin: 12px 0 4px; font-size: 13.5px; }
.content code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.content blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); background: var(--surface); border-radius: 0 6px 6px 0; }
.content blockquote.warn { border-left-color: var(--warn); background: var(--warn-soft); color: var(--fg); }
.content .tbl { overflow-x: auto; }
.content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; background: var(--surface); }
.content th, .content td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.content th { background: var(--bg); font-weight: 600; }
a { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a, .actions button { font-size: 12.5px; }
.empty-state { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  table.grid { table-layout: auto; }
  .grid colgroup { display: none; }
  .grid .c-prev, .grid .c-date { display: none; }
  .grid .c-cat { width: 76px; } .grid .c-note { width: 42%; }
  .catcell .lbl { font-size: 12px; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { tr.row td { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>퍼포먼스 마케팅 노트</h1>
    <span class="meta" id="meta"></span>
  </header>

  <div class="cats" id="cats" role="group" aria-label="카테고리 필터"></div>

  <div class="bar">
    <label class="search"><span hidden>검색</span>
      <input id="q" type="search" placeholder="검색 — 예: CPA, 이관, 세금계산서" autocomplete="off">
    </label>
    <button class="btn" id="flagBtn" aria-pressed="false">⚠️ 확인 필요만</button>
    <button class="btn" id="expandBtn">모두 펼치기</button>
    <button class="btn" id="resetBtn">필터 초기화</button>
    <span class="pill" id="notePill" hidden><span id="notePillText"></span><button id="notePillX" aria-label="노트 필터 해제">✕</button></span>
    <span class="count" id="count"></span>
  </div>

  <div class="sheet">
    <table class="grid">
      <colgroup><col class="col-cat"><col class="col-note"><col class="col-sec"><col class="col-prev"><col class="col-date"></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty-state" id="empty" hidden>조건에 맞는 항목이 없습니다. 검색어나 카테고리 필터를 바꿔 보세요.</div>
  </div>
</div>

<script>
const DATA = {"cats": ["콜드콜", "콜드메일", "회사내규", "기초개념", "메타", "네이버", "구글", "기타매체", "실무", "가공집"], "notes": [{"path": "01_콜드콜/문의응대_상담질문.md", "title": "문의 응대 · 상담 질문 리스트", "summary": "인바운드 문의/상담 시 업종·매체·이력·성과·타겟·예산·시점·경쟁사를 순서대로 파악하고, 검토 후 안내하겠다고 마무리한다.", "cat": "콜드콜", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/01_콜드콜/문의응대_상담질문.md", "pin": false, "mirror": false}, {"path": "01_콜드콜/영업DB_수집.md", "title": "영업 DB 수집 방법", "summary": "네이버 뉴스(스타트업 기사)와 사람인(마케터 채용 공고)으로 잠재 광고주 DB를 모은다. 대행사는 걸러낼 것.", "cat": "콜드콜", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/01_콜드콜/영업DB_수집.md", "pin": false, "mirror": false}, {"path": "01_콜드콜/콜드콜_노하우.md", "title": "콜드콜 노하우", "summary": "콜은 \"내 의견(개선점)\"을 구체적으로 전달하는 게 핵심. 사전에 메타 광고 라이브러리·네이버 검색으로 태클 포인트를 준비하고 전화한다.", "cat": "콜드콜", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/01_콜드콜/콜드콜_노하우.md", "pin": false, "mirror": false}, {"path": "02_콜드메일/콜드메일_구성.md", "title": "콜드메일 구성", "summary": "짧은 본문 + 후킹성 있는 공통 제안서(PPT) + 업종별 레퍼런스 파일. 레퍼런스는 EC/DB 큰 분류로만 미리 만들어 둔다.", "cat": "콜드메일", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/02_콜드메일/콜드메일_구성.md", "pin": false, "mirror": false}, {"path": "03_회사내규/견적_정산_세금계산서.md", "title": "견적 · 제안서 · 정산 · 세금계산서", "summary": "네이버는 광고주가 직접 충전하므로 VAT·송금이 없고 견적엔 우리에게 입금되는 비용만 적는다. 수수료는 네이버·카카오는 매체가 주고(조정 불가), 메타 등은 우리가 받으므로 조정 가능.", "cat": "회사내규", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/03_회사내규/견적_정산_세금계산서.md", "pin": false, "mirror": false}, {"path": "03_회사내규/제안서_작성_워크플로우.md", "title": "제안서 작성 워크플로우", "summary": "쓰기 전에 대상·목적·근거·원칙부터 정하고, \"문제해결의 논리와 근거 → 설득 흐름과 판단 기준\" 순서로 초안을 짠다. 개선사항(문제점 보고)과 전략(해결 방향)은 구분하고, AI에게는 역질문부터 요청한다.", "cat": "회사내규", "created": "2026-10-16", "updated": "2026-10-18", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/03_회사내규/제안서_작성_워크플로우.md", "pin": false, "mirror": false}, {"path": "04_기초개념/CPA_ROAS_손익분기.md", "title": "CPA · ROAS · 손익분기", "summary": "손익분기 CPA = 주문당 마진 ÷ 1.265(수수료+VAT), 손익분기 ROAS = 1 ÷ 마진율. 객단가가 오르면 손익분기 CPA와 ROAS가 함께 오른다.", "cat": "기초개념", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/CPA_ROAS_손익분기.md", "pin": false, "mirror": false}, {"path": "04_기초개념/광고소재_소구유형.md", "title": "광고 소재 소구 유형 4가지", "summary": "소재는 **브랜드 이미지형 · 문제제기형 · 실제후기형 · 제품증명형**으로 나눠 기획하고, 유형마다 화면 구성 공식이 다르다.", "cat": "기초개념", "created": "2026-10-29", "updated": "2026-10-29", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/광고소재_소구유형.md", "pin": false, "mirror": false}, {"path": "04_기초개념/광고소재_조형원리.md", "title": "광고 소재 조형원리 (기초디자인 관점)", "summary": "소재를 볼 때는 **무엇이 먼저 보이고, 시선이 어디로 이동하며, 덩어리와 여백이 어떤 균형을 이루는지**를 먼저 본다.", "cat": "기초개념", "created": "", "updated": "", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/광고소재_조형원리.md", "pin": false, "mirror": false}, {"path": "04_기초개념/광고지표_퍼널.md", "title": "광고 지표와 퍼널", "summary": "**CPM → CTR → CPC → CVR → CPA** 순서로 노출 > 클릭 > 전환 퍼널을 따라가며, 어느 단계가 막혔는지 진단한다.", "cat": "기초개념", "created": "2026-10-15", "updated": "2026-10-21", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/광고지표_퍼널.md", "pin": false, "mirror": false}, {"path": "04_기초개념/마케팅_기본_프레임워크.md", "title": "마케팅 기본 프레임워크", "summary": "실제 마케팅은 **환경분석 → STP → 전략 실행 → 브랜딩** 흐름으로 이어진다. 진단(환경분석·STP·PLC·수요 상황)을 먼저 하고, 처방(광고·브랜딩)은 그다음이다.", "cat": "기초개념", "created": "2026-10-18", "updated": "2026-10-18", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/마케팅_기본_프레임워크.md", "pin": false, "mirror": false}, {"path": "04_기초개념/앱광고.md", "title": "앱 광고 기초", "summary": "앱 광고는 **CPI(설치) → CPA(가입 등 행동)** 순서로 단가를 잡는다. 메타보다 구글을 많이 쓰고, MMP로 트래킹한다.", "cat": "기초개념", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/앱광고.md", "pin": false, "mirror": false}, {"path": "04_기초개념/예산_수수료_VAT_계산.md", "title": "예산 계산: 광고비 · 대행 수수료 · VAT", "summary": "총예산에 수수료(15%)와 VAT가 모두 포함되면 **광고비 = 총예산 ÷ 1.265**. 1.265는 광고비 1원당 실제로 나가는 돈으로, 손익분기 계산에 계속 쓰인다.", "cat": "기초개념", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/04_기초개념/예산_수수료_VAT_계산.md", "pin": false, "mirror": false}, {"path": "05_메타/ABO_ASC_운영_소재기획.md", "title": "ABO · ASC 병행 운영 & 소재 기획 (제안서 문구)", "summary": "ABO는 테스트(예산 20~30%), ASC는 확장(70~80%). 소재는 한 번에 한 변수씩 검증하고, USP 외에 페르소나×TPO×인지 단계로 신규 소재를 기획한다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/ABO_ASC_운영_소재기획.md", "pin": false, "mirror": false}, {"path": "05_메타/경매_CPM_캠페인목표.md", "title": "메타 경매 구조 · 캠페인 목표별 CPM", "summary": "경매 승자는 입찰가가 아니라 **총 가치(입찰가 × 예상 반응률 + 광고 품질)**가 가장 높은 광고다. 그래서 반응이 좋은 광고는 더 싸게 이기고, 캠페인 목표가 다르면 사는 노출 자체가 달라 CPM이 크게 차이 난다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/경매_CPM_캠페인목표.md", "pin": false, "mirror": false}, {"path": "05_메타/계정_권한_지표.md", "title": "메타 계정 · 권한 · 지표 메모", "summary": "", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/계정_권한_지표.md", "pin": false, "mirror": false}, {"path": "05_메타/광고라이브러리_소재분석.md", "title": "메타 광고 라이브러리 · 소재 분석", "summary": "광고 라이브러리로 경쟁사·잠재 광고주의 소재를 보고, USP·타겟 포인트가 잘 드러나는지로 개선점(태클)을 찾는다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/광고라이브러리_소재분석.md", "pin": false, "mirror": false}, {"path": "05_메타/소재_테스트.md", "title": "메타 소재 테스트 방법", "summary": "소액(일 5만 원 수준)이면 **광고 세트 하나에 확실히 다른 소재 2~3개**를 7일 이상 수정 없이 돌리고, 메타가 한쪽만 밀면 Push delivery나 크리에이티브 테스트 기능을 쓴다. 검증된 소재와 새 소재는 같은 세트에서 바로 붙이지 않는다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/소재_테스트.md", "pin": false, "mirror": false}, {"path": "05_메타/스마트스토어_픽셀_킵그로우.md", "title": "스마트스토어 × 메타 픽셀 — 킵그로우", "summary": "스마트스토어엔 메타 픽셀을 직접 설치할 수 없어서, 구매 전환을 메타에 보내려면 킵그로우(픽셀샵) 같은 솔루션이 필요하다. 킵그로우는 페이지뷰·콘텐츠 조회·구매만 추적한다(장바구니 X).", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/스마트스토어_픽셀_킵그로우.md", "pin": false, "mirror": false}, {"path": "05_메타/타겟팅_타겟중복.md", "title": "메타 타겟팅 · 타겟 중복", "summary": "대중 상품·데이터 많은 계정은 넓게, 니치 업종·초반 계정은 관심 보인 사람 → 관련 관심사 → 유사 타겟 순으로 넓혀 간다. 같은 광고주 광고 세트끼리 타겟이 겹치면 한 세트만 경매에 나가 성과가 불안정해진다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-21", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/타겟팅_타겟중복.md", "pin": false, "mirror": false}, {"path": "05_메타/학습단계_예산.md", "title": "메타 학습 단계 · 일예산 · 캠페인 예산", "summary": "광고 세트가 주요 수정 후 7일 안에 최적화 이벤트 약 50건을 채우면 학습 종료. 그래서 일예산 ≈ 목표 CPA × 7~10이 경험칙이고, 캠페인 예산(구 CBO)은 테스트가 아니라 확장용이다.", "cat": "메타", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/05_메타/학습단계_예산.md", "pin": false, "mirror": false}, {"path": "06_네이버/검색광고_운영.md", "title": "네이버 검색광고 운영", "summary": "", "cat": "네이버", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/06_네이버/검색광고_운영.md", "pin": false, "mirror": false}, {"path": "06_네이버/계정_권한_이관.md", "title": "네이버 광고 계정 · 권한 · 이관", "summary": "", "cat": "네이버", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/06_네이버/계정_권한_이관.md", "pin": false, "mirror": false}, {"path": "07_구글/앱광고.md", "title": "구글 앱 광고", "summary": "", "cat": "구글", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/07_구글/앱광고.md", "pin": false, "mirror": false}, {"path": "09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "title": "가공집(GGZ) 파충류 용품 — 메타 광고 플랜", "summary": "스마트스토어 기반 니치 상품(평균 구매 3만 원, 재구매 거의 없음). 킵그로우로 구매 추적부터 깔고, 일 5만 원·광고 세트 1개·소재 2~3개로 단품 vs 세트를 테스트하며, 한 달 성과는 ROAS 하나가 아니라 수익·구조 개선 지표까지 미리 합의한다.", "cat": "실무", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "pin": false, "mirror": true}, {"path": "09_실무/2026-10-15_가공집GGZ_제안.md", "title": "제안 · 가공집(GGZ)", "summary": "가공집에 제안할 내용 모음. 구매 추적(킵그로우) → 인스타 계정 정비 → 세트 상품·리뷰 → 광고 운영 구조 → 한 달 성과 기준 합의 순서로 전달한다.", "cat": "실무", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/09_실무/2026-10-15_가공집GGZ_제안.md", "pin": true, "mirror": true}, {"path": "09_실무/2026-10-15_다운도케어_앱광고_제안.md", "title": "다운도케어 앱 광고 제안", "summary": "", "cat": "실무", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/09_실무/2026-10-15_다운도케어_앱광고_제안.md", "pin": false, "mirror": false}, {"path": "10_가공집/2026-10-15_가공집GGZ_메타광고_플랜.md", "title": "가공집(GGZ) 파충류 용품 — 메타 광고 플랜", "summary": "스마트스토어 기반 니치 상품(평균 구매 3만 원, 재구매 거의 없음). 킵그로우로 구매 추적부터 깔고, 일 5만 원·광고 세트 1개·소재 2~3개로 단품 vs 세트를 테스트하며, 한 달 성과는 ROAS 하나가 아니라 수익·구조 개선 지표까지 미리 합의한다.", "cat": "가공집", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/10_가공집/2026-10-15_가공집GGZ_메타광고_플랜.md", "pin": false, "mirror": false}, {"path": "10_가공집/2026-10-15_가공집GGZ_제안.md", "title": "제안 · 가공집(GGZ)", "summary": "가공집에 제안할 내용 모음. 구매 추적(킵그로우) → 인스타 계정 정비 → 세트 상품·리뷰 → 광고 운영 구조 → 한 달 성과 기준 합의 순서로 전달한다.", "cat": "가공집", "created": "2026-10-15", "updated": "2026-10-15", "url": "https://github.com/juyoung7676love-afk/M1/blob/master/10_가공집/2026-10-15_가공집GGZ_제안.md", "pin": true, "mirror": false}], "rows": [{"note": "01_콜드콜/문의응대_상담질문.md", "order": 0, "section": "기본 질문 순서", "html": "<ol><li>어떤 부분에 도움이 필요해서 문의 주셨나요?<\/li><li>업종 / 업체명 (보면서 얘기하고 싶어서 업체명을 여쭙는 것)<\/li><li>현재 광고를 진행 중인 매체가 있으실까요?<\/li><li>이전에 광고를 진행해 보셨나요? (기존 집행 이력)<\/li><li>기존 광고의 ROAS, CPA 등을 알고 계신가요?<\/li><li>주로 어떤 고객층을 대상으로 판매하고 계신가요?<\/li><li>특별히 고려하고 계신 광고 매체가 있으실까요?<\/li><li>광고 목표<\/li><li>월 광고비로 어느 정도 생각하고 계신가요?<\/li><li>광고는 언제부터 진행하고 싶으신가요?<\/li><li>참고하거나 경쟁하고 있는 업체가 있나요?<\/li><\/ol><p><strong>마무리 멘트:<\/strong> \"말씀해 주신 내용 바탕으로 적합한 광고 방향을 검토해서 안내드리겠습니다.\"<\/p>", "text": "1. 어떤 부분에 도움이 필요해서 문의 주셨나요? 2. 업종 / 업체명 (보면서 얘기하고 싶어서 업체명을 여쭙는 것) 3. 현재 광고를 진행 중인 매체가 있으실까요? 4. 이전에 광고를 진행해 보셨나요? (기존 집행 이력) 5. 기존 광고의 ROAS, CPA 등을 알고 계신가요? 6. 주로 어떤 고객층을 대상으로 판매하고 계신가요? 7. 특별히 고려하고 계신 광고 매체가 있으실까요? 8. 광고 목표 9. 월 광고비로 어느 정도 생각하고 계신가요? 10. 광고는 언제부터 진행하고 싶으신가요? 11. 참고하거나 경쟁하고 있는 업체가 있나요? 마무리 멘트: \"말씀해 주신 내용 바탕으로 적합한 광고 방향을 검토해서 안내드리겠습니다.\"", "flag": false}, {"note": "01_콜드콜/문의응대_상담질문.md", "order": 1, "section": "기존 광고 운영 중인 광고주 체크 포인트 (네이버 기준)", "html": "<ul><li>광고를 <strong>직접 진행<\/strong>하시는지, 진행하신 지 얼마나 됐는지<\/li><li>실제로 광고가 나가는 걸 확인 안 하면 놓칠 수 있는 부분이 있다고 안내<\/li><li><strong>스마트스토어 전환추적<\/strong> 문제없는지 → 따로 설정 안 해 두면 전환이 표시되지 않음 (<a href=\"#\" class=\"note-link\" data-note=\"06_네이버/검색광고_운영.md\">설정법<\/a>)<\/li><li>\"제품이 어느 정도 팔렸는지가 중요한 정보라 전환 표시를 해 두시면 좋을 것 같습니다.\"<\/li><li>내부에서 소재를 만드실 수 있으면 소재 별도 비용 없음<\/li><\/ul>", "text": "광고를 직접 진행 하시는지, 진행하신 지 얼마나 됐는지 실제로 광고가 나가는 걸 확인 안 하면 놓칠 수 있는 부분이 있다고 안내 스마트스토어 전환추적 문제없는지 → 따로 설정 안 해 두면 전환이 표시되지 않음 (설정법) \"제품이 어느 정도 팔렸는지가 중요한 정보라 전환 표시를 해 두시면 좋을 것 같습니다.\" 내부에서 소재를 만드실 수 있으면 소재 별도 비용 없음", "flag": false}, {"note": "01_콜드콜/영업DB_수집.md", "order": 0, "section": "1. 네이버 뉴스", "html": "<ul><li>네이버 뉴스 <strong>경제 탭<\/strong> → 스타트업 관련 기사(투자 유치·기부 등) 확인 → 스타트업 DB 수집<\/li><\/ul>", "text": "네이버 뉴스 경제 탭 → 스타트업 관련 기사(투자 유치·기부 등) 확인 → 스타트업 DB 수집", "flag": false}, {"note": "01_콜드콜/영업DB_수집.md", "order": 1, "section": "2. 사람인", "html": "<ul><li>\"디지털마케터 / 퍼포먼스마케터\"로 검색 → 마케터를 구하는 기업 DB 수집<\/li><li>⚠️ <strong>대행사 주의!<\/strong> 대행사도 마케터를 구인하므로 제외할 것<\/li><\/ul>", "text": "\"디지털마케터 / 퍼포먼스마케터\"로 검색 → 마케터를 구하는 기업 DB 수집 ⚠️ 대행사 주의! 대행사도 마케터를 구인하므로 제외할 것", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 0, "section": "통화 태도 · 화법", "html": "<ul><li>콜에서 중요한 건 <strong>내 의견을 전달하는 것<\/strong>.<\/li><li>상현 팀장님 예시 흐름<ol><li>\"OO(회사)인데, 광고주님을 위해서 전화드렸습니다.\"<\/li><li>\"저랑 안 하셔도 되니까…\" (부담 낮추기)<\/li><li>\"이런 이런 점은 진짜 개선하셨으면 좋겠습니다.\" (구체적 개선점)<\/li><li>\"썸네일도 요즘 AI로 잘 만드는데, 혹시 저랑 하시게 되면 그 부분은 제가 도와드릴 수 있을 것 같습니다.\" (내가 줄 수 있는 가치)<\/li><\/ol><\/li><li>고객센터로 연결돼도 <strong>마케팅 담당자로 바꿔 달라고 하면<\/strong> 바꿔줄 때가 있다.<\/li><\/ul>", "text": "콜에서 중요한 건 내 의견을 전달하는 것 . 상현 팀장님 예시 흐름 1. \"OO(회사)인데, 광고주님을 위해서 전화드렸습니다.\" 2. \"저랑 안 하셔도 되니까…\" (부담 낮추기) 3. \"이런 이런 점은 진짜 개선하셨으면 좋겠습니다.\" (구체적 개선점) 4. \"썸네일도 요즘 AI로 잘 만드는데, 혹시 저랑 하시게 되면 그 부분은 제가 도와드릴 수 있을 것 같습니다.\" (내가 줄 수 있는 가치) 고객센터로 연결돼도 마케팅 담당자로 바꿔 달라고 하면 바꿔줄 때가 있다.", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 1, "section": "사전 조사 → 태클 포인트 만들기", "html": "<h4>메타 광고 라이브러리<\/h4><ul><li>업체가 집행 중인 소재를 보고 태클 → 예: \"USP·타겟 포인트가 잘 노출되지 않는 소재 같다\"<\/li><li>자세한 분석법: <a href=\"#\" class=\"note-link\" data-note=\"05_메타/광고라이브러리_소재분석.md\">메타 광고 라이브러리 · 소재 분석<\/a><\/li><\/ul><h4>네이버 검색<\/h4><ul><li>기본 키워드로 검색해 보고, <strong>좋은(전환 가능성 높은) 키워드로 검색했을 때 안 나오면<\/strong> 그걸로 태클.<\/li><\/ul>", "text": "메타 광고 라이브러리 업체가 집행 중인 소재를 보고 태클 → 예: \"USP·타겟 포인트가 잘 노출되지 않는 소재 같다\" 자세한 분석법: 메타 광고 라이브러리 · 소재 분석  네이버 검색 기본 키워드로 검색해 보고, 좋은(전환 가능성 높은) 키워드로 검색했을 때 안 나오면 그걸로 태클.", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 2, "section": "예산 확인 질문", "html": "<ul><li>\"월 500만 원\"이라고 하면 → <strong>광고비만 500만 원인지, 수수료 등 다 포함해서 500만 원인지<\/strong> 반드시 확인.<\/li><li>다 포함이면 실제 광고비는 약 395만 원 (500만 ÷ 1.265, 수수료 15%+VAT 기준) → <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/예산_수수료_VAT_계산.md\">예산 계산<\/a><\/li><\/ul>", "text": "\"월 500만 원\"이라고 하면 → 광고비만 500만 원인지, 수수료 등 다 포함해서 500만 원인지 반드시 확인. 다 포함이면 실제 광고비는 약 395만 원 (500만 ÷ 1.265, 수수료 15%+VAT 기준) → 예산 계산", "flag": false}, {"note": "01_콜드콜/콜드콜_노하우.md", "order": 3, "section": "콜에서 바로 쓰는 멘트", "html": "<ul><li>(네이버 계정 문의 시) \"알아봐 드릴 수 있는데, 그러려면 계정 이관이 필요할 수 있습니다.\"<\/li><li>\"광고주센터 숫자 아이디 주시면 이관받아서, 담당자 오기 전에 제가 먼저 확인해 보겠습니다.\" → <a href=\"#\" class=\"note-link\" data-note=\"06_네이버/계정_권한_이관.md\">네이버 이관 방법<\/a><\/li><\/ul>", "text": "(네이버 계정 문의 시) \"알아봐 드릴 수 있는데, 그러려면 계정 이관이 필요할 수 있습니다.\" \"광고주센터 숫자 아이디 주시면 이관받아서, 담당자 오기 전에 제가 먼저 확인해 보겠습니다.\" → 네이버 이관 방법", "flag": false}, {"note": "02_콜드메일/콜드메일_구성.md", "order": 0, "section": "구성", "html": "<ol><li><strong>메일 본문은 짧게<\/strong><\/li><li><strong>공통 제안서 첨부<\/strong>: \"메타의 정석\" 같은 후킹성 있는 PPT<\/li><li><strong>마지막에 레퍼런스 파일<\/strong><\/li><li>제안서·레퍼런스 내용도 직접 만든 <strong>인사이트로 작성<\/strong>하면 됨<\/li><\/ol>", "text": "1. 메일 본문은 짧게 2. 공통 제안서 첨부 : \"메타의 정석\" 같은 후킹성 있는 PPT 3. 마지막에 레퍼런스 파일 제안서·레퍼런스 내용도 직접 만든 인사이트로 작성 하면 됨", "flag": false}, {"note": "02_콜드메일/콜드메일_구성.md", "order": 1, "section": "레퍼런스 파일 준비", "html": "<ul><li>업종 큰 분류로 몇 개 미리 만들어 두고 업체에 맞게 첨부<\/li><li><strong>EC(커머스) / DB(잠재고객 수집)<\/strong> 정도로만 나눠도 충분<\/li><\/ul>", "text": "업종 큰 분류로 몇 개 미리 만들어 두고 업체에 맞게 첨부 EC(커머스) / DB(잠재고객 수집) 정도로만 나눠도 충분", "flag": false}, {"note": "02_콜드메일/콜드메일_구성.md", "order": 2, "section": "제목 예시", "html": "<ul><li><code>검색광고 내용 제안_업체명<\/code><\/li><\/ul>", "text": "검색광고 내용 제안 업체명", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 0, "section": "견적 · 제안서 작성", "html": "<ul><li><strong>네이버<\/strong>는 광고주 직접 충전 방식 → 광고비에 VAT가 붙지 않음(우리에게 송금할 필요 없음)<ul><li>제안서에 <strong>\"광고주 직접 충전 방식\"을 명시<\/strong><\/li><li>하단 공급가액 등에는 <strong>우리에게 입금되는 비용만<\/strong> 기재<\/li><\/ul><\/li><li><strong>소재 제작 건수<\/strong>(숏폼 영상/이미지 월 몇 건)도 리소스 → 소요 시간을 고려해서 견적 산정<\/li><li>광고주가 내부에서 소재를 만들 수 있으면 소재 비용 별도 없음<\/li><li>총예산에 수수료+VAT가 모두 포함되면 광고비 = 총예산 ÷ 1.265 → <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/예산_수수료_VAT_계산.md\">예산 계산<\/a><\/li><li>예산 문의 시 광고비만인지, 전부 포함인지 확인 (<a href=\"#\" class=\"note-link\" data-note=\"01_콜드콜/콜드콜_노하우.md\">콜드콜 노하우<\/a>)<\/li><\/ul>", "text": "네이버 는 광고주 직접 충전 방식 → 광고비에 VAT가 붙지 않음(우리에게 송금할 필요 없음) 제안서에 \"광고주 직접 충전 방식\"을 명시 하단 공급가액 등에는 우리에게 입금되는 비용만 기재 소재 제작 건수 (숏폼 영상/이미지 월 몇 건)도 리소스 → 소요 시간을 고려해서 견적 산정 광고주가 내부에서 소재를 만들 수 있으면 소재 비용 별도 없음 총예산에 수수료+VAT가 모두 포함되면 광고비 = 총예산 ÷ 1.265 → 예산 계산 예산 문의 시 광고비만인지, 전부 포함인지 확인 (콜드콜 노하우)", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 1, "section": "수수료 구조 (10/08)", "html": "<div class='tbl'><table><thead><tr><th>매체<\/th><th>수수료 받는 방식<\/th><th>조정<\/th><\/tr><\/thead><tbody><tr><td>네이버, 카카오<\/td><td>매체에서 지급<\/td><td>우리가 조정 불가<\/td><\/tr><tr><td>메타 등<\/td><td>광고주에게 입금받음<\/td><td>조정 가능<\/td><\/tr><\/tbody><\/table><\/div>", "text": "매체  수수료 받는 방식  조정   네이버, 카카오  매체에서 지급  우리가 조정 불가   메타 등  광고주에게 입금받음  조정 가능", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 2, "section": "세금계산서", "html": "<ul><li>광고주가 우리에게 입금하면 → <strong>우리가 발행<\/strong><\/li><li>네이버는 광고주 계정에 충전해서 쓰므로 광고비 입금이 필요 없음<\/li><li>세금계산서는 영수증 같은 개념 → \"저희 측에서 오히려 세금계산서를 발행해 드려야 합니다!\"<\/li><li><strong>영수 발행<\/strong>: 돈을 입금받은 뒤, 입금받았다는 의미로 발행<\/li><li><strong>청구 발행<\/strong>: \"며칠까지 입금하겠다\" → 받을 금액을 청구하는 의미로 발행<\/li><\/ul>", "text": "광고주가 우리에게 입금하면 → 우리가 발행 네이버는 광고주 계정에 충전해서 쓰므로 광고비 입금이 필요 없음 세금계산서는 영수증 같은 개념 → \"저희 측에서 오히려 세금계산서를 발행해 드려야 합니다!\" 영수 발행 : 돈을 입금받은 뒤, 입금받았다는 의미로 발행 청구 발행 : \"며칠까지 입금하겠다\" → 받을 금액을 청구하는 의미로 발행", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 3, "section": "광고비 결제 · 계정 (메타 등)", "html": "<ul><li>광고주 비즈니스 포트폴리오(계정) → <strong>광고주 카드<\/strong>로 결제<\/li><li>광고주 카드 충전이 안 되거나 우리 회사 포트폴리오로 운영 → 광고주가 <strong>우리에게 송금, 우리가 충전<\/strong><\/li><li>계정: 광고주 계정 / 새로 생성한 계정 모두 가능 (광고주 계정 = 광고주 카드, 우리 회사 계정 = 우리 회사 카드)<\/li><li>⚠️ 신규 계정은 신뢰도가 낮아서, 담배 같은 민감 업종은 신규 계정으로 하면 막힘<\/li><\/ul>", "text": "광고주 비즈니스 포트폴리오(계정) → 광고주 카드 로 결제 광고주 카드 충전이 안 되거나 우리 회사 포트폴리오로 운영 → 광고주가 우리에게 송금, 우리가 충전 계정: 광고주 계정 / 새로 생성한 계정 모두 가능 (광고주 계정 = 광고주 카드, 우리 회사 계정 = 우리 회사 카드) ⚠️ 신규 계정은 신뢰도가 낮아서, 담배 같은 민감 업종은 신규 계정으로 하면 막힘", "flag": false}, {"note": "03_회사내규/견적_정산_세금계산서.md", "order": 4, "section": "지원금(바우처) 광고 집행 방식", "html": "<ol><li><strong>광고주 돈으로 먼저 집행<\/strong> → 이후 광고주가 지원금을 입금받음<\/li><li><strong>대행사 돈으로 먼저 광고 진행<\/strong> → 진행 내역 전달 → 광고주가 그걸로 지원금 수령 → 받은 지원금을 우리에게 송금<ul><li>이 경우 <strong>보증보험<\/strong> 함께 진행<\/li><\/ul><\/li><\/ol>", "text": "1. 광고주 돈으로 먼저 집행 → 이후 광고주가 지원금을 입금받음 2. 대행사 돈으로 먼저 광고 진행 → 진행 내역 전달 → 광고주가 그걸로 지원금 수령 → 받은 지원금을 우리에게 송금 이 경우 보증보험 함께 진행", "flag": false}, {"note": "03_회사내규/제안서_작성_워크플로우.md", "order": 0, "section": "제안의 핵심", "html": "<ul><li><strong>얼마만큼 시장을 이해하고 있는지<\/strong> + <strong>얼마만큼 해줄 수 있는지<\/strong>를 제안하는 게 중요<ul><li>시장 이해: 업종·타겟·경쟁사·가격대 등을 알고 있다는 걸 보여주기 (예: 가공집 — 국내 은신처 가격대, 바닥 생활형 게코 사육자 타겟)<\/li><li>해줄 수 있는 것: 우리가 실제로 실행·지원할 수 있는 범위를 구체적으로<\/li><li>시장 이해를 정리하는 틀(3C·SWOT·STP 등): <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/마케팅_기본_프레임워크.md\">마케팅 기본 프레임워크<\/a><\/li><\/ul><\/li><\/ul>", "text": "얼마만큼 시장을 이해하고 있는지 + 얼마만큼 해줄 수 있는지 를 제안하는 게 중요 시장 이해: 업종·타겟·경쟁사·가격대 등을 알고 있다는 걸 보여주기 (예: 가공집 — 국내 은신처 가격대, 바닥 생활형 게코 사육자 타겟) 해줄 수 있는 것: 우리가 실제로 실행·지원할 수 있는 범위를 구체적으로 시장 이해를 정리하는 틀(3C·SWOT·STP 등): 마케팅 기본 프레임워크", "flag": false}, {"note": "03_회사내규/제안서_작성_워크플로우.md", "order": 1, "section": "작성 전 정할 것", "html": "<ul><li><strong>대상<\/strong>: 누구에게 보여주는 문서인지<\/li><li><strong>목적<\/strong>: 이 문서로 무엇을 얻어야 하는지<\/li><li><strong>근거<\/strong>: 주장을 뒷받침할 데이터·사례<\/li><li><strong>원칙<\/strong>: 판단·작성의 기준<\/li><\/ul><blockquote class='warn'>⚠️ 확인 필요: 원문 \"대상목적과ㅏ제ㅔㅔㅔ근거원칙\" — 오타로 보여 대상·목적·근거·원칙으로 정리함. 중간에 빠진 항목(예: 과제/제약)이 있는지 확인<\/blockquote>", "text": "대상 : 누구에게 보여주는 문서인지 목적 : 이 문서로 무엇을 얻어야 하는지 근거 : 주장을 뒷받침할 데이터·사례 원칙 : 판단·작성의 기준  ⚠️ 확인 필요: 원문 \"대상목적과ㅏ제ㅔㅔㅔ근거원칙\" — 오타로 보여 대상·목적·근거·원칙으로 정리함. 중간에 빠진 항목(예: 과제/제약)이 있는지 확인", "flag": true}, {"note": "03_회사내규/제안서_작성_워크플로우.md", "order": 2, "section": "워크플로우 순서", "html": "<ol><li><strong>문제해결의 논리와 근거<\/strong> — 무엇이 문제이고 왜 이 해결책인지, 그 근거<\/li><li><strong>설득 흐름과 판단 기준<\/strong> — 읽는 사람이 어떤 순서로 납득하고, 무엇을 기준으로 결정하게 할지<\/li><li><strong>초안 확정 → 작성<\/strong><\/li><\/ol><ul><li>왜 이 순서? 논리·근거가 먼저 서야 설득 흐름을 그 위에 얹을 수 있음<\/li><li><strong>초안(뼈대)을 잘 짜 놔야 갈아엎을 일이 없음<\/strong><\/li><\/ul>", "text": "1. 문제해결의 논리와 근거 — 무엇이 문제이고 왜 이 해결책인지, 그 근거 2. 설득 흐름과 판단 기준 — 읽는 사람이 어떤 순서로 납득하고, 무엇을 기준으로 결정하게 할지 3. 초안 확정 → 작성 왜 이 순서? 논리·근거가 먼저 서야 설득 흐름을 그 위에 얹을 수 있음 초안(뼈대)을 잘 짜 놔야 갈아엎을 일이 없음", "flag": false}, {"note": "03_회사내규/제안서_작성_워크플로우.md", "order": 3, "section": "개선사항 vs 전략 — 구분해서 쓰기", "html": "<ul><li><strong>개선사항<\/strong> = 지금 보이는 <strong>문제점을 보고<\/strong>하는 것 (무엇이 잘못됐나)<\/li><li><strong>전략<\/strong> = 그 문제를 <strong>어떻게 풀지<\/strong> 방향과 방법을 제시하는 것 (그래서 어떻게 할 건가)<\/li><li>제안서에서 둘을 섞지 말고 구분해서 작성<ul><li>예) 개선사항: \"인스타 소개 문구만으로는 뭘 파는 곳인지 알기 어렵다\" / 전략: \"대상·제품을 명확히 한 문구로 바꾸고, 완성된 사육장 소재로 광고 진행\"<\/li><\/ul><\/li><\/ul>", "text": "개선사항 = 지금 보이는 문제점을 보고 하는 것 (무엇이 잘못됐나) 전략 = 그 문제를 어떻게 풀지 방향과 방법을 제시하는 것 (그래서 어떻게 할 건가) 제안서에서 둘을 섞지 말고 구분해서 작성 예) 개선사항: \"인스타 소개 문구만으로는 뭘 파는 곳인지 알기 어렵다\" / 전략: \"대상·제품을 명확히 한 문구로 바꾸고, 완성된 사육장 소재로 광고 진행\"", "flag": false}, {"note": "03_회사내규/제안서_작성_워크플로우.md", "order": 4, "section": "AI 활용 팁: 역질문 · 연결 점검 요청", "html": "<ul><li>초안을 바로 쓰게 하지 말고 <strong>AI에게 먼저 역질문을 요청<\/strong> → AI가 필요한 정보(대상·목적·근거 등)를 되물어보게 해서 빈 부분을 채운 뒤 작성<ul><li>예) \"이 제안서를 쓰기 전에 너가 알아야 할 것들을 나한테 먼저 질문해줘\"<\/li><\/ul><\/li><li>초안을 쓴 뒤에는 <strong>문제 정의와 전략이 이어지지 않는 부분을 찾아달라고<\/strong> 요청 → 문제점은 적었는데 대응 전략이 없거나, 전략은 있는데 근거가 되는 문제 정의가 없는 곳 점검<ul><li>예) \"이 제안서에서 문제 정의와 전략이 서로 이어지지 않는 부분을 찾아줘\"<\/li><\/ul><\/li><\/ul>", "text": "초안을 바로 쓰게 하지 말고 AI에게 먼저 역질문을 요청 → AI가 필요한 정보(대상·목적·근거 등)를 되물어보게 해서 빈 부분을 채운 뒤 작성 예) \"이 제안서를 쓰기 전에 너가 알아야 할 것들을 나한테 먼저 질문해줘\" 초안을 쓴 뒤에는 문제 정의와 전략이 이어지지 않는 부분을 찾아달라고 요청 → 문제점은 적었는데 대응 전략이 없거나, 전략은 있는데 근거가 되는 문제 정의가 없는 곳 점검 예) \"이 제안서에서 문제 정의와 전략이 서로 이어지지 않는 부분을 찾아줘\"", "flag": false}, {"note": "04_기초개념/CPA_ROAS_손익분기.md", "order": 0, "section": "목표 CPA 설정 방법", "html": "<ol><li><strong>손익분기 CPA = 평균 주문금액 − 원가 − 배송비 − 결제·플랫폼 수수료 − 포장비 등<\/strong><\/li><li>대행 수수료+VAT 반영: <strong>매체상 손익분기 CPA = 손익분기 CPA ÷ 1.265<\/strong> (<a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/예산_수수료_VAT_계산.md\">1.265란?<\/a>)<\/li><li><strong>목표 CPA<\/strong> = 손익분기에서 남기고 싶은 이익만큼 뺀 값<\/li><\/ol><p><strong>예시 (가상)<\/strong>: 주문금액 50,000원, 비용 30,000원<\/p><ul><li>손익분기 CPA 20,000원 → 메타상 약 15,800원<\/li><li>주문당 5,000원 남기려면 → 목표 CPA ≈ 15,000 ÷ 1.265 ≈ 11,900원<\/li><\/ul><ul><li>재구매가 많은 품목이면 고객 생애가치(LTV) 기준으로 더 높게 잡을 수 있음<\/li><li>재구매가 거의 없는 품목은 <strong>첫 구매 마진만으로<\/strong> 계산<\/li><li>솔루션 구독료(예: 킵그로우)도 비용으로 포함<\/li><\/ul>", "text": "1. 손익분기 CPA = 평균 주문금액 − 원가 − 배송비 − 결제·플랫폼 수수료 − 포장비 등 2. 대행 수수료+VAT 반영: 매체상 손익분기 CPA = 손익분기 CPA ÷ 1.265 (1.265란?) 3. 목표 CPA = 손익분기에서 남기고 싶은 이익만큼 뺀 값 예시 (가상) : 주문금액 50,000원, 비용 30,000원 손익분기 CPA 20,000원 → 메타상 약 15,800원 주문당 5,000원 남기려면 → 목표 CPA ≈ 15,000 ÷ 1.265 ≈ 11,900원 재구매가 많은 품목이면 고객 생애가치(LTV) 기준으로 더 높게 잡을 수 있음 재구매가 거의 없는 품목은 첫 구매 마진만으로 계산 솔루션 구독료(예: 킵그로우)도 비용으로 포함", "flag": false}, {"note": "04_기초개념/CPA_ROAS_손익분기.md", "order": 1, "section": "ROAS와 객단가", "html": "<ul><li><strong>ROAS = 광고 기여 매출 ÷ 광고비 = 객단가 ÷ CPA<\/strong><\/li><li>손익분기 CPA를 높여서 ROAS가 오르는 게 아니라, <strong>객단가가 오르면 손익분기 CPA와 ROAS가 함께 오름<\/strong><\/li><\/ul><p><strong>예시 (마진율 40%, CPA 15,000원 동일)<\/strong><\/p><div class='tbl'><table><thead><tr><th><\/th><th>단품<\/th><th>세트<\/th><\/tr><\/thead><tbody><tr><td>객단가<\/td><td>30,000원<\/td><td>45,000원<\/td><\/tr><tr><td>주문당 마진<\/td><td>12,000원<\/td><td>18,000원<\/td><\/tr><tr><td>결과<\/td><td><strong>3,000원 손해<\/strong><\/td><td><strong>3,000원 이익<\/strong><\/td><\/tr><tr><td>ROAS<\/td><td>2.0<\/td><td>3.0<\/td><\/tr><\/tbody><\/table><\/div>", "text": "ROAS = 광고 기여 매출 ÷ 광고비 = 객단가 ÷ CPA 손익분기 CPA를 높여서 ROAS가 오르는 게 아니라, 객단가가 오르면 손익분기 CPA와 ROAS가 함께 오름  예시 (마진율 40%, CPA 15,000원 동일)   단품  세트   객단가  30,000원  45,000원   주문당 마진  12,000원  18,000원   결과  3,000원 손해   3,000원 이익   ROAS  2.0  3.0", "flag": false}, {"note": "04_기초개념/CPA_ROAS_손익분기.md", "order": 2, "section": "손익분기 ROAS", "html": "<ul><li><strong>손익분기 ROAS = 1 ÷ 마진율<\/strong> (객단가와 무관, 마진율로만 결정)<\/li><li>마진율 40% → 2.5, 수수료+VAT 반영 시 매체 기준 <strong>약 3.16<\/strong> (2.5 × 1.265)<\/li><li>세트에 <strong>할인을 크게 넣으면 마진율이 떨어져 손익분기 ROAS가 올라감<\/strong> → 할인 폭 주의<\/li><\/ul>", "text": "손익분기 ROAS = 1 ÷ 마진율 (객단가와 무관, 마진율로만 결정) 마진율 40% → 2.5, 수수료+VAT 반영 시 매체 기준 약 3.16 (2.5 × 1.265) 세트에 할인을 크게 넣으면 마진율이 떨어져 손익분기 ROAS가 올라감 → 할인 폭 주의", "flag": false}, {"note": "04_기초개념/CPA_ROAS_손익분기.md", "order": 3, "section": "세트 판매가 광고주에게 좋은 이유", "html": "<ul><li>주문당 순이익 증가<\/li><li>배송·포장 횟수 감소 → 고정비 비중 감소<\/li><li>손익분기 CPA 상승 → 광고 확장 여력<\/li><li>완성된 세팅 → 만족도·포토리뷰 → 다시 광고 소재로 활용<\/li><\/ul>", "text": "주문당 순이익 증가 배송·포장 횟수 감소 → 고정비 비중 감소 손익분기 CPA 상승 → 광고 확장 여력 완성된 세팅 → 만족도·포토리뷰 → 다시 광고 소재로 활용", "flag": false}, {"note": "04_기초개념/CPA_ROAS_손익분기.md", "order": 4, "section": "광고주 보고 시 주의", "html": "<ul><li>ROAS만 보여주지 말고 <strong>\"광고비 + 수수료 + VAT 다 빼고 주문당 얼마 남았는지\"<\/strong>를 함께 보고<\/li><li>수수료·VAT는 ROAS 계산에 잡히지 않음 (실제 비용 = 광고비 × 1.265)<\/li><li>판단 기준은 CPA 자체가 아니라 <strong>주문당 남는 돈<\/strong>: 단품 CPA 12,000원 / 세트 CPA 16,000원이어도 세트 주문당 마진이 8,000원 더 크면 세트가 이득<\/li><\/ul>", "text": "ROAS만 보여주지 말고 \"광고비 + 수수료 + VAT 다 빼고 주문당 얼마 남았는지\" 를 함께 보고 수수료·VAT는 ROAS 계산에 잡히지 않음 (실제 비용 = 광고비 × 1.265) 판단 기준은 CPA 자체가 아니라 주문당 남는 돈 : 단품 CPA 12,000원 / 세트 CPA 16,000원이어도 세트 주문당 마진이 8,000원 더 크면 세트가 이득", "flag": false}, {"note": "04_기초개념/광고소재_소구유형.md", "order": 0, "section": "유형별 정의와 제작 포인트", "html": "<div class='tbl'><table><thead><tr><th>유형<\/th><th>목적<\/th><th>화면 구성 포인트<\/th><\/tr><\/thead><tbody><tr><td>브랜드 이미지형<\/td><td>분위기·세계관으로 “갖고 싶다” 만들기<\/td><td>정보 최소, 카피 짧게, 제품·무드가 주인공. 브랜드 컬러 하나로 통일<\/td><\/tr><tr><td>문제제기형<\/td><td>타겟 고민을 먼저 꺼내 멈추게 하기<\/td><td>고민 문장을 크게 → 제품을 해결책으로. 화면 반분할(문제/해결), 99 vs 1 같은 숫자 대비<\/td><\/tr><tr><td>실제후기형<\/td><td>실사용자 말로 신뢰 주기<\/td><td>별점·마스킹 이름(최**님)·말투 그대로 인용. 후기 카드를 겹쳐 양으로 보여주기<\/td><\/tr><tr><td>제품증명형<\/td><td>객관적 근거로 효과 증명<\/td><td>큰 숫자 → 작은 조건 설명 반복, 비포·애프터 + 수치, 판매량<\/td><\/tr><\/tbody><\/table><\/div>", "text": "유형  목적  화면 구성 포인트   브랜드 이미지형  분위기·세계관으로 “갖고 싶다” 만들기  정보 최소, 카피 짧게, 제품·무드가 주인공. 브랜드 컬러 하나로 통일   문제제기형  타겟 고민을 먼저 꺼내 멈추게 하기  고민 문장을 크게 → 제품을 해결책으로. 화면 반분할(문제/해결), 99 vs 1 같은 숫자 대비   실제후기형  실사용자 말로 신뢰 주기  별점·마스킹 이름(최 님)·말투 그대로 인용. 후기 카드를 겹쳐 양으로 보여주기   제품증명 ng>화면 가장자리와의 관계<\/strong>: 안에 넣을 거면 여유 있게 넣고, 자를 거면 형태가 이해되도록 확실히 자른다.<\/li><li>점검법: 화면을 작게 줄이거나 눈을 가늘게 떠서 본다. 디테일이 사라져도 주제부와 큰 덩어리·여백이 구분되면 배치의 기본은 잡힌 것이다.<\/li><\/ol>", "text": "1. 주제부와 보조부의 위계 : 가장 먼저 보일 주제부를 정한다. 크기뿐 아니라 명암 대비, 방향, 주변 여백으로도 강조할 수 있다. 2. 큰 덩어리의 배치 : 전체를 큰 덩어리 3~4개로 묶어서 본다. 큰·중간·작은 덩어리 차이, 모이는 곳과 풀리는 곳이 필요하다. 3. 여백의 모양 : 빈 곳도 형태다. 넓게 숨 쉬는 공간과 좁고 긴장감 있는 공간이 함께 있어야 한다. 4. 시선의 흐름과 방향 : 길쭉한 사물의 축, 곡선, 기울기가 시선을 보낸다. 큰 흐름을 하나 만들고 일부만 변화를 준다. 5. 겹침과 앞뒤 관계 : 겹침과 크기 차이로 앞뒤를 만든다. 애매한 접선은 피하고 확실히 겹치거나 띄운다. 6. 시각적 무게의 균형 : 큰 것, 어두운 것, 복잡한 것, 대비가 강한 것이 무겁다. 개수가 아니라 무게로 균형을 맞춘다. 7. 반복과 변화 : 공통 형태는 유지하고 크기·각도·간격을 바꿔 리듬을 준다. 8. 화면 가장자리와의 관계 : 안에 넣을 거면 여유 있게 넣고, 자를 거면 형태가 이해되도록 확실히 자른다. 점검법: 화면을 작게 줄이거나 눈을 가늘게 떠서 본다. 디테일이 사라져도 주제부와 큰 덩어리·여백이 구분되면 배치의 기본은 잡힌 것이다.", "flag": false}, {"note": "04_기초개념/광고소재_조형원리.md", "order": 1, "section": "레퍼런스 (ChatGPT 추천분)", "html": "<ul><li>타이포 있음: NIKE Play New · NIKE Feel the Unreal · NIKE AIR MAX(Chris Labrooy) · BYREDO Eyes Closed · GENTLE MONSTER Optical · Aēsop The Journey Elsewhere<\/li><li>타이포 없음: JACQUEMUS(유리잔 위 빨간 가방 / 가방 탑 / 초록 콩 위 흰 가방) · LOEWE(Botanical Rainbow, 배 껍질, 쌓기, EARTH) · HERMÈS(도형 무대, 팝업북, 받침 높낮이, Terre d'Hermès) · CHANEL CHANCE · rhode<\/li><\/ul>", "text": "타이포 있음: NIKE Play New · NIKE Feel the Unreal · NIKE AIR MAX(Chris Labrooy) · BYREDO Eyes Closed · GENTLE MONSTER Optical · Aēsop The Journey Elsewhere 타이포 없음: JACQUEMUS(유리잔 위 빨간 가방 / 가방 탑 / 초록 콩 위 흰 가방) · LOEWE(Botanical Rainbow, 배 껍질, 쌓기, EARTH) · HERMÈS(도형 무대, 팝업북, 받침 높낮이, Terre d'Hermès) · CHANEL CHANCE · rhode", "flag": false}, {"note": "04_기초개념/광고소재_조형원리.md", "order": 2, "section": "레퍼런스 5선 (업종 확장, 2026-10-29)", "html": "<p>상세 페이지: https://claude.ai/artifact/VXKgYpnLdhBRXoh78P6UwZ (브랜드별 2장: 실제 브랜드 소재 / 같은 논리의 예시 시안 4개 + 업종 장점) · PDF: <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/광고소재_조형원리_레퍼런스.pdf\">광고소재_조형원리_레퍼런스.pdf<\/a><\/p><div class='tbl'><table><thead><tr><th>#<\/th><th>브랜드 · 캠페인<\/th><th>업종<\/th><th>핵심 원리<\/th><th>업종에서의 장점<\/th><\/tr> ml": "<ul><li><strong>CPM이 높다<\/strong> = 노출 단가가 비싸다 (노출을 얻기 어렵다). 원인:<ol><li>성수기라 광고 경쟁이 치열<\/li><li>타겟이 너무 좁음<\/li><\/ol><\/li><li>CPM이 높아도 <strong>CTR이 높으면 CPC는 낮아질 수 있음<\/strong> (CPC = CPM ÷ (1,000 × CTR))<\/li><li><strong>CPM이 낮을 때<\/strong> → 전환율을 봐야 함. 노출이 많아도 클릭·전환이 없으면 소용없음<\/li><\/ul>", "text": "CPM이 높다 = 노출 단가가 비싸다 (노출을 얻기 어렵다). 원인: 1. 성수기라 광고 경쟁이 치열 2. 타겟이 너무 좁음 CPM이 높아도 CTR이 높으면 CPC는 낮아질 수 있음 (CPC = CPM ÷ (1,000 × CTR)) CPM이 낮을 때 → 전환율을 봐야 함. 노출이 많아도 클릭·전환이 없으면 소용없음", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 2, "section": "CPM으로 노출량 계산", "html": "<ul><li>메타는 기본적으로 <strong>노출 기준 과금<\/strong> (클릭 여부와 무관). CPM은 타겟·시기·경쟁·광고 품질에 따라 계속 변함<\/li><li><strong>노출 수 = 광고비 ÷ CPM × 1,000<\/strong> (수수료·VAT 제외, 광고비만 기준)<\/li><\/ul><div class='tbl'><table><thead><tr><th>광고비 1,581,028원<\/th><th>노출 수<\/th><\/tr><\/thead><tbody><tr><td>CPM 5,000원<\/td><td>약 31.6만 회<\/td><\/tr><tr><td>CPM 10,000원<\/td><td>약 15.8만 회<\/td><\/tr><\/tbody><\/table><\/div><div class='tbl'><table><thead><tr><th>일예산 5만 원 기준 CPM<\/th><th>하루 노출<\/th><\/tr><\/thead><tbody><tr><td>1,000원<\/td><td>약 50,000회<\/td><\/tr><tr><td>3,000원<\/td><td>약 16,700회<\/td><\/tr><tr><td>5,000원<\/td><td>약 10,000회<\/td><\/tr><tr><td>10,000원<\/td><td>약 5,000회<\/td><\/tr><tr><td>20,000원<\/td><td>약 2,500회<\/td><\/tr><\/tbody><\/table><\/div><blockquote class='warn'>⚠️ 정정: \"전환 캠페인 CPM 1만~2만 원\"은 근거 없는 가정이었음. 실제 계산은 직접 돌린 캠페인의 CPM으로 할 것<\/blockquote>", "text": "메타는 기본적으로 노출 기준 과금 (클릭 여부와 무관). CPM은 타겟·시기·경쟁·광고 품질에 따라 계속 변함 노출 수 = 광고비 ÷ CPM × 1,000 (수수료·VAT 제외, 광고비만 기준)  광고비 1,581,028원  노출 수   CPM 5,000원  약 31.6만 회   CPM 10,000원  약 15.8만 회   일예산 5만 원 기준 CPM  하루 노출   1,000원  약 50,000회   3,000원  약 16,700회   5,000원  약 10,000회   10,000원  약 5,000회   20,000원  약 2,500회   ⚠️ 정정: \"전환 캠페인 CPM 1만~2만 원\"은 근거 없는 가정이었음. 실제 계산은 직접 돌린 캠페인의 CPM으로 할 것", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 3, "section": "CPM 과금에서 CTR이 중요한 이유", "html": "<ul><li>노출이 많다고 예산이 빨리 소진되는 건 아님 (예산은 일/총예산으로 고정). 문제는 같은 돈으로 원하는 결과가 덜 나오는 것<\/li><li>CTR이 낮으면 클릭 1개가 비싸짐<\/li><\/ul><div class='tbl'><table><thead><tr><th>CPM<\/th><th>CTR<\/th><th>1,000회 노출당 클릭<\/th><th>CPC<\/th><\/tr><\/thead><tbody><tr><td>5,000원<\/td><td>1%<\/td><td>10<\/td><td>500원<\/td><\/tr><tr><td>5,000원<\/td><td>0.2%<\/td><td>2<\/td><td>2,500원<\/td><\/tr><\/tbody><\/table><\/div><ul><li>낮은 CTR = 소재, 타겟, 제안 중 무언가가 안 맞는다는 신호<\/li><\/ul>", "text": "노출이 많다고 예산이 빨리 소진되는 건 아님 (예산은 일/총예산으로 고정). 문제는 같은 돈으로 원하는 결과가 덜 나오는 것 CTR이 낮으면 클릭 1개가 비싸짐  CPM  CTR  1,000회 노출당 클릭  CPC   5,000원  1%  10  500원   5,000원  0.2%  2  2,500원  낮은 CTR = 소재, 타겟, 제안 중 무언가가 안 맞는다는 신호", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 4, "section": "CTR은 괜찮은데 CPM·CPC가 높을 때 → 타겟부터 의심", "html": "<p><strong>핵심 관계: CPC = CPM ÷ (CTR × 1,000)<\/strong> — 클릭 단가는 \"노출을 얼마에 샀나(CPM)\"와 \"노출이 얼마나 클릭으로 바뀌었나(CTR)\" 두 가지로만 결정됨<\/p><ol><li><strong>CTR이 괜찮으면 소재는 일단 합격<\/strong><ul><li>보는 사람이 클릭을 잘 하고 있으니 소재 매력도·메시지 문제는 아닐 가능성이 높음<\/li><li>그런데도 CPC가 높다면 남는 변수는 <strong>CPM(노출 단가)<\/strong>뿐<\/li><\/ul><\/li><\/ol><div class='tbl'><table><thead><tr><th>CTR<\/th><th>CPM<\/th><th>CPC<\/th><\/tr><\/thead><tbody><tr><td>1.5%<\/td><td>15,000원<\/td><td>약 1,000원<\/td><\/tr><tr><td>1.5%<\/td><td>6,000원<\/td><td>약 400원<\/td><\/tr><\/tbody><\/table><\/div><p>→ 같은 소재·같은 클릭률인데 CPC가 2.5배 차이<\/p><ol><li><strong>CPM은 \"누구에게 보여주느냐\"에서 대부분 결정됨<\/strong><ul><li>노출은 경매로 팔리므로 같은 사람을 노리는 광고주가 많을수록 그 사람에게 보여주는 값이 오름<\/li><li>CPM이 높은 흔한 상황<ul><li>타겟이 너무 좁아서 같은 사람에게 반복 노출되며 단가 상승<\/li><li>경쟁이 몰리는 타겟 (예: 2030 여성, 뷰티·육아·반려동물 관심사)<\/li><li>관심사·연령·지역을 여러 겹 걸어 모수가 작아짐<\/li><li>여러 광고세트가 같은 사람을 두고 서로 경쟁 (오디언스 중복 → <a href=\"#\" class=\"note-link\" data-note=\"05_메타/타겟팅_타겟중복.md\">타겟 중복<\/a>)<\/li><\/ul><\/li><li>결론: \"소재는 통하는데 비싸게 사고 있다 → 타겟을 넓히거나 바꿔보자\"<\/li><\/ul><\/li><li><strong>타겟만 원인은 아니므로 같이 확인할 것<\/strong><ul><li><strong>시즌<\/strong>: 10~12월은 블프·연말 경쟁으로 CPM이 전반적으로 오름 → 타겟을 바꿔도 일정 부분은 안 빠질 수 있음<\/li><li><strong>최적화 목표<\/strong>: 전환 최적화는 구매 가능성 높은 사람을 골라 사서 트래픽 목표보다 CPM이 원래 높음 (문제가 아니라 구조 → <a href=\"#\" class=\"note-link\" data-note=\"05_메타/경매_CPM_캠페인목표.md\">캠페인 목표별 CPM<\/a>)<\/li><li><strong>게재 위치<\/strong>: 피드 위주로만 잡으면 릴스·스토리 포함할 때보다 비쌀 수 있음<\/li><li><strong>학습 단계<\/strong>: 세팅 초기나 예산 변경 직후엔 단가가 불안정 → <a href=\"#\" class=\"note-link\" data-note=\"05_메타/학습단계_예산.md\">학습 단계<\/a><\/li><\/ul><\/li><\/ol><p><strong>진단 순서 정리<\/strong><\/p><div class='tbl'><table><thead><tr><th>CTR<\/th><th>CPC<\/th><th>먼저 볼 것<\/th><\/tr><\/thead><tbody><tr><td>괜찮음<\/td><td>높음<\/td><td><strong>타겟<\/strong> (CPM 문제) → 시즌·최적화 목표·게재 위치·학습 단계도 확인<\/td><\/tr><tr><td>낮음<\/td><td>높음<\/td><td><strong>소재<\/strong><\/td><\/tr><\/tbody><\/table><\/div>", "text": "핵심 관계: CPC = CPM ÷ (CTR × 1,000) — 클릭 단가는 \"노출을 얼마에 샀나(CPM)\"와 \"노출이 얼마나 클릭으로 바뀌었나(CTR)\" 두 가지로만 결정됨 1. CTR이 괜찮으면 소재는 일단 합격 보는 사람이 클릭을 잘 하고 있으니 소재 매력도·메시지 문제는 아닐 가능성이 높음 그런데도 CPC가 높다면 남는 변수는 CPM(노출 단가) 뿐  CTR  CPM  CPC   1.5%  15,000원  약 1,000원   1.5%  6,000원  약 400원  → 같은 소재·같은 클릭률인데 CPC가 2.5배 차이 2. CPM은 \"누구에게 보여주느냐\"에서 대부분 결정됨 노출은 경매로 팔리므로 같은 사람을 노리는 광고주가 많을수록 그 사람에게 보여주는 값이 오름 CPM이 높은 흔한 상황 타겟이 너무 좁아서 같은 사람에게 반복 노출되며 단가 상승 경쟁이 몰리는 타겟 (예: 2030 여성, 뷰티·육아·반려동물 관심사) 관심사·연령·지역을 여러 겹 걸어 모수가 작아짐 여러 광고세트가 같은 사람을 두고 서로 경쟁 (오디언스 중복 → 타겟 중복) 결론: \"소재는 통하는데 비싸게 사고 있다 → 타겟을 넓히거나 바꿔보자\" 3. 타겟만 원인은 아니므로 같이 확인할 것  시즌 : 10~12월은 블프·연말 경쟁으로 CPM이 전반적으로 오름 → 타겟을 바꿔도 일정 부분은 안 빠질 수 있음 최적화 목표 : 전환 최적화는 구매 가능성 높은 사람을 골라 사서 트래픽 목표보다 CPM이 원래 높음 (문제가 아니라 구조 → 캠페인 목표별 CPM) 게재 위치 : 피드 위주로만 잡으면 릴스·스토리 포함할 때보다 비쌀 수 있음 학습 단계 : 세팅 초기나 예산 변경 직후엔 단가가 불안정 → 학습 단계 진단 순서 정리  CTR  CPC  먼저 볼 것   괜찮음  높음  타겟 (CPM 문제) → 시즌·최적화 목표·게재 위치·학습 단계도 확인   낮음  높음  소재", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 5, "section": "CTR · CVR 조합 진단", "html": "<ul><li>CTR 높음 = 소재가 타겟에게 잘 먹힘(소재 경쟁력) → 이후 전환이 잘 나오는지 확인<\/li><li>전환이 낮다면: 랜딩페이지, 상품, 가격, 자극적 문구로 어그로만 끈 건 아닌지 점검<\/li><\/ul><div class='tbl'><table><thead><tr><th>CTR<\/th><th>CVR<\/th><th>해석<\/th><th>액션<\/th><\/tr><\/thead><tbody><tr><td>높음<\/td><td>낮음<\/td><td>과장 광고 or 랜딩페이지 약함<\/td><td>랜딩·상품·가격 점검<\/td><\/tr><tr><td>낮음<\/td><td>높음<\/td><td>구매 의지 강한 고객층<\/td><td>광고 소재 개선<\/td><\/tr><\/tbody><\/table><\/div>", "text": "CTR 높음 = 소재가 타겟에게 잘 먹힘(소재 경쟁력) → 이후 전환이 잘 나오는지 확인 전환이 낮다면: 랜딩페이지, 상품, 가격, 자극적 문구로 어그로만 끈 건 아닌지 점검  CTR  CVR  해석  액션   높음  낮음  과장 광고 or 랜딩페이지 약함  랜딩·상품·가격 점검   낮음  높음  구매 의지 강한 고객층  광고 소재 개선", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 6, "section": "CPC와 CPA의 관계", "html": "<ul><li>노출 단가가 같다면 CTR이 높을수록 CPC가 내려감<\/li><li>클릭이 싸도 전환율이 낮으면 CPA가 비싸짐 / 클릭이 비싸도 전환율이 높으면 CPA는 괜찮음<\/li><\/ul>", "text": "노출 단가가 같다면 CTR이 높을수록 CPC가 내려감 클릭이 싸도 전환율이 낮으면 CPA가 비싸짐 / 클릭이 비싸도 전환율이 높으면 CPA는 괜찮음", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 7, "section": "유입 측정 — 광고로 얼마나 들어왔나", "html": "<ul><li><strong>트래픽<\/strong>: 광고를 보고 클릭해서 유입된 사람<\/li><li><strong>브랜드 검색량<\/strong>: 광고로 브랜드를 인지한 사람이 나중에 검색해서 유입 → 인지도 지표<\/li><li>메타의 클릭 vs 링크 클릭 구분: <a href=\"#\" class=\"note-link\" data-note=\"05_메타/계정_권한_지표.md\">메타 지표 메모<\/a><\/li><\/ul>", "text": "트래픽 : 광고를 보고 클릭해서 유입된 사람 브랜드 검색량 : 광고로 브랜드를 인지한 사람이 나중에 검색해서 유입 → 인지도 지표 메타의 클릭 vs 링크 클릭 구분: 메타 지표 메모", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 8, "section": "기타 개념", "html": "<ul><li><strong>리타겟팅<\/strong>: 구매 의지가 높아 CTR·CVR이 높고 CPA가 낮게 나올 가능성 큼. 단, 타겟 규모가 작음<\/li><li><strong>간접전환<\/strong>: 광고 클릭 후 일정 기간 뒤 구매한 경우. 고관여 제품일수록 많음<\/li><li><strong>기여도(어트리뷰션)<\/strong>: 고객이 여러 곳에서 여러 광고를 봤을 때 성과를 어디에 나눌지 정하는 방식<ul><li>라스트 클릭 / 퍼스트 클릭 / 선형 / 데이터 기반<\/li><li>내 메모: 고객 마음을 모르는데 뭘 보고 샀는지 어떻게 알지? → 그래서 모델별로 해석이 달라지고, 데이터 기반 모델은 실제 전환 경로 데이터로 비중을 추정함<\/li><\/ul><\/li><\/ul>", "text": "리타겟팅 : 구매 의지가 높아 CTR·CVR이 높고 CPA가 낮게 나올 가능성 큼. 단, 타겟 규모가 작음 간접전환 : 광고 클릭 후 일정 기간 뒤 구매한 경우. 고관여 제품일수록 많음 기여도(어트리뷰션) : 고객이 여러 곳에서 여러 광고를 봤을 때 성과를 어디에 나눌지 정하는 방식 라스트 클릭 / 퍼스트 클릭 / 선형 / 데이터 기반 내 메모: 고객 마음을 모르는데 뭘 보고 샀는지 어떻게 알지? → 그래서 모델별로 해석이 달라지고, 데이터 기반 모델은 실제 전환 경로 데이터로 비중을 추정함", "flag": false}, {"note": "04_기초개념/광고지표_퍼널.md", "order": 9, "section": "미정리 질문", "html": "<ul><li>Q. 여러 매체를 동시에 광고 집행할 경우? <em>(답 정리 필요 — 기여도·중복 전환 이슈와 연결)<\/em><\/li><\/ul>", "text": "Q. 여러 매체를 동시에 광고 집행할 경우? (답 정리 필요 — 기여도·중복 전환 이슈와 연결)", "flag": true}, {"note": "04_기초개념/마케팅_기본_프레임워크.md", "order": 0, "section": "1. 환경분석 (현재 상황 파악)", "html": "<ul><li><strong>3C<\/strong>: 자사(Company)·고객(Customer)·경쟁사(Competitor) 분석<\/li><li><strong>SWOT<\/strong>: 내부의 강점·약점, 외부의 기회·위협 정리<\/li><li><strong>PEST<\/strong>: 정치·경제·사회·기술 등 거시 환경 분석<\/li><li><strong>5 Forces<\/strong>: 경쟁자, 신규 진입자, 대체재, 공급자·구매자 교섭력으로 산업 매력도 판단<\/li><\/ul>", "text": "3C : 자사(Company)·고객(Customer)·경쟁사(Competitor) 분석 SWOT : 내부의 강점·약점, 외부의 기회·위협 정리 PEST : 정치·경제·사회·기술 등 거시 환경 분석 5 Forces : 경쟁자, 신규 진입자, 대체재, 공급자·구매자 교섭력으로 산업 매력도 판단", "flag": false}, {"note": "04_기초개념/마케팅_기본_프레임워크.md", "order": 1, "section": "2. STP (누구에게 어떻게 팔지)", "html": "<ul><li><strong>세분화(Segmentation)<\/strong>: 나이·지역·라이프스타일 등으로 시장을 나눔<\/li><li><strong>타깃팅(Targeting)<\/strong>: 그중 공략할 고객층 선택<\/li><li><strong>포지셔닝(Positioning)<\/strong>: 고객 머릿속에 \"이 브랜드는 ○○\"로 자리 잡게 함<\/li><\/ul>", "text": "세분화(Segmentation) : 나이·지역·라이프스타일 등으로 시장을 나눔 타깃팅(Targeting) : 그중 공략할 고객층 선택 포지셔닝(Positioning) : 고객 머릿속에 \"이 브랜드는 ○○\"로 자리 잡게 함", "flag": false}, {"note": "04_기초개념/마케팅_기본_프레임워크.md", "order": 2, "section": "3. PLC (제품 수명주기)", "html": "<div class='tbl'><table><thead><tr><th>단계<\/th><th>마케팅 목표<\/th><\/tr><\/thead><tbody><tr><td>도입기<\/td><td>인지도 쌓기, 시험 구매 유도<\/td><\/tr><tr><td>성장기<\/td><td>점유율 확대, 경쟁 대응<\/td><\/tr><tr><td>성숙기<\/td><td>차별화, 충성 고객 유지<\/td><\/tr><tr><td>쇠퇴기<\/td><td>비용 줄이기, 리뉴얼 또는 철수<\/td><\/tr><\/tbody><\/table><\/div>", "text": "단계  마케팅 목표   도입기  인지도 쌓기, 시험 구매 유도   성장기  점유율 확대, 경쟁 대응   성숙기  차별화, 충성 고객 유지   쇠퇴기  비용 줄이기, 리뉴얼 또는 철수", "flag": false}, {"note": "04_기초개념/마케팅_기본_프레임워크.md", "order": 3, "section": "4. 수요 상황별 마케팅 8가지 (코틀러)", "html": "<div class='tbl'><table><thead><tr><th>마케팅<\/th><th>수요 상황<\/th><th>할 일<\/th><\/tr><\/thead><tbody><tr><td>전환적<\/td><td>싫어하는 수요<\/td><td>좋아하게<\/td><\/tr><tr><td>자극적<\/td><td>무관심<\/td><td>관심 생기게<\/td><\/tr><tr><td>개발적<\/td><td>잠재 욕구<\/td><td>실제 상품으로<\/td><\/tr><tr><td>재마케팅<\/td><td>감소하는 수요<\/td><td>되살리기<\/td><\/tr><tr><td>동시화<\/td><td>불규칙한 수요<\/td><td>고르게<\/td><\/tr><tr><td>유지<\/td><td>적정 수요<\/td><td>지키기<\/td><\/tr><tr><td>억제적(디마케팅)<\/td><td>과잉 수요<\/td><td>줄이기<\/td><\/tr><tr><td>대항적<\/td><td>해로운 수요<\/td><td>없애기<\/td><\/tr><\/tbody><\/table><\/div>", "text": "마케팅  수요 상황  할 일   전환적  싫어하는 수요  좋아하게   자극적  무관심  관심 생기게   개발적  잠재 욕구  실제 상품으로   재마케팅  감소하는 수요  되살리기   동시화  불규칙한 수요  고르게   유지  적정 수요  지키기   억제적(디마케팅)  과잉 수요  줄이기   대항적  해로운 수요  없애기", "flag": false}, {"note": "04_기초개념/마케팅_기본_프레임워크.md", "order": 4, "section": "5. 브랜딩 프로세스", "html": "<ol><li>브랜드 정체성(핵심 가치) 정의<\/li><li>이름·로고·톤 등 요소 개발<\/li><li>커뮤니케이션으로 인지도 형성<\/li><li>브랜드 경험 관리로 충성도 확보<\/li><\/ol>", "text": "1. 브랜드 정체성(핵심 가치) 정의 2. 이름·로고·톤 등 요소 개발 3. 커뮤니케이션으로 인지도 형성 4. 브랜드 경험 관리로 충성도 확보", "flag": false}, {"note": "04_기초개념/마케팅_기본_프레임워크.md", "order": 5, "section": "핵심: 진단 먼저, 처방은 나중", "html": "<ul><li>이 순서대로 <strong>진단(1~4)을 먼저<\/strong> 하고 <strong>처방(광고·브랜딩)<\/strong>을 해야 함<\/li><li>제안서에서 \"시장을 얼마나 이해하는지\" 보여주는 근거가 바로 이 진단 단계 → <a href=\"#\" class=\"note-link\" data-note=\"03_회사내규/제안서_작성_워크플로우.md\">제안서 작성 워크플로우<\/a><\/li><\/ul>", "text": "이 순서대로 진단(1~4)을 먼저 하고 처방(광고·브랜딩) 을 해야 함 제안서에서 \"시장을 얼마나 이해하는지\" 보여주는 근거가 바로 이 진단 단계 → 제안서 작성 워크플로우", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 0, "section": "용어", "html": "<ul><li><strong>MMP<\/strong>: 앱 트래킹 툴 (Mobile Measurement Partner — 앱스플라이어, 에어브릿지 등)<\/li><li><strong>CPI<\/strong>: 앱 설치당 비용 (보통 500원대)<\/li><li><strong>CPA<\/strong>: 회원가입 등 특정 행동당 비용<\/li><\/ul>", "text": "MMP : 앱 트래킹 툴 (Mobile Measurement Partner — 앱스플라이어, 에어브릿지 등) CPI : 앱 설치당 비용 (보통 500원대) CPA : 회원가입 등 특정 행동당 비용", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 1, "section": "핵심 포인트", "html": "<ul><li>앱 광고는 <strong>메타 &lt; 구글<\/strong>을 더 많이 씀<\/li><li><strong>CPA 단가를 잡으려면 CPI 단가부터 잡아야 함<\/strong><\/li><li>회원가입 전환을 만들려면 <strong>매체별 앱 설치 비중을 파악하고 이탈률<\/strong>을 봐야 함<\/li><li>메타에서 잡을 수 있는 타겟과 구글에서 잡을 수 있는 타겟이 다름. 상대적으로 <strong>전환당 비용은 구글이 잘 잡힘<\/strong><\/li><\/ul>", "text": "앱 광고는 메타 < 구글 을 더 많이 씀 CPA 단가를 잡으려면 CPI 단가부터 잡아야 함 회원가입 전환을 만들려면 매체별 앱 설치 비중을 파악하고 이탈률 을 봐야 함 메타에서 잡을 수 있는 타겟과 구글에서 잡을 수 있는 타겟이 다름. 상대적으로 전환당 비용은 구글이 잘 잡힘", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 2, "section": "입찰 전략 (메타·구글 모두 가능)", "html": "<ul><li><strong>전환 수 극대화<\/strong> vs <strong>전환 가치 극대화<\/strong><\/li><li>객단가에 따라 운영 방식을 다르게 가져갈 수 있음 (객단가 높으면 가치 극대화 고려)<\/li><\/ul>", "text": "전환 수 극대화 vs 전환 가치 극대화 객단가에 따라 운영 방식을 다르게 가져갈 수 있음 (객단가 높으면 가치 극대화 고려)", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 3, "section": "매체별 메모", "html": "<ul><li>구글은 CPI가 없고 거의 CPA → <a href=\"#\" class=\"note-link\" data-note=\"07_구글/앱광고.md\">구글 앱 광고<\/a><\/li><\/ul>", "text": "구글은 CPI가 없고 거의 CPA → 구글 앱 광고", "flag": false}, {"note": "04_기초개념/앱광고.md", "order": 4, "section": "사례", "html": "<ul><li><a href=\"#\" class=\"note-link\" data-note=\"09_실무/2026-10-15_다운도케어_앱광고_제안.md\">다운도케어 앱 광고 제안<\/a> (D사·J사 유사 사례 포함)<\/li><\/ul>", "text": "다운도케어 앱 광고 제안 (D사·J사 유사 사례 포함)", "flag": false}, {"note": "04_기초개념/예산_수수료_VAT_계산.md", "order": 0, "section": "총예산 200만 원 안에 모두 포함하는 경우", "html": "<div class='tbl'><table><thead><tr><th>조건<\/th><th>광고비<\/th><th>수수료(15%)<\/th><th>VAT<\/th><th>합계<\/th><\/tr><\/thead><tbody><tr><td>VAT 없음<\/td><td>1,739,130원<\/td><td>260,870원<\/td><td>–<\/td><td>2,000,000원<\/td><\/tr><tr><td>VAT가 광고비+수수료 모두에 붙음<\/td><td><strong>1,581,028원<\/strong><\/td><td>237,154원<\/td><td>181,818원<\/td><td>2,000,000원<\/td><\/tr><tr><td>VAT가 수수료에만 붙음<\/td><td>1,716,738원<\/td><td>257,511원<\/td><td>25,751원<\/td><td>2,000,000원<\/td><\/tr><\/tbody><\/table><\/div><ul><li>공식(광고비+수수료 모두 VAT): <strong>광고비 = 총예산 ÷ (1.15 × 1.1) = 총예산 ÷ 1.265<\/strong><\/li><li>수수료를 별도로 내는 경우: 광고비 200만 원 + 수수료 30만 원 = 총 230만 원<\/li><\/ul>", "text": "조건  광고비  수수료(15%)  VAT  합계   VAT 없음  1,739,130원  260,870원  –  2,000,000원   VAT가 광고비+수수료 모두에 붙음  1,581,028원  237,154원  181,818원  2,000,000원   VAT가 수수료에만 붙음  1,716,738원  257,511원  25,751원  2,000,000원  공식(광고비+수수료 모두 VAT): 광고비 = 총예산 ÷ (1.15 × 1.1) = 총예산 ÷ 1.265 수수료를 별도로 내는 경우: 광고비 200만 원 + 수수료 30만 원 = 총 230만 원", "flag": false}, {"note": "04_기초개념/예산_수수료_VAT_계산.md", "order": 1, "section": "핵심 숫자 1.265", "html": "<ul><li>광고비 1원당 실제로 나가는 돈 (수수료 15% + VAT 10%)<\/li><li>실제 비용 = 광고비 × 1.265 → ROAS 계산에는 잡히지 않으므로 손익 계산 시 반드시 반영<\/li><li>활용: <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/CPA_ROAS_손익분기.md\">CPA · ROAS · 손익분기<\/a><\/li><li>수수료·VAT는 광고비 바깥의 돈이므로 <strong>노출량은 광고비만 기준으로 계산<\/strong> (<a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/광고지표_퍼널.md\">광고 지표와 퍼널<\/a>)<\/li><\/ul>", "text": "광고비 1원당 실제로 나가는 돈 (수수료 15% + VAT 10%) 실제 비용 = 광고비 × 1.265 → ROAS 계산에는 잡히지 않으므로 손익 계산 시 반드시 반영 활용: CPA · ROAS · 손익분기 수수료·VAT는 광고비 바깥의 돈이므로 노출량은 광고비만 기준으로 계산 (광고 지표와 퍼널)", "flag": false}, {"note": "05_메타/ABO_ASC_운영_소재기획.md", "order": 0, "section": "캠페인 역할 분리", "html": "<p>현재의 ABO·ASC 병행 구조는 유지하되, 두 캠페인의 역할을 명확히 나눠 운영합니다.<\/p><ul><li><strong>ABO (테스트, 예산의 20~30%)<\/strong>: 컨셉별로 광고세트를 나누고 동일 예산으로 신규 소재를 검증<\/li><li><strong>ASC (확장, 예산의 70~80%)<\/strong>: 테스트를 통과한 소재만 편입해 매출 확대<\/li><\/ul>", "text": "현재의 ABO·ASC 병행 구조는 유지하되, 두 캠페인의 역할을 명확히 나눠 운영합니다. ABO (테스트, 예산의 20~30%) : 컨셉별로 광고세트를 나누고 동일 예산으로 신규 소재를 검증 ASC (확장, 예산의 70~80%) : 테스트를 통과한 소재만 편입해 매출 확대", "flag": false}, {"note": "05_메타/ABO_ASC_운영_소재기획.md", "order": 1, "section": "테스트 방법", "html": "<ul><li><strong>순서<\/strong>: 컨셉·소구점 → 포맷 → 후킹(첫 3초·첫 문장) → 디테일. 한 번에 한 변수씩 검증<\/li><li><strong>판단 기준<\/strong>: 소재당 목표 CPA의 1~2배 소진 시점에 후킹률, CTR, CVR, CPA, ROAS로 <strong>승격 / 재테스트 / 종료<\/strong> 판정<\/li><\/ul>", "text": "순서 : 컨셉·소구점 → 포맷 → 후킹(첫 3초·첫 문장) → 디테일. 한 번에 한 변수씩 검증 판단 기준 : 소재당 목표 CPA의 1~2배 소진 시점에 후킹률, CTR, CVR, CPA, ROAS로 승격 / 재테스트 / 종료 판정", "flag": false}, {"note": "05_메타/ABO_ASC_운영_소재기획.md", "order": 2, "section": "USP 외 신규 소재 제안", "html": "<ul><li>USP 소재는 비교·검토 단계 고객에게 강하지만, 신규 고객을 넓히는 데는 한계가 있음<\/li><li>그래서 <strong>타겟(페르소나) × 소비 상황(TPO) × 인지 단계<\/strong> 조합으로 기획<\/li><li>소재 방향<ul><li>문제 제기·공감형<\/li><li>상황형<\/li><li>페르소나형<\/li><li>리뷰·사회적 증거형<\/li><li>UGC·파트너십형<\/li><li>비교·반박형<\/li><li>오퍼·시즌형<\/li><\/ul><\/li><li><strong>기획 근거<\/strong>: 구매 리뷰, 고객 문의, 광고 댓글, 검색 키워드, 경쟁사 광고 분석<\/li><\/ul>", "text": "USP 소재는 비교·검토 단계 고객에게 강하지만, 신규 고객을 넓히는 데는 한계가 있음 그래서 타겟(페르소나) × 소비 상황(TPO) × 인지 단계 조합으로 기획 소재 방향 문제 제기·공감형 상황형 페르소나형 리뷰·사회적 증거형 UGC·파트너십형 비교·반박형 오퍼·시즌형 기획 근거 : 구매 리뷰, 고객 문의, 광고 댓글, 검색 키워드, 경쟁사 광고 분석", "flag": false}, {"note": "05_메타/경매_CPM_캠페인목표.md", "order": 0, "section": "경매 구조", "html": "<p><strong>총 가치 = 입찰가 × 예상 반응률 + 광고 품질<\/strong><\/p><ul><li>승자는 입찰가가 아니라 <strong>총 가치가 가장 높은 광고<\/strong><\/li><li>반응률·품질이 좋으면 <strong>더 낮은 입찰가로도 이김<\/strong><\/li><li>반응이 낮은 광고는 같은 노출을 사려면 더 비싸게 내야 하거나 노출이 줄어듦 (직접적 벌금은 아니지만 결과적으로 비용 상승)<\/li><li>메타가 이렇게 하는 이유: 사용자가 반응 없는 광고를 계속 보면 앱 체류가 줄어들기 때문<\/li><\/ul>", "text": "총 가치 = 입찰가 × 예상 반응률 + 광고 품질 승자는 입찰가가 아니라 총 가치가 가장 높은 광고 반응률·품질이 좋으면 더 낮은 입찰가로도 이김 반응이 낮은 광고는 같은 노출을 사려면 더 비싸게 내야 하거나 노출이 줄어듦 (직접적 벌금은 아니지만 결과적으로 비용 상승) 메타가 이렇게 하는 이유: 사용자가 반응 없는 광고를 계속 보면 앱 체류가 줄어들기 때문", "flag": false}, {"note": "05_메타/경매_CPM_캠페인목표.md", "order": 1, "section": "예상 반응률", "html": "<ul><li>광고주는 <strong>정확한 숫자를 볼 수 없음<\/strong> (노출마다 메타가 실시간 예측)<\/li><li>예측에 쓰이는 정보: 사용자의 과거 행동, 광고의 지금까지 성과, 비슷한 광고 성과, 소재·랜딩 특성<\/li><li>새 광고는 데이터가 적어 <strong>예상 반응률이 낮게 시작<\/strong><\/li><li>간접 확인: CTR, 참여율, CPM 추이<\/li><\/ul>", "text": "광고주는 정확한 숫자를 볼 수 없음 (노출마다 메타가 실시간 예측) 예측에 쓰이는 정보: 사용자의 과거 행동, 광고의 지금까지 성과, 비슷한 광고 성과, 소재·랜딩 특성 새 광고는 데이터가 적어 예상 반응률이 낮게 시작 간접 확인: CTR, 참여율, CPM 추이", "flag": false}, {"note": "05_메타/경매_CPM_캠페인목표.md", "order": 2, "section": "캠페인 목표별로 CPM이 다른 이유 (인지도 vs 트래픽)", "html": "<p>같은 예산인데 인지도 캠페인 노출이 수십 배 많은 이유:<\/p><ol><li><strong>최적화 목표가 다르면 사는 노출이 다름<\/strong><ul><li>인지도: \"최대한 많이, 싸게\" → 반응 가능성 낮은 사람, 경쟁 적은 지면 위주로 <strong>싼 노출<\/strong><\/li><li>트래픽/전환: \"클릭·구매할 사람에게\" → 반응 가능성 높은 소수, 다른 광고주도 노리는 사람이라 <strong>비쌈<\/strong><\/li><\/ul><\/li><li><strong>경매 구조<\/strong>: 잘 반응하는 사람은 입찰 경쟁이 치열, 아무도 원치 않는 노출은 거의 공짜<\/li><li><strong>노출의 질<\/strong>: 인지도 노출에는 스치는 노출, 반복 노출, 저가 지면이 많이 섞임<\/li><\/ol><p><strong>비교는 목적에 맞는 지표로<\/strong><\/p><ul><li>브랜드 알리기 → 도달, 빈도, 1,000명 도달당 비용<\/li><li>방문·구매 → CPC, 랜딩페이지 조회당 비용, 구매당 비용<\/li><\/ul>", "text": "같은 예산인데 인지도 캠페인 노출이 수십 배 많은 이유: 1. 최적화 목표가 다르면 사는 노출이 다름 인지도: \"최대한 많이, 싸게\" → 반응 가능성 낮은 사람, 경쟁 적은 지면 위주로 싼 노출 트래픽/전환: \"클릭·구매할 사람에게\" → 반응 가능성 높은 소수, 다른 광고주도 노리는 사람이라 비쌈 2. 경매 구조 : 잘 반응하는 사람은 입찰 경쟁이 치열, 아무도 원치 않는 노출은 거의 공짜 3. 노출의 질 : 인지도 노출에는 스치는 노출, 반복 노출, 저가 지면이 많이 섞임 비교는 목적에 맞는 지표로 브랜드 알리기 → 도달, 빈도, 1,000명 도달당 비용 방문·구매 → CPC, 랜딩페이지 조회당 비용, 구매당 비용", "flag": false}, {"note": "05_메타/경매_CPM_캠페인목표.md", "order": 3, "section": "인지도 캠페인이 쓸모 있는 경우 (소규모도 가능)", "html": "<ul><li>지역 매장 반경 노출<\/li><li>신규 오픈·런칭 초기<\/li><li>영상 시청자·참여자를 모아 이후 리타겟팅 연결<\/li><\/ul>", "text": "지역 매장 반경 노출 신규 오픈·런칭 초기 영상 시청자·참여자를 모아 이후 리타겟팅 연결", "flag": false}, {"note": "05_메타/계정_권한_지표.md", "order": 0, "section": "조회 권한 받기", "html": "<ul><li>메타 광고주센터(비즈니스 설정) &gt; <strong>광고 계정<\/strong> &gt; <strong>사람 할당<\/strong><\/li><li><strong>전체 권한이 아닌 \"성과 보기\"<\/strong> 체크<\/li><li>마케터 이메일 아이디 입력 <strong>또는<\/strong> 우리 회사 비즈니스 ID <code>1536552186589906<\/code> 입력<\/li><\/ul>", "text": "메타 광고주센터(비즈니스 설정)  광고 계정   사람 할당  전체 권한이 아닌 \"성과 보기\" 체크 마케터 이메일 아이디 입력 또는 우리 회사 비즈니스 ID 1536552186589906 입력", "flag": false}, {"note": "05_메타/계정_권한_지표.md", "order": 1, "section": "계정 · 결제", "html": "<ul><li>광고주 포트폴리오 → 광고주 카드로 결제<\/li><li>충전이 안 되거나 우리 회사 포트폴리오 → 광고주가 송금, 우리가 충전<\/li><li>⚠️ 신규 계정은 신뢰도가 떨어져 담배 같은 업종은 막힘<\/li><li>자세히: <a href=\"#\" class=\"note-link\" data-note=\"03_회사내규/견적_정산_세금계산서.md\">견적·정산·세금계산서<\/a><\/li><\/ul>", "text": "광고주 포트폴리오 → 광고주 카드로 결제 충전이 안 되거나 우리 회사 포트폴리오 → 광고주가 송금, 우리가 충전 ⚠️ 신규 계정은 신뢰도가 떨어져 담배 같은 업종은 막힘 자세히: 견적·정산·세금계산서", "flag": false}, {"note": "05_메타/계정_권한_지표.md", "order": 2, "section": "클릭 vs 링크 클릭", "html": "<ul><li><strong>클릭(전체)<\/strong>: 링크 클릭 포함, 프로필 이름·좋아요·댓글·이미지 확대·더 보기 등 모든 클릭 반응 → 이 기준 CTR은 실제보다 좋아 보임<\/li><li><strong>링크 클릭<\/strong>: 광고에서 외부로 나가는 링크를 클릭한 횟수 → <strong>유입 성과는 링크 클릭 기준<\/strong>으로 판단<\/li><\/ul>", "text": "클릭(전체) : 링크 클릭 포함, 프로필 이름·좋아요·댓글·이미지 확대·더 보기 등 모든 클릭 반응 → 이 기준 CTR은 실제보다 좋아 보임 링크 클릭 : 광고에서 외부로 나가는 링크를 클릭한 횟수 → 유입 성과는 링크 클릭 기준 으로 판단", "flag": false}, {"note": "05_메타/광고라이브러리_소재분석.md", "order": 0, "section": "광고 라이브러리 체크", "html": "<ul><li>광고를 눌렀을 때 링크가 <strong>브랜드(스마트스토어 등)로 연결<\/strong>되면 → <strong>네이버 협력광고<\/strong>를 진행 중인 것<\/li><\/ul>", "text": "광고를 눌렀을 때 링크가 브랜드(스마트스토어 등)로 연결 되면 → 네이버 협력광고 를 진행 중인 것", "flag": false}, {"note": "05_메타/광고라이브러리_소재분석.md", "order": 1, "section": "소재 태클 포인트", "html": "<ul><li>예: \"USP·타겟 포인트가 잘 노출되지 않는 소재 같다\"<\/li><\/ul>", "text": "예: \"USP·타겟 포인트가 잘 노출되지 않는 소재 같다\"", "flag": false}, {"note": "05_메타/광고라이브러리_소재분석.md", "order": 2, "section": "고관여 vs 저관여 소구 (펫푸드 예시)", "html": "<div class='tbl'><table><thead><tr><th>구분<\/th><th>고객<\/th><th>소구 포인트<\/th><\/tr><\/thead><tbody><tr><td>고관여<\/td><td>비싼 사료 구매자<\/td><td>자식, 우리 애기, 유기농 등 감성·품질<\/td><\/tr><tr><td>저관여<\/td><td>가성비 구매자<\/td><td>3+1, 기간 한정(상시 정가인데 할인인 척), 1+1+1+1 등 금액 혜택<\/td><\/tr><\/tbody><\/table><\/div>", "text": "구분  고객  소구 포인트   고관여  비싼 사료 구매자  자식, 우리 애기, 유기농 등 감성·품질   저관여  가성비 구매자  3+1, 기간 한정(상시 정가인데 할인인 척), 1+1+1+1 등 금액 혜택", "flag": false}, {"note": "05_메타/광고라이브러리_소재분석.md", "order": 3, "section": "USP 쉽게 파악하는 법", "html": "<ul><li>그 업체의 <strong>인플루언서 광고 영상<\/strong>을 보면 USP를 다 말해 줌<\/li><\/ul>", "text": "그 업체의 인플루언서 광고 영상 을 보면 USP를 다 말해 줌", "flag": false}, {"note": "05_메타/소재_테스트.md", "order": 0, "section": "테스트 방법 4가지 비교", "html": "<h4>① 메타 A/B 테스트(실험) 기능 — 꺼리는 이유<\/h4><ul><li>타겟·예산을 반반 나눠서 <strong>예산이 많이 필요<\/strong>, 소액이면 \"유의미한 차이 없음\"으로 끝나기 쉬움<\/li><li>공정 비교가 목적이라 잘 되는 쪽으로 예산을 몰아주지 않음<\/li><li>학습이 새로 시작, 테스트 중 수정 제한<\/li><\/ul><h4>② 캠페인·광고 세트를 따로 만들어 비교<\/h4><ul><li>실제 운영 조건에 가깝지만 타겟이 겹치면 <strong>오버랩 문제<\/strong> (<a href=\"#\" class=\"note-link\" data-note=\"05_메타/타겟팅_타겟중복.md\">타겟 중복<\/a>), 엄밀한 비교는 아님<\/li><\/ul><h4>③ 한 광고 세트 안에 소재 여러 개<\/h4><ul><li>메타가 <strong>하나 또는 소수 광고에 예산을 몰아줌<\/strong> (광고 세트 전체 결과 최대화 목적)<\/li><li>장점: 예산 분산 없음, 방향을 빨리 봄<\/li><li>단점: <strong>공정한 비교가 아님<\/strong><ul><li>승자를 빨리 정해서 좋은 소재가 충분히 테스트받지 못하고 묻힐 수 있음<\/li><li>예산 많이 받은 소재 = 초반에 노출하기 쉬웠던 소재일 수도 있음<\/li><\/ul><\/li><\/ul><h4>④ 광고 세트 하나에 광고 하나씩<\/h4><ul><li>각 소재 예산이 보장되어 공정하지만 예산을 쪼갬<\/li><li><strong>의견이 갈리는 문제<\/strong> (분리했더니 성과가 더 좋았다는 테스트도 있음)<\/li><li>일 5만 원을 4개로 나누면 각각 12,500원 → 구매당 비용 1~2만 원대면 하루 1건도 안 나와 비교 불가 (단순 산수)<\/li><li>참고: 일 5만 원이면 합쳐도 주 50건은 어려우므로 \"학습 분산\"은 결정적 이유가 아님<\/li><\/ul><blockquote class='warn'>⚠️ 정정: \"1광고 1광고세트는 추천하기 어렵다(학습 분산)\" → 의견이 갈리는 문제이고, 진짜 이유는 예산 산수<\/blockquote><blockquote><strong>결론 (의견)<\/strong>: 일 5만 원이면 <strong>광고 세트 하나에 확실히 다른 소재 2~3개<\/strong>가 현실적<\/blockquote>", "text": "① 메타 A/B 테스트(실험) 기능 — 꺼리는 이유 타겟·예산을 반반 나눠서 예산이 많이 필요 , 소액이면 \"유의미한 차이 없음\"으로 끝나기 쉬움 공정 비교가 목적이라 잘 되는 쪽으로 예산을 몰아주지 않음 학습이 새로 시작, 테스트 중 수정 제한  ② 캠페인·광고 세트를 따로 만들어 비교 실제 운영 조건에 가깝지만 타겟이 겹치면 오버랩 문제 (타겟 중복), 엄밀한 비교는 아님  ③ 한 광고 세트 안에 소재 여러 개 메타가 하나 또는 소수 광고에 예산을 몰아줌 (광고 세트 전체 결과 최대화 목적) 장점: 예산 분산 없음, 방향을 빨리 봄 단점: 공정한 비교가 아님 승자를 빨리 정해서 좋은 소재가 충분히 테스트받지 못하고 묻힐 수 있음 예산 많이 받은 소재 = 초반에 노출하기 쉬웠던 소재일 수도 있음  ④ 광고 세트 하나에 광고 하나씩 각 소재 예산이 보장되어 공정하지만 예산을 쪼갬 의견이 갈리는 문제 (분리했더니 성과가 더 좋았다는 테스트도 있음) 일 5만 원을 4개로 나누면 각각 12,500원 → 구매당 비용 1~2만 원대면 하루 1건도 안 나와 비교 불가 (단순 산수) 참고: 일 5만 원이면 합쳐도 주 50건은 어려우므로 \"학습 분산\"은 결정적 이유가 아님  ⚠️ 정정: \"1광고 1광고세트는 추천하기 어렵다(학습 분산)\" → 의견이 갈리는 문제이고, 진짜 이유는 예산 산수  결론 (의견) : 일 5만 원이면 광고 세트 하나에 확실히 다른 소재 2~3개 가 현실적", "flag": false}, {"note": "05_메타/소재_테스트.md", "order": 1, "section": "소재 개수 · 기간 가이드 (실무 권장, 메타 공식 아님)", "html": "<ul><li>광고 세트 예산 하루 50달러 미만 → <strong>소재 최대 3개<\/strong><\/li><li>하루 50달러 수준 → 확실히 다른 새 소재 2~3개<\/li><li>기간: <strong>최소 7일 수정 없이<\/strong>, 소재당 하루 구매 1건 정도 예산으로 <strong>7~14일<\/strong><\/li><li>구매당 비용 약 2만 원 이하 → 소재 2~3개, 7일 / 그보다 비싸면 → 소재 2개, 14일까지<\/li><li>구매가 적으면 CTR, 클릭당 비용 등 앞단 지표도 같이 판단 (의견)<\/li><li>소재는 문구만 다른 게 아니라 <strong>각도 자체가 다르게<\/strong> (사진 vs 영상, 전체 세팅 vs 클로즈업)<\/li><\/ul>", "text": "광고 세트 예산 하루 50달러 미만 → 소재 최대 3개 하루 50달러 수준 → 확실히 다른 새 소재 2~3개 기간: 최소 7일 수정 없이 , 소재당 하루 구매 1건 정도 예산으로 7~14일 구매당 비용 약 2만 원 이하 → 소재 2~3개, 7일 / 그보다 비싸면 → 소재 2개, 14일까지 구 der": 0, "section": "넓게 열어두는 게 잘 먹히는 조건", "html": "<ul><li>뷰티·패션·생활용품처럼 <strong>누구나 살 수 있는 상품<\/strong><\/li><li>픽셀에 <strong>구매 데이터가 많이 쌓인 계정<\/strong><\/li><li>이 경우 좁히면 메타가 고를 후보만 줄고 CPM 상승<\/li><\/ul>", "text": "뷰티·패션·생활용품처럼 누구나 살 수 있는 상품 픽셀에 구매 데이터가 많이 쌓인 계정 이 경우 좁히면 메타가 고를 후보만 줄고 CPM 상승", "flag": false}, {"note": "05_메타/타겟팅_타겟중복.md", "order": 1, "section": "니치 업종(예: 파충류)은 다름", "html": "<ul><li>살 사람이 소수 → 넓게 열면 그 소수를 찾을 때까지 시행착오 비용이 큼<\/li><li>\"파충류\" 관심사는 변별력 있는 신호<\/li><li>넓게 열어도 \"랜덤\"은 아니지만, <strong>초반 데이터가 없으면 헛발질이 생김<\/strong><\/li><\/ul>", "text": "살 사람이 소수 → 넓게 열면 그 소수를 찾을 때까지 시행착오 비용이 큼 \"파충류\" 관심사는 변별력 있는 신호 넓게 열어도 \"랜덤\"은 아니지만, 초반 데이터가 없으면 헛발질이 생김", "flag": false}, {"note": "05_메타/타겟팅_타겟중복.md", "order": 2, "section": "소액·초반 추천 순서 (의견)", "html": "<ol><li>이미 관심 보인 사람 (방문자, 인스타 참여자, 구매자 리스트)<\/li><li>관련 관심사 묶어서 좁게 시작 (단, <strong>너무 좁히지 않기<\/strong> — 같은 사람에게 반복 노출되고 빨리 지침)<\/li><li>구매 데이터가 쌓이면 유사 타겟 → 넓게 확장<\/li><li>소재로 한 번 더 거르기: 첫 화면에 타겟이 바로 알아볼 대상(예: 파충류·사육장)이 확실히 보이게<\/li><\/ol>", "text": "1. 이미 관심 보인 사람 (방문자, 인스타 참여자, 구매자 리스트) 2. 관련 관심사 묶어서 좁게 시작 (단, 너무 좁히지 않기 — 같은 사람에게 반복 노출되고 빨리 지침) 3. 구매 데이터가 쌓이면 유사 타겟 → 넓게 확장 소재로 한 번 더 거르기: 첫 화면에 타겟이 바로 알아볼 대상(예: 파충류·사육장)이 확실히 보이게", "flag": false}, {"note": "05_메타/타겟팅_타겟중복.md", "order": 3, "section": "타겟 중복 (Auction Overlap)", "html": "<ul><li>메타는 같은 광고주의 광고 세트끼리 경매에서 맞붙게 하지 않고 <strong>총 가치가 가장 높은 하나만<\/strong> 내보냄<\/li><li>중복이 많으면 <strong>비용 상승 또는 노출 부족<\/strong> 둘 다 발생 가능 → 성과 불안정<\/li><\/ul><blockquote class='warn'>⚠️ 정정: \"CPM이 아니라 노출 부족 문제\"라고 했던 것 → 비용 상승·노출 부족 <strong>둘 다<\/strong> 가능<\/blockquote><p><strong>해결 방법<\/strong><\/p><ul><li>타겟 중복 확인: 타겟 화면 → 여러 타겟 선택 → 작업 → <strong>타겟 중복 표시<\/strong><\/li><li>제외 타겟 설정 (예: 신규 타겟에서 방문자·구매자 제외)<\/li><li>비슷한 광고 세트 합치기<\/li><li>캠페인 예산(Advantage+ 캠페인 예산) 사용 — 단, 비교 테스트 용도엔 부적합 (<a href=\"#\" class=\"note-link\" data-note=\"05_메타/학습단계_예산.md\">학습 단계·예산<\/a>)<\/li><\/ul>", "text": "메타는 같은 광고주의 광고 세트끼리 경매에서 맞붙게 하지 않고 총 가치가 가장 높은 하나만 내보냄 중복이 많으면 비용 상승 또는 노출 부족 둘 다 발생 가능 → 성과 불안정  ⚠️ 정정: \"CPM이 아니라 노출 부족 문제\"라고 했던 것 → 비용 상승·노출 부족 둘 다 가능 해결 방법 타겟 중복 확인: 타겟 화면 → 여러 타겟 선택 → 작업 → 타겟 중복 표시 제외 타겟 설정 (예: 신규 타겟에서 방문자·구매자 제외) 비슷한 광고 세트 합치기 캠페인 예산(Advantage+ 캠페인 예산) 사용 — 단, 비교 테스트 용도엔 부적합 (학습 단계·예산)", "flag": false}, {"note": "05_메타/타겟팅_타겟중복.md", "order": 4, "section": "CTR은 괜찮은데 CPC가 높으면 타겟 점검", "html": "<ul><li>소재는 통하는데 노출(CPM)을 비싸게 사고 있다는 신호 → 타겟이 너무 좁거나, 경쟁이 몰리는 타겟이거나, 조건을 여러 겹 걸었거나, 광고세트끼리 겹치는지 확인<\/li><li>자세한 이유: <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/광고지표_퍼널.md\">광고 지표와 퍼널<\/a><\/li><\/ul>", "text": "소재는 통하는데 노출(CPM)을 비싸게 사고 있다는 신호 → 타겟이 너무 좁거나, 경쟁이 몰리는 타겟이거나, 조건을 여러 겹 걸었거나, 광고세트끼리 겹치는지 확인 자세한 이유: 광고 지표와 퍼널", "flag": false}, {"note": "05_메타/타겟팅_타겟중복.md", "order": 5, "section": "반복 노출(빈도) 확인", "html": "<ul><li>같은 사람에게 반복 노출되는 건 학습 리셋이 아니라 <strong>타겟이 작기 때문<\/strong> → 빈도(Frequency) 지표로 확인<\/li><li>새 소재는 오히려 피로도를 낮춤<\/li><\/ul>", "text": "같은 사람에게 반복 노출되는 건 학습 리셋이 아니라 타겟이 작기 때문 → 빈도(Frequency) 지표로 확인 새 소재는 오히려 피로도를 낮춤", "flag": false}, {"note": "05_메타/학습단계_예산.md", "order": 0, "section": "학습 단계 (Learning Phase) 기준", "html": "<ul><li>광고 세트가 <strong>마지막 주요 수정 후 7일 안에 최적화 이벤트 약 50건<\/strong> → 학습 종료<\/li><li>못 미치면 <strong>\"학습 제한(Learning Limited)\"<\/strong> — 실패는 아니지만 성과가 불안정<\/li><li>학습 제한 자체는 실패 아님 → <strong>실제 CPA가 손익분기 아래인지<\/strong>가 기준<\/li><\/ul>", "text": "광고 세트가 마지막 주요 수정 후 7일 안에 최적화 이벤트 약 50건 → 학습 종료 못 미치면 \"학습 제한(Learning Limited)\" — 실패는 아니지만 성과가 불안정 학습 제한 자체는 실패 아님 → 실제 CPA가 손익분기 아래인지 가 기준", "flag": false}, {"note": "05_메타/학습단계_예산.md", "order": 1, "section": "학습을 다시 시작시키는 \"주요 수정\"", "html": "<ul><li>타겟 변경<\/li><li>광고 소재 수정<\/li><li><strong>새 광고 추가<\/strong><\/li><li>광고 세트 7일 이상 일시중지<\/li><li>예산 변경 (크기에 따라, 실무에선 <strong>20% 이내<\/strong> 조정 권장)<\/li><\/ul>", "text": "타겟 변경 광고 소재 수정 새 광고 추가 광고 세트 7일 이상 일시중지 예산 변경 (크기에 따라, 실무에선 20% 이내 조정 권장)", "flag": false}, {"note": "05_메타/학습단계_예산.md", "order": 2, "section": "리셋의 범위", "html": "<ul><li><strong>단위: 해당 광고 세트 하나만<\/strong> (다른 광고 세트·캠페인은 영향 없음)<\/li><li>광고 하나를 수정해도 그 광고가 속한 광고 세트 전체가 학습에 들어감<\/li><li>리셋되는 것: <strong>50건 카운트<\/strong> (마지막 주요 수정 이후 전환만 다시 셈)<\/li><li>지워지지 않는 것: <strong>픽셀 데이터<\/strong> (계정 단위 데이터 소스)<\/li><li>메타가 재학습 때 이전 학습을 얼마나 재활용하는지는 <strong>공개 자료 없음<\/strong><\/li><li>\"수정하면 0부터 다시\"는 과장. Jon Loomer 테스트에서는 새 광고 추가 후에도 학습으로 돌아가지 않은 사례가 있음<\/li><\/ul>", "text": "단위: 해당 광고 세트 하나만 (다른 광고 세트·캠페인은 영향 없음) 광고 하나를 수정해도 그 광고가 속한 광고 세트 전체가 학습에 들어감 리셋되는 것: 50건 카운트 (마지막 주요 수정 이후 전환만 다시 셈) 지워지지 않는 것: 픽셀 데이터 (계정 단위 데이터 소스) 메타가 재학습 때 이전 학습을 얼마나 재활용하는지는 공개 자료 없음 \"수정하면 0부터 다시\"는 과장. Jon Loomer 테스트에서는 새 광고 추가 후에도 학습으로 돌아가지 않은 사례가 있음", "flag": false}, {"note": "05_메타/학습단계_예산.md", "order": 3, "section": "소재 교체 실무", "html": "<ul><li><strong>진 소재 끄기<\/strong> → 주요 수정 목록에 없음 (메타가 명시적으로 \"안 된다\"고 한 문서는 못 찾음)<\/li><li><strong>새 소재 추가·기존 소재 수정<\/strong> → 학습 재시작 가능<\/li><li>소재를 바꾸려면 기존 광고를 고치지 말고 <strong>새로 만들어 넣기<\/strong>, 넣을 땐 <strong>한 번에 몰아서<\/strong><\/li><\/ul>", "text": "진 소재 끄기 → 주요 수정 목록에 없음 (메타가 명시적으로 \"안 된다\"고 한 문서는 못 찾음) 새 소재 추가·기존 소재 수정 → 학습 재시작 가능 소재를 바꾸려면 기존 광고를 고치지 말고 새로 만들어 넣기 , 넣을 땐 한 번에 몰아서", "flag": false}, {"note": "05_메타/학습단계_예산.md", "order": 4, "section": "일예산과 목표 CPA", "html": "<p><strong>경험칙: 일예산 ≈ 목표 CPA × 7~10<\/strong><\/p><ul><li>근거: 주 50건 ÷ 7일 → <strong>일예산 ≈ 목표 CPA × 7.1<\/strong><\/li><li>×10은 여유를 둔 실무 경험칙 (메타 공식 규칙 아님, ×5를 최소로 보는 자료도 있음)<\/li><\/ul><div class='tbl'><table><thead><tr><th>일예산 5만 원 기준<\/th><th>필요한 목표 CPA<\/th><\/tr><\/thead><tbody><tr><td>×10 기준<\/td><td>5,000원 이하<\/td><\/tr><tr><td>×7 기준<\/td><td>약 7,100원 이하<\/td><\/tr><\/tbody><\/table><\/div><ul><li>못 맞추면: 학습 제한 감수 / 더 자주 일어나는 이벤트로 최적화 / 예산 증액<\/li><li>×10은 \"학습을 안정적으로 벗어나기 위한 기준\"이지, 이보다 적으면 광고하면 안 된다는 뜻이 아님<\/li><li>목표 CPA 계산법: <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/CPA_ROAS_손익분기.md\">CPA · ROAS · 손익분기<\/a><\/li><\/ul>", "text": "경험칙: 일예산 ≈ 목표 CPA × 7~10 근거: 주 50건 ÷ 7일 → 일예산 ≈ 목표 CPA × 7.1 ×10은 여유를 둔 실무 경험칙 (메타 공식 규칙 아님, ×5를 최소로 보는 자료도 있음)  일예산 5만 원 기준  필요한 목표 CPA   ×10 기준  5,000원 이하   ×7 기준  약 7,100원 이하  못 맞추면: 학습 제한 l": "<ul><li>강점: 실제 게코가 들어간 감성 사진 → 바로 소재로 활용 가능<\/li><li>핵심 타겟: 레오파드게코·펫테일·납테일 등 <strong>바닥 생활형 게코<\/strong> 사육자<\/li><li>객단가 올리기: 예) 락캐슬 + 락케이브 + 락플랜트 = 정가 42,000원 세트, 배송비 1회 또는 소폭 할인<\/li><li>걸리는 점: <strong>리뷰가 적음<\/strong> → 포토리뷰 이벤트 / 락케이브 40% 할인은 마진을 크게 깎음<\/li><li>리타겟팅 비중 고려: 꾸미기 용품은 고민 후 구매하는 경우가 많음<\/li><li>소재는 개별 제품보다 <strong>완성된 사육장<\/strong> 위주가 세트 구매로 이어지기 쉬움<\/li><\/ul>", "text": "강점: 실제 게코가 들어간 감성 사진 → 바로 소재로 활용 가능 핵심 타겟: 레오파드게코·펫테일·납테일 등 바닥 생활형 게코 사육자 객단가 올리기: 예) 락캐슬 + 락케이브 + 락플랜트 = 정가 42,000원 세트, 배송비 1회 또는 소폭 할인 걸리는 점: 리뷰가 적음 → 포토리뷰 이벤트 / 락케이브 40% 할인은 마진을 크게 깎음 리타겟팅 비중 고려: 꾸미기 용품은 고민 후 구매하는 경우가 많음 소재는 개별 제품보다 완성된 사육장 위주가 세트 구매로 이어지기 쉬움", "flag": false}, {"note": "09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "order": 2, "section": "타겟팅 (파충류 니치 업종)", "html": "<ul><li>살 사람이 소수 → 넓게 열면 그 소수를 찾을 때까지 시행착오 비용이 큼<\/li><li>\"파충류\" 관심사는 변별력 있는 신호<\/li><li>넓게 열어도 \"랜덤\"은 아니지만, <strong>초반 데이터가 없으면 헛발질이 생김<\/strong><\/li><li>소액·초반 추천 순서 (의견)<ol><li>이미 관심 보인 사람 (방문자, 인스타 참여자, 구매자 리스트)<\/li><li>관련 관심사 묶어서 좁게 시작 (단, <strong>너무 좁히지 않기<\/strong> — 같은 사람에게 반복 노출되고 빨리 지침)<\/li><li>구매 데이터가 쌓이면 유사 타겟 → 넓게 확장<\/li><\/ol><\/li><li>소재로 한 번 더 거르기: 첫 화면에 파충류·사육장이 확실히 보이게<\/li><li>일반 원칙: <a href=\"#\" class=\"note-link\" data-note=\"05_메타/타겟팅_타겟중복.md\">타겟팅 · 타겟 중복<\/a><\/li><\/ul>", "text": "살 사람이 소수 → 넓게 열면 그 소수를 찾을 때까지 시행착오 비용이 큼 \"파충류\" 관심사는 변별력 있는 신호 넓게 열어도 \"랜덤\"은 아니지만, 초반 데이터가 없으면 헛발질이 생김 소액·초반 추천 순서 (의견) 1. 이미 관심 보인 사람 (방문자, 인스타 참여자, 구매자 리스트) 2. 관련 관심사 묶어서 좁게 시작 (단, 너무 좁히지 않기 — 같은 사람에게 반복 노출되고 빨리 지침) 3. 구매 데이터가 쌓이면 유사 타겟 → 넓게 확장 소재로 한 번 더 거르기: 첫 화면에 파충류·사육장이 확실히 보이게 일반 원칙: 타겟팅 · 타겟 중복", "flag": false}, {"note": "09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "order": 3, "section": "인스타그램 계정 점검", "html": "<h4>프로필 소개 문구<\/h4><ul><li>현재 \"3d용품점, 도매 문의 DM\"만으로는 광고 보고 들어온 사람이 <strong>뭘 파는 곳인지 알기 어려움<\/strong><\/li><li><strong>대상과 제품을 명확하게<\/strong> 적기<ul><li>예) \"레오파드게코·크레 사육장 꾸미기 | 3D 프린팅 은신처 | 맞춤 제작\"<\/li><\/ul><\/li><\/ul><h4>프로페셔널 계정 여부 확인<\/h4><ul><li>킵그로우 이용 조건 (<a href=\"#\" class=\"note-link\" data-note=\"05_메타/스마트스토어_픽셀_킵그로우.md\">킵그로우<\/a>)<\/li><li>확인 방법: <strong>프로필 편집 → 계정 유형이 \"비즈니스\" 또는 \"크리에이터\"<\/strong>인지 확인<\/li><\/ul>", "text": "프로필 소개 문구 현재 \"3d용품점, 도매 문의 DM\"만으로는 광고 보고 들어온 사람이 뭘 파는 곳인지 알기 어려움  대상과 제품을 명확하게 적기 예) \"레오파드게코·크레 사육장 꾸미기  3D 프린팅 은신처  맞춤 제작\"  프로페셔널 계정 여부 확인 킵그로우 이용 조건 (킵그로우) 확인 방법: 프로필 편집 → 계정 유형이 \"비즈니스\" 또는 \"크리에이터\" 인지 확인", "flag": false}, {"note": "09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "order": 4, "section": "마진율별 손익분기 (평균 구매 30,000원)", "html": "<div class='tbl'><table><thead><tr><th>마진율<\/th><th>주문당 남는 돈<\/th><th>메타상 손익분기 CPA<\/th><th>×10 기준 일예산<\/th><\/tr><\/thead><tbody><tr><td>30%<\/td><td>9,000원<\/td><td>약 7,100원<\/td><td>약 7.1만 원<\/td><\/tr><tr><td>40%<\/td><td>12,000원<\/td><td>약 9,500원<\/td><td>약 9.5만 원<\/td><\/tr><tr><td>50%<\/td><td>15,000원<\/td><td>약 11,900원<\/td><td>약 11.9만 원<\/td><\/tr><\/tbody><\/table><\/div><ul><li>3만 원 주문에 CPA 5,000원 = <strong>ROAS 6배<\/strong> → 처음부터 기대하긴 어려운 수준<\/li><li>계산법: <a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/CPA_ROAS_손익분기.md\">CPA · ROAS · 손익분기<\/a>, <a href=\"#\" class=\"note-link\" data-note=\"05_메타/학습단계_예산.md\">일예산 경험칙<\/a><\/li><li>총예산 200만 원(수수료+VAT 포함) → 실제 광고비 1,581,028원 (<a href=\"#\" class=\"note-link\" data-note=\"04_기초개념/예산_수수료_VAT_계산.md\">계산<\/a>)<\/li><\/ul>", "text": "마진율  주문당 남는 돈  메타상 손익분기 CPA  ×10 기준 일예산   30%  9,000원  약 7,100원  약 7.1만 원   40%  12,000원  약 9,500원  약 9.5만 원   50%  15,000원  약 11,900원  약 11.9만 원  3만 원 주문에 CPA 5,000원 = ROAS 6배 → 처음부터 기대하긴 어려운 수준 계산법: CPA · ROAS · 손익분기, 일예산 경험칙 총예산 200만 원(수수료+VAT 포함) → 실제 광고비 1,581,028원 (계산)", "flag": false}, {"note": "09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "order": 5, "section": "일예산 5만 원 운영 구조 (의견)", "html": "<ol><li><strong>구조<\/strong>: 판매 캠페인 1개 + 광고 세트 1개 (일 5만 원)<\/li><li><strong>소재<\/strong>: 총 2~3개 (단품 1 + 세트 1~2), 각 광고는 <strong>해당 상품 픽셀샵 URL<\/strong>로 연결 (소재별 성과 구분)<\/li><li><strong>기간<\/strong>: 7일간 수정 금지<\/li><li><strong>판단 기준<\/strong>: CPA가 아니라 <strong>주문당 남는 돈<\/strong>과 ROAS<ul><li>예: 단품 CPA 12,000원 / 세트 CPA 16,000원이어도 세트 주문당 마진이 8,000원 더 크면 세트가 이득<\/li><\/ul><\/li><li><strong>메타가 한쪽만 밀 때<\/strong>: Push delivery 또는 크리에이티브 테스트 기능 (<a href=\"#\" class=\"note-link\" data-note=\"05_메타/소재_테스트.md\">소재 테스트<\/a>)<\/li><li><strong>최적화 이벤트<\/strong>: 구매로 시작, 구매가 너무 적으면 콘텐츠 조회로 전환 검토. 학습 제한 자체는 실패 아님 → 실제 CPA가 손익분기 아래인지가 기준<\/li><\/ol><p><strong>순차 테스트 (한 번에 한 변수만)<\/strong><\/p><ul><li>1라운드: 단품 vs 세트 → 무엇을 팔지<\/li><li>2라운드: 이긴 쪽으로 각도 → 감성 인테리어 vs 기능(탈피·은신)<\/li><li>3라운드: 형식 → 사진 vs 짧은 영상<\/li><li>이후: 이긴 조합 유지 + 크리에이티브 테스트로 새 아이디어 하나씩<\/li><li>광고비 없이 미리 거르기: 인스타 오가닉 게시물 반응(저장·공유·댓글) 좋은 것을 소재 후보로<\/li><\/ul>", "text": "1. 구조 : 판매 캠페인 1개 + 광고 세트 1개 (일 5만 원) 2. 소재 : 총 2~3개 (단품 1 + 세트 1~2), 각 광고는 해당 상품 픽셀샵 URL 로 연결 (소재별 성과 구분) 3. 기간 : 7일간 수정 금지 4. 판단 기준 : CPA가 아니라 주문당 남는 돈 과 ROAS 예: 단품 CPA 12,000원 / 세트 CPA 16,000원이어도 세트 주문당 마진이 8,000원 더 크면 세트가 이득 5. 메타가 한쪽만 밀 때 : Push delivery 또는 크리에이티브 테스트 기능 (소재 테스트) 6. 최적화 이벤트 : 구매로 시작, 구매가 너무 적으면 콘텐츠 조회로 전환 검토. 학습 제한 자체는 실패 아님 → 실제 CPA가 손익분기 아래인지가 기준 순차 테스트 (한 번에 한 변수만) 1라운드: 단품 vs 세트 → 무엇을 팔지 2라운드: 이긴 쪽으로 각도 → 감성 인테리어 vs 기능(탈피·은신) 3라운드: 형식 → 사진 vs 짧은 영상 이후: 이긴 조합 유지 + 크리에이티브 테스트로 새 아이디어 하나씩 광고비 없이 미리 거르기: 인스타 오가닉 게시물 반응(저장·공유·댓글) 좋은 것을 소재 후보로", "flag": false}, {"note": "09_실무/2026-10-15_가공집GGZ_메타광고_플랜.md", "order": 6, "section": "한 달 안에 성과 보여주기 플랜 (의견)", "html": "<h4>0주차: 준비 (2~4일, 새 촬영 시 일주일 안팎) (추정)<\/h4><div class='tbl'><table><thead><tr><th>작업<\/th><th>예상 시간<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>킵그로우 설치<\/td><td>반나절~1일<\/td><td>계정 조건이 갖춰진 경우. 테스트 구매로 이벤트 확인 권장 (<a href=\"#\" class=\"note-link\" data-note=\"05_메타/스마트스토어_픽셀_킵그로우.md\">킵그로우<\/a>)<\/td><\/tr><tr><td>세트 상품 등록<\/td><td>반나절~1일<\/td><td>세트 구성·가격 결정은 광고주 결정 필요<\/td><\/tr><tr><td>소재 준비<\/td><td>기존 사진 1일 / 새 촬영 3~5일<\/td><td><\/td><\/tr><tr><td>광고 세팅 + 검수<\/td><td>1일<\/td><td>메타 검수 보통 하루<\/td><\/tr><\/tbody><\/table><\/div><ul><li>계정·결정이 필요한 작업은 <strong>광고주에게 바로 요청해 병행<\/strong><\/li><li>1라운드는 <strong>기존 사진으로 먼저 시작<\/strong>, 새 촬영은 3주차 테스트용<\/li><\/ul><h4>1
